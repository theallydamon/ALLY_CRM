name: Test assistant connector
on:
  pull_request:
    paths: ["functions/**", "workers/**", ".github/workflows/assistant-tests.yml"]
  push:
    branches: [main]
    paths: ["functions/**", "workers/**", ".github/workflows/assistant-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run connector and OAuth tests
        run: node --test
        working-directory: functions
  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
        working-directory: workers
      - run: npm test
        working-directory: workers
      - run: npm run test:runtime
        working-directory: workers
        env:
          WRANGLER_SEND_METRICS: "false"
