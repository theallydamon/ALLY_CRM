/* ---- tasks ---- */
function AdminTasks({ data, setData }) {
  const [title, setTitle] = useState(""); const [description, setDescription] = useState(""); const [due, setDue] = useState("");
  /* staged links: built up BEFORE the task is saved, so one capture can carry the Basecamp thread,
     the brief and the reference doc all at once instead of one URL and then a round of editing.
     Each entry gets its own label, defaulting to the bare domain/path if you can't be bothered. */
  const [draftLinks, setDraftLinks] = useState([]);
  const [linkLabel, setLinkLabel] = useState(""); const [linkUrl, setLinkUrl] = useState("");
  const addDraftLink = () => {
    const raw = linkUrl.trim(); if (!raw) return;
    const url = raw.startsWith("http") ? raw : `https://${raw}`;
    setDraftLinks((ls) => [...ls, { id: uid(), url, label: linkLabel.trim() || raw.replace(/^https?:\/\//, "").slice(0, 30) }]);
    setLinkLabel(""); setLinkUrl("");
  };
  const removeDraftLink = (id) => setDraftLinks((ls) => ls.filter((l) => l.id !== id));
  const add = () => {
    const t = title.trim(); if (!t) return;
    /* a URL still sitting in the input when you hit Capture counts — no silent loss for forgetting
       to press Enter/+ on the last one. */
    const trailing = linkUrl.trim();
    const links = trailing
      ? [...draftLinks, { id: uid(), url: trailing.startsWith("http") ? trailing : `https://${trailing}`, label: linkLabel.trim() || trailing.replace(/^https?:\/\//, "").slice(0, 30) }]
      : draftLinks;
    const taskDue = due || defaultTaskDue();
    setData((d) => ({ ...d, tasks: [{ id: uid(), title: t, description: description.trim(), links, status: "To do", created: new Date().toISOString().slice(0, 10), due: taskDue, priority: priorityForNewTask(taskDue), lastProgress: null }, ...d.tasks] }));
    setTitle(""); setDescription(""); setDue(""); setDraftLinks([]); setLinkLabel(""); setLinkUrl("");
  };
  /* drag/drop now sets PRIORITY, not status — the columns are the priority levels.
     A due date normally drives priority continuously (PriorityControls' dateTarget effect), so a
     manual drag that disagrees with the date would be snapped straight back on the next render.
     Hence: dropping into a column that contradicts the stored due date clears that date, handing
     manual control back — exactly what clicking an L/M/H button already does in that situation.
     Dropping into a column that agrees with the date leaves the date alone.
     Non-priority = `paused`, the existing "on the board but not a live priority" state, which also
     drops it off the Priorities dashboard (collectPriorityTasks skips paused). */
  const moveToColumn = (id, col) => setData((d) => ({ ...d, tasks: d.tasks.map((t) => {
    if (t.id !== id) return t;
    if (col === "None") return { ...t, paused: true, due: null };
    const dateTarget = t.due && !t.paused ? priorityFromDueDate(daysUntil(t.due)) : null;
    const clearsDue = dateTarget && dateTarget !== col;
    return { ...t, priority: col, paused: false, ...(clearsDue ? { due: null } : {}) };
  }) }));
  const update = (id, p) => setData((d) => ({ ...d, tasks: d.tasks.map((t) => (t.id === id ? { ...t, ...p } : t)) }));
  const remove = (id) => setData((d) => ({ ...d, tasks: d.tasks.filter((t) => t.id !== id) }));
  const openTasks = data.tasks.filter((t) => t.status !== "Done");
  const counts = ADMIN_TASK_COLS.reduce((acc, c) => ({ ...acc, [c]: openTasks.filter((t) => adminTaskBucket(t) === c).length }), {});
  return (
    <section>
      <SectionHead title="Admin task capture" sub="One place for the strays. Cards are grouped by priority — drag one to a different column to re-rank it. Tasks tied to a specific creator live on their own subtab instead." />
      {/* live rollup, replaces the old by-source bar chart: what is actually sitting in each priority
          right now. Recomputed from `openTasks` every render, so it can never drift from the board. */}
      <div className="rounded-2xl p-4 mb-5" style={{ ...card, borderRadius: 18 }}>
        <div className="flex items-baseline justify-between mb-3">
          <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: MUT }}>Open tasks by priority</div>
          <div style={{ fontSize: 12, color: MUT }}>{openTasks.length} open</div>
        </div>
        <div className="grid gap-2" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))" }}>
          {ADMIN_TASK_COLS.map((c) => {
            const tint = ADMIN_COL_TINT[c];
            const n = counts[c];
            return (
              <div key={c} className="rounded-xl px-3 py-2.5" style={{ background: n ? `${tint}14` : FILL, border: `1px solid ${n ? tint : LINE}`, borderRadius: 14 }}>
                <div style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 28, lineHeight: 1, color: n ? tint : FAINT }}>{n}</div>
                <div style={{ fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", color: MUT, marginTop: 5 }}>{ADMIN_COL_LABEL[c]}</div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="rounded-2xl p-4 mb-6" style={{ ...card, borderRadius: 16 }}>
        <div className="flex gap-2 flex-wrap mb-2">
          <input value={title} onChange={(e) => setTitle(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="What came in?" className="flex-1 rounded-lg px-3 py-2" style={{ ...inputStyle, minWidth: 200 }} />
          <input type="date" value={due} onChange={(e) => setDue(e.target.value)} className="rounded-lg px-3 py-2" style={{ ...inputStyle, width: 150 }} aria-label="Due date (optional)" title="Due date (optional) — auto-sets the priority" />
        </div>
        {draftLinks.length > 0 && (
          <div className="flex gap-1.5 flex-wrap mb-2">
            {draftLinks.map((l) => (
              <span key={l.id} className="rounded-full px-2.5 py-1 flex items-center gap-1.5" style={{ background: FILL, border: `1px solid ${LINE}`, fontSize: 11.5 }}>
                <ExternalLink size={10} color={C.sky} />
                <span style={{ color: C.sky }}>{l.label}</span>
                <button onClick={() => removeDraftLink(l.id)} style={{ ...iconBtn, padding: 0 }} aria-label={`Remove ${l.label}`} title="Remove link"><X size={10} /></button>
              </span>
            ))}
          </div>
        )}
        <div className="flex gap-2 flex-wrap mb-2">
          <input value={linkLabel} onChange={(e) => setLinkLabel(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addDraftLink()} placeholder="Link name" className="rounded-lg px-3 py-2" style={{ ...inputStyle, width: 130 }} aria-label="Link name" />
          <input value={linkUrl} onChange={(e) => setLinkUrl(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addDraftLink()} placeholder="URL (optional) — Enter or + to add another" className="flex-1 rounded-lg px-3 py-2" style={{ ...inputStyle, minWidth: 180 }} aria-label="Link URL" />
          <button onClick={addDraftLink} disabled={!linkUrl.trim()} style={{ ...pillGhost, padding: "8px 14px", opacity: linkUrl.trim() ? 1 : 0.4, cursor: linkUrl.trim() ? "pointer" : "not-allowed" }} title="Add this link and clear the fields for the next one"><Plus size={14} /></button>
        </div>
        <div className="flex gap-2 flex-wrap items-start">
          <GrowingTextarea value={description} onChange={setDescription} placeholder="Description (optional) — what to actually do. Keeps the title short." rows={2} className="flex-1 rounded-lg px-3 py-2" style={{ ...inputStyle, minWidth: 200, lineHeight: 1.45 }} />
          <button onClick={add} style={pillDark}><Plus size={14} style={{ display: "inline", marginRight: 4 }} />Capture</button>
        </div>
      </div>
      <div style={{ borderTop: `1px solid ${LINE}`, margin: "-2px 0 20px" }} />
      <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))" }}>
        {ADMIN_TASK_COLS.map((col) => {
          const items = openTasks.filter((t) => adminTaskBucket(t) === col);
          const tint = ADMIN_COL_TINT[col];
          return (
            <div key={col} className="rounded-2xl p-3" onDragOver={(e) => { if (!Array.from(e.dataTransfer.types).includes(ADMIN_TASK_MIME)) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; }} onDrop={(e) => { e.preventDefault(); const id = e.dataTransfer.getData(ADMIN_TASK_MIME); if (id) moveToColumn(id, col); }} style={{ ...cardSoft, borderRadius: 16 }}>
              <div className="flex items-center justify-between mb-3 px-1"><span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 600, fontSize: 12, letterSpacing: "0.04em", textTransform: "uppercase", color: tint }}>{ADMIN_COL_LABEL[col]}</span><span style={{ fontSize: 12, color: MUT }}>{items.length}</span></div>
              <div className="flex flex-col gap-2">
                {items.map((t) => <TaskCard key={t.id} t={t} onUpdate={(p) => update(t.id, p)} onRemove={() => remove(t.id)} />)}
                {items.length === 0 && <div className="rounded-xl p-3 text-center" style={{ border: `1px dashed ${LINE}`, fontSize: 12, color: FAINT, borderRadius: 12 }}>Empty</div>}
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

/* single admin task card. Links are a persistent, always-addable labelled list (same pattern as
   Creators' Links section and the capture form above) rather than a single field, so you can keep
   attaching new URLs to a task well after it was first captured, none overwriting the last. No
   creator tagging here anymore — a task tied to a specific creator belongs on that creator's own
   card instead, and no source pill either (see ADMIN_TASK_COLS). Description used to always stay
   fully visible here (the one place in the CRM where it never collapsed) — now it expands/collapses
   on card click same as everywhere else, via its own lifted open state.
   `col` and the ←/→ column arrows are gone with the Doing column: the card's own PriorityControls
   already move it between the priority columns, and dragging does the same thing. */
function TaskCard({ t, onUpdate, onRemove }) {
  const [descOpen, setDescOpen] = useState(true);
  const [linkDraft, setLinkDraft] = useState("");
  const [labelDraft, setLabelDraft] = useState("");
  const tint = ADMIN_COL_TINT[adminTaskBucket(t)];
  const done = t.status === "Done";
  const links = t.links || [];
  const addLink = () => {
    const raw = linkDraft.trim(); if (!raw) return;
    const url = raw.startsWith("http") ? raw : `https://${raw}`;
    onUpdate({ links: [...links, { id: uid(), url, label: labelDraft.trim() || url.replace(/^https?:\/\//, "").slice(0, 30) }] });
    setLinkDraft(""); setLabelDraft("");
  };
  const removeLink = (id) => onUpdate({ links: links.filter((l) => l.id !== id) });
  /* same round checkbox as MiniTaskRow/Life Admin — jumps straight to Done (skipping "Doing") so
     you don't have to hit the forward arrow twice, and un-ticking sends it back to "To do". The
     "←" back arrow below still exists for stepping through columns one at a time if you want that
     instead — this is just a direct one-click complete/undo, now available right here instead of
     only from the Mama/main hub's tiny "mark complete" dot. */
  const toggleDone = () => onUpdate(done ? { status: "To do", doneAt: null } : { status: "Done", doneAt: Date.now() });
  return (
    <div data-nav-id={t.id} data-scroll-drag draggable onDragStart={(e) => { e.dataTransfer.setData(ADMIN_TASK_MIME, t.id); e.dataTransfer.effectAllowed = "move"; }} onClick={() => { if (hasTextSelection()) return; setDescOpen((v) => !v); }} className="rounded-xl p-2" style={{ cursor: "grab", ...card, borderRadius: 12, borderLeft: `2px solid ${tint}` }}>
      <div className="flex items-center gap-2">
        <button onClick={(e) => { e.stopPropagation(); toggleDone(); }} aria-label="Toggle done" title={done ? "Mark not done" : "Mark done"} style={{ width: 18, height: 18, borderRadius: 6, cursor: "pointer", flexShrink: 0, background: done ? C.mint : C.card, border: `1px solid ${done ? C.mint : LINE}`, display: "flex", alignItems: "center", justifyContent: "center" }}>{done && <Check size={11} color="#fff" strokeWidth={3} />}</button>
        <div className="flex-1 min-w-0" style={{ fontSize: 13.5, textDecoration: done ? "line-through" : "none", opacity: done ? 0.55 : 1 }}><InlineEdit value={t.title} onChange={(v) => onUpdate({ title: v })} bubbleClicks /></div>
      </div>
      <div style={{ fontSize: 11.5, color: MUT, marginTop: 2 }}><InlineEditArea value={t.description || ""} onChange={(v) => onUpdate({ description: v })} placeholder="Add a description…" open={descOpen} onToggle={() => setDescOpen((v) => !v)} /></div>
      <div className="flex items-center gap-2 mt-1" style={{ fontSize: 11, color: MUT }}>
        <span className="ml-auto flex gap-1">
          <button onClick={(e) => { e.stopPropagation(); onRemove(); }} style={iconBtn} aria-label="Delete"><X size={12} /></button>
        </span>
      </div>
      {links.length > 0 && (
        <div onClick={(e) => e.stopPropagation()} className="flex gap-1.5 flex-wrap mt-1.5">
          {links.map((l) => (
            <span key={l.id} className="rounded-full px-2 py-0.5 flex items-center gap-1" style={{ background: FILL, border: `1px solid ${LINE}`, fontSize: 10.5 }}>
              <a href={l.url} target="_blank" rel="noreferrer" style={{ color: C.sky, textDecoration: "none", display: "flex", alignItems: "center", gap: 3 }}><ExternalLink size={10} />{l.label}</a>
              <button onClick={() => removeLink(l.id)} style={{ ...iconBtn, padding: 0 }} aria-label="Remove link"><X size={9} /></button>
            </span>
          ))}
        </div>
      )}
      <div onClick={(e) => e.stopPropagation()} className="flex gap-1.5 mt-1.5">
        <input value={labelDraft} onChange={(e) => setLabelDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addLink()} placeholder="Name" className="rounded-lg px-2 py-1" style={{ ...inputStyle, fontSize: 10.5, width: 68 }} aria-label="Link name" />
        <input value={linkDraft} onChange={(e) => setLinkDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addLink()} placeholder="Add a URL…" className="flex-1 rounded-lg px-2 py-1" style={{ ...inputStyle, fontSize: 10.5, minWidth: 60 }} aria-label="Link URL" />
        <button onClick={addLink} style={{ ...iconBtn, fontSize: 10.5, background: FILL, border: `1px solid ${LINE}`, borderRadius: 6, padding: "3px 9px" }} title="Add link">+</button>
      </div>
      {!done && <PriorityControls item={t} onChange={onUpdate} />}
    </div>
  );
}

const inputStyle = { background: "rgba(255,255,255,0.05)", border: `1px solid ${LINE}`, color: C.ink, fontSize: 13.5, fontFamily: "'Bricolage Grotesque', sans-serif" };
const darkInput = { background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.14)", color: "#fff", fontSize: 13.5, fontFamily: "'Bricolage Grotesque', sans-serif" };
const iconBtn = { background: "transparent", border: "none", color: MUT, cursor: "pointer", padding: 4, borderRadius: 6, fontFamily: "'Bricolage Grotesque', sans-serif" };
const pillDark = { background: "#F2F2F4", color: "#0B0B0D", border: "none", fontWeight: 600, fontSize: 13, borderRadius: 99, padding: "8px 16px", cursor: "pointer", fontFamily: "'Bricolage Grotesque', sans-serif" };
const pillGhost = { background: "transparent", color: C.ink, border: `1px solid ${LINE}`, fontWeight: 500, fontSize: 13, borderRadius: 99, padding: "8px 16px", cursor: "pointer", fontFamily: "'Bricolage Grotesque', sans-serif" };
const pillAccent = (tint) => ({ background: tint, color: onTint(tint), border: "none", fontWeight: 600, fontSize: 13, borderRadius: 10, padding: "8px 16px", cursor: "pointer", fontFamily: "'Bricolage Grotesque', sans-serif" });

function SectionHead({ title, sub, action }) {
  return (
    <div className="flex items-end justify-between gap-3 mb-4 flex-wrap">
      <div><h2 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 27, margin: 0, letterSpacing: "-0.01em" }}>{title}</h2></div>
      {action}
    </div>
  );
}
function AddBtn({ onClick, label }) { return <button onClick={onClick} className="flex items-center gap-1.5" style={pillDark}><Plus size={14} />{label}</button>; }
function Label({ text }) { return <div style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: MUT, marginBottom: 5 }}>{text}</div>; }
function Empty({ text }) { return <div className="rounded-2xl p-8 text-center mt-2" style={{ border: `1px dashed ${LINE}`, color: MUT, fontSize: 13, borderRadius: 16 }}><Sparkles size={16} style={{ display: "inline", marginBottom: 6, color: FAINT }} /><br />{text}</div>; }
/* every title/field across every pillar goes through this one component, so this is the single
   place that defines how editing works everywhere: double-click (or double-tap) the text to open
   it up, edit, then Enter/click away to save — Escape reverts. Sits as plain text the rest of the
   time so a stray single click/tap (e.g. on a card that also navigates elsewhere) doesn't
   accidentally start an edit. */
/* `bubbleClicks` (opt-in) changes only WHERE a single click is swallowed. Normally the whole
   full-width field eats the click so a stray tap never leaks to a card behind it. With bubbleClicks
   on, only the actual text glyphs swallow the click (and still double-click to edit) — any empty
   space beside/around the text lets the click fall through to the parent card, so tapping the blank
   part of a card's top row expands/collapses it while double-tapping the title still edits. */
function InlineEdit({ value, onChange, placeholder, strong, dim, bubbleClicks }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value || "");
  const ref = useRef(null);
  useEffect(() => { if (!editing) setDraft(value || ""); }, [value, editing]);
  useEffect(() => { if (editing && ref.current) { ref.current.focus(); ref.current.select(); } }, [editing]);
  const commit = () => { setEditing(false); if (draft !== (value || "")) onChange(draft); };
  const cancel = () => { setDraft(value || ""); setEditing(false); };
  const sharedFont = { color: dim ? MUT : C.ink, fontSize: strong ? 15 : 13, fontWeight: strong ? 600 : 400, fontFamily: "'Bricolage Grotesque', sans-serif" };
  if (editing) {
    return (
      <input ref={ref} value={draft} onChange={(e) => setDraft(e.target.value)} onBlur={commit}
        onClick={(e) => e.stopPropagation()}
        onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); commit(); } else if (e.key === "Escape") { e.preventDefault(); cancel(); } }}
        placeholder={placeholder || ""} className="w-full"
        style={{ ...sharedFont, background: "transparent", border: `1px solid ${C.lilac}`, borderRadius: 6, padding: "2px 4px", margin: "-2px -4px" }} />
    );
  }
  const textStyle = { ...sharedFont, color: value ? sharedFont.color : FAINT, border: "1px solid transparent", borderRadius: 6, padding: "2px 4px", margin: "-2px -4px", cursor: "text", minHeight: "1.3em", whiteSpace: "pre-wrap", wordBreak: "break-word" };
  if (bubbleClicks) {
    return (
      <div className="w-full" style={{ minHeight: "1.3em" }}>
        <span onClick={(e) => e.stopPropagation()} onDoubleClick={(e) => { e.stopPropagation(); setEditing(true); }} title="Double-click to edit"
          style={{ ...textStyle, display: "inline-block", maxWidth: "100%" }}>
          {value || placeholder || ""}
        </span>
      </div>
    );
  }
  return (
    <div onClick={(e) => e.stopPropagation()} onDoubleClick={(e) => { e.stopPropagation(); setEditing(true); }} title="Double-click to edit" className="w-full"
      style={textStyle}>
      {value || placeholder || ""}
    </div>
  );
}
/* same double-click-to-edit interaction as InlineEdit, but for fields that can hold a long,
   multi-paragraph block of text (e.g. a task description someone pastes a whole script into).
   InlineEdit's edit mode is a plain <input>, which can't show line breaks or wrap — a long paste
   just scrolled off sideways as a single collapsed line even though the view mode (whiteSpace:
   pre-wrap div) displayed it as full paragraphs. This swaps in an auto-growing textarea for the
   edit state instead, so what you see while editing matches what you see once you commit. Enter
   inserts a newline like a normal textarea; blur or Escape leaves edit mode (commit/cancel), and
   Cmd/Ctrl+Enter commits explicitly without needing to click away. */
/* `open`/`onToggle` are optional, same controlled pattern as AutoTextarea/ScriptBox: pass them so a
   parent card's click can expand/collapse this description too (this used to always stay fully
   visible — overridden so every description box in the CRM behaves the same way instead of Admin
   Tasks/mini-task descriptions being the one exception). Omit them and it stays exactly as before,
   always fully visible with no collapse. Collapsing only affects the view (non-editing) state —
   double-click still opens the full auto-growing textarea to edit, uncollapsed, same as ever. */
function InlineEditArea({ value, onChange, placeholder, dim, open, onToggle }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value || "");
  const [collapsedState, setCollapsedState] = useState(false);
  const controlled = open !== undefined;
  const collapsed = controlled ? !open : collapsedState;
  const toggle = () => (controlled ? onToggle && onToggle() : setCollapsedState((v) => !v));
  const ref = useRef(null);
  useEffect(() => { if (!editing) setDraft(value || ""); }, [value, editing]);
  const resize = () => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  };
  useEffect(() => { if (editing && ref.current) { ref.current.focus(); ref.current.select(); resize(); } }, [editing]);
  useLayoutEffect(() => { if (editing) resize(); }, [draft, editing]);
  const commit = () => { setEditing(false); if (draft !== (value || "")) onChange(draft); };
  const cancel = () => { setDraft(value || ""); setEditing(false); };
  const sharedFont = { color: dim ? MUT : C.ink, fontSize: 13, fontWeight: 400, fontFamily: "'Bricolage Grotesque', sans-serif" };
  const long = (value || "").length > 120 || (value || "").includes("\n");
  if (editing) {
    return (
      <textarea ref={ref} value={draft} onChange={(e) => setDraft(e.target.value)} onInput={resize} onBlur={commit}
        onClick={(e) => e.stopPropagation()}
        onKeyDown={(e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); } else if (e.key === "Escape") { e.preventDefault(); cancel(); } }}
        placeholder={placeholder || ""} rows={1} className="w-full"
        style={{ ...sharedFont, background: "transparent", border: `1px solid ${C.lilac}`, borderRadius: 6, padding: "2px 4px", margin: "-2px -4px", resize: "none", overflow: "hidden", lineHeight: 1.4, whiteSpace: "pre-wrap", wordBreak: "break-word", boxSizing: "border-box" }} />
    );
  }
  return (
    <div>
      <div onClick={(e) => e.stopPropagation()} onDoubleClick={(e) => { e.stopPropagation(); setEditing(true); }} title="Double-click to edit"
        style={{ ...sharedFont, color: value ? sharedFont.color : FAINT, border: "1px solid transparent", borderRadius: 6, padding: "2px 4px", margin: "-2px -4px", cursor: "text", minHeight: "1.3em", maxHeight: collapsed ? 40 : "none", overflow: collapsed ? "hidden" : "visible", whiteSpace: "pre-wrap", wordBreak: "break-word", display: "inline-block", maxWidth: "100%" }}>
        {value || placeholder || ""}
      </div>
      {long && (
        <button onClick={(e) => { e.stopPropagation(); toggle(); }} className="flex items-center gap-1 mt-0.5" style={{ ...iconBtn, padding: 0, fontSize: 10, color: FAINT }}>
          {collapsed ? <ChevronDown size={10} /> : <ChevronUp size={10} />}
          <span>{collapsed ? "Expand" : "Collapse"}</span>
        </button>
      )}
    </div>
  );
}
  /* free-text description box used across Deals (caption/instructions/notes), Clients,
       and Life Admin item descriptions — auto-grows to fit whatever is typed or pasted
   in, including a big pasted paragraph, instead of staying pinned to a tiny fixed height. A manual
   collapse/expand toggle appears once there's enough text to be worth tucking away, so a long note
   doesn't have to dominate the card once you're done editing it.
   `open`/`onToggle` are optional: pass them to let a parent card drive the collapse state itself
   (e.g. so clicking anywhere on the card also expands/collapses this box, matching ScriptBox's
   pattern) — omit them and it manages its own state exactly as before. Either way, clicking into
   the textarea itself or the toggle link stops the click from bubbling up to a card-level handler,
   so typing/pasting/collapsing this box never also fires an unrelated card click-toggle. */
function AutoTextarea({ value, onChange, placeholder, open, onToggle }) {
  const [collapsedState, setCollapsedState] = useState(false);
  const controlled = open !== undefined;
  const collapsed = controlled ? !open : collapsedState;
  const toggle = () => (controlled ? onToggle && onToggle() : setCollapsedState((v) => !v));
  const ref = useRef(null);
  /* grows the box to fit whatever's inside it — resized synchronously (useLayoutEffect, so it
     happens before the browser paints, not a tick later) on every value change, AND directly from
     the input event itself (onInput fires on typing, pasting, and cut, before React's own
     onChange/state round-trip even completes) so a big pasted block never has a chance to render
     at the old, tiny height first. Belt and suspenders: either path alone resizes it correctly,
     together they close out any timing gap between "text landed" and "box caught up". */
  const resize = () => {
    const el = ref.current;
    if (!el || collapsed) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  };
  useLayoutEffect(resize, [value, collapsed]);
  const long = (value || "").length > 120 || (value || "").includes("\n");
  return (
    <div>
      <textarea ref={ref} value={value} onClick={(e) => e.stopPropagation()} onChange={(e) => onChange(e.target.value)} onInput={resize} placeholder={placeholder}
        rows={2} className="w-full rounded-lg px-3 py-2"
        style={{ ...inputStyle, lineHeight: 1.45, resize: "vertical", overflow: collapsed ? "hidden" : "auto", maxHeight: collapsed ? 52 : "none", boxSizing: "border-box", whiteSpace: "pre-wrap", overflowWrap: "break-word" }} />
      {long && (
        <button onClick={(e) => { e.stopPropagation(); toggle(); }} className="flex items-center gap-1 mt-1" style={{ ...iconBtn, padding: 0, fontSize: 10, color: FAINT }}>
          {collapsed ? <ChevronDown size={10} /> : <ChevronUp size={10} />}
          <span>{collapsed ? "Expand" : "Collapse"}</span>
        </button>
      )}
    </div>
  );
}

/* lightweight auto-growing textarea for one-off capture composers — the "Description (optional)"
   fields on Life Admin, Admin Tasks, and every MiniTaskList "add a task" row (Deals, Clients,
       Creators all share MiniTaskList). These were plain fixed-height, resize-none
   textareas, so pasting anything longer than the box just sat there needing a scroll instead of
   the box growing to show it — this fixes that the same way AutoTextarea does for the bigger
   Caption/Instructions/Notes boxes, minus the collapse toggle (not useful here: these composers
   clear back to empty the moment you hit Add, there's nothing left to want to tuck away). Resizes
   on every keystroke/paste/cut (onInput) and synchronously before paint on every value change
   (useLayoutEffect), so a big paste never renders squashed into the starting row count first. */
function GrowingTextarea({ value, onChange, onKeyDown, placeholder, rows, className, style }) {
  const ref = useRef(null);
  const resize = () => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  };
  useLayoutEffect(resize, [value]);
  return (
    <textarea ref={ref} value={value} onChange={(e) => onChange(e.target.value)} onInput={resize} onKeyDown={onKeyDown}
      placeholder={placeholder} rows={rows || 1} className={className}
      style={{ ...style, overflow: "hidden", resize: "none", boxSizing: "border-box" }} />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AllyCRM />);
</script>
</body>
</html>
