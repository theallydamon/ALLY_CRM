<!-- Google Identity Services. Provides google.accounts.oauth2 for the Calendar access token.
     Deliberately separate from Firebase Auth: Firebase signs you IN (identity), GIS grants the
     app permission to touch your CALENDAR (authorisation). They are different concerns and
     Firebase's Google provider cannot mint a Calendar access token on its own.
     No integrity attribute: Google does not publish a hash for this endpoint and ships updates
     to it, so any hash we pinned would break the app on their next release. See the SRI note in
     context/04-REDESIGN.md. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
html,body,#root{height:100%;margin:0;background:#0B0B0D;font-family:"Bricolage Grotesque",sans-serif;}
/* dashboard task navigation: brief flash on whatever element scrollAndHighlight() scrolls to,
   so a click on a Priorities/Mama dashboard task chip reads clearly as "here it is" once the
   page lands on the source item. Pure CSS animation on a transient class toggled from JS —
   no React state involved, so it can't be fought by a stray re-render mid-flash. Blinks on/off
   twice over 1s rather than a single fade, so it reads unmistakably as "this one" without
   lingering. */
@keyframes navFlash {
  0%, 50%, 100% { box-shadow: 0 0 0 0 rgba(123,103,224,0); background-color: rgba(123,103,224,0); }
  25%, 75% { box-shadow: 0 0 0 3px rgba(123,103,224,0.9); background-color: rgba(123,103,224,0.18); }
}
.nav-highlight { animation: navFlash 1s steps(1, end); border-radius: 12px; }
</style>

/* ---------- storage shim: window.storage in the app, localStorage in the repo ---------- */
const store = {
  async get(k) {
    if (typeof window !== "undefined" && window.storage && window.storage.get) {
      try { const r = await window.storage.get(k, false); return r ? r.value : null; } catch (e) { return null; }
    }
    try { return localStorage.getItem(k); } catch (e) { return null; }
  },
  async set(k, v) {
    if (typeof window !== "undefined" && window.storage && window.storage.set) {
      try { await window.storage.set(k, v, false); return; } catch (e) {}
    }
    /* Do not report a save as successful if both persistence layers reject it. The visible
       save-state indicator can now truthfully surface a backup problem instead of giving a
       false saved message. */
    try { localStorage.setItem(k, v); return; } catch (e) { throw e; }
  },
};

const score = Math.round((1 + (Math.min(pct, 100) / 100) * 5) * 10) / 10;
return { score, bucket, pct, since };
}
/* pulls every outstanding item from all 6 pillars into one flat, scored list.

should post — this is what puts it on the Content Calendar). Either, both, or neither can be

items.forEach((i) => {

(ally.lifeAdmin.items || []).filter((t) => t.status !== "Done" && !t.paused).forEach((t) => out.push({

    sourceType: "lifeAdmin", navTab: "lifeAdmin", navSub: null, navOpenId: null, chaseOn: t.chaseOn || null,

}

/* every pillar gets its own independent fill ring now — no more competing for a shared 100%.
   Same color banding everywhere so the colors mean the same thing on every card: 0-19% calm (blue),
   20-40% fine (green), 41-80% building up (orange), 81-100%+ needs you today (red). Past 100% is a
   critical/overflow state — the ring caps visually at a full loop but the number keeps climbing. */
function urgencyTint(pct) {
  if (pct >= 81) return C.rose;
  if (pct >= 41) return C.amber;
  if (pct >= 20) return C.mint;
  return C.sky;
}

/* non-content pillars: each task contributes its own fill % based on priority label alone —
   Low 1% / Medium 2.5% / High 5%. A due date doesn't add a second, bigger number on top of that
   anymore (it used to: due-today alone used to contribute 100%, which is how 2 things due today +
   3 things due tomorrow could read as 350%, an obviously broken number). Since a due date already
   drives the priority label automatically (today/overdue -> High, 1-3 days -> Medium, 4+ days ->
   whatever priority you've set, see priorityFromDueDate/PriorityControls), the label alone already
   reflects urgency — no need for a second competing signal. Contributions still sum across every
   open task, uncapped, so a genuinely busy day (several urgent + several medium things at once)
   reads high, realistically landing in the 80s-90s rather than needing to be literally impossible
   to end up looking silly. A pillar that's truly overloaded still reads past 100%, that's intentional
   (it's meant to look like "more than a full day"), it just takes a lot more piled up to get there
   now instead of two or three items alone doing it. */
const PRIORITY_BASE_PCT = { Low: 1, Medium: 5, High: 10 };
/* once something is actually overdue (not just due today), it keeps escalating: +5 percentage
   points for every extra day past its due date, stacked on top of the flat priority contribution
   above. So a High-priority task due today still reads as 5%, same as always, but let it slip to
   1 day overdue and it jumps to 10%, 2 days overdue is 15%, and so on — neglect keeps compounding
   rather than sitting flat, which is the whole point of a ring that's allowed to overflow past
   100%. daysUntilDue comes from computeUrgency (or is pre-set to null for content's _preScored
   pipeline-only ideas), so this only fires for tasks that actually carry a due date. */
function taskFillPercent(t) {
  const base = (t.daysUntilDue != null && t.daysUntilDue < 0) ? PRIORITY_BASE_PCT.High : (PRIORITY_BASE_PCT[t.priority] || PRIORITY_BASE_PCT.Medium);
  const overdueDays = t.daysUntilDue != null && t.daysUntilDue < 0 ? -t.daysUntilDue : 0;
  return base + overdueDays * PRIORITY_BASE_PCT.High;
}
function computePillarFillPercent(tasks) {
  return tasks.reduce((s, t) => s + taskFillPercent(t), 0);
}

function Ring({ pct, tint, size = 66, thick = 8, label, sub }) {
  const r = (size - thick) / 2, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={label ? `${label} ${sub || ""}` : `${Math.round(pct * 100)} percent`} style={{ flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(28,28,34,0.08)" strokeWidth={thick} />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={tint} strokeWidth={thick} strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c * (1 - Math.min(1, pct))} transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset 0.6s ease" }} />
      {label !== undefined && <text x={size / 2} y={sub ? size / 2 - size * 0.09 : size / 2} textAnchor="middle" dominantBaseline="central" fill={C.ink} style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontSize: size * 0.24, fontWeight: 700 }}>{label}</text>}
      {sub && <text x={size / 2} y={size / 2 + size * 0.17} textAnchor="middle" dominantBaseline="central" fill={MUT} style={{ fontSize: size * 0.11, letterSpacing: "0.06em" }}>{sub}</text>}
    </svg>
  );
}

function Donut({ segments, size = 150, thick = 20, centerTop, centerSub }) {
  const r = (size - thick) / 2, c = 2 * Math.PI * r;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  let off = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label="distribution donut chart">
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(28,28,34,0.06)" strokeWidth={thick} />
      {segments.map((seg, i) => {
        const frac = seg.value / total, dash = frac * c;
        const el = <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={seg.color} strokeWidth={thick}
          strokeDasharray={`${dash} ${c - dash}`} strokeDashoffset={-off} transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dasharray 0.5s ease" }} />;
        off += dash; return el;
      })}
      {centerTop !== undefined && <text x={size / 2} y={centerSub ? size / 2 - size * 0.07 : size / 2} textAnchor="middle" dominantBaseline="central" fill={C.ink} style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontSize: size * 0.2, fontWeight: 700 }}>{centerTop}</text>}
      {centerSub && <text x={size / 2} y={size / 2 + size * 0.15} textAnchor="middle" dominantBaseline="central" fill={MUT} style={{ fontSize: size * 0.075, letterSpacing: "0.08em", textTransform: "uppercase" }}>{centerSub}</text>}
    </svg>
  );
}

function Bars({ data, height = 130 }) {
  const max = Math.max(...data.map((d) => d.value), 1);
  return (
    <div className="flex items-end justify-between gap-2" style={{ height }}>
      {data.map((d, i) => (
        <div key={i} className="flex flex-col items-center gap-1.5" style={{ flex: 1, height: "100%", justifyContent: "flex-end" }}>
          <span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontSize: 13, fontWeight: 700, color: d.value ? C.ink : FAINT }}>{d.value}</span>
          <div style={{ width: "100%", maxWidth: 34, height: `${(d.value / max) * (height - 44)}px`, minHeight: 4, borderRadius: 8, background: d.color, transition: "height 0.5s ease" }} />
          <span style={{ fontSize: 10.5, color: MUT, textAlign: "center", lineHeight: 1.1 }}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

function Bar({ pct, tint }) {
  return (
    <div style={{ height: 8, borderRadius: 99, background: "rgba(28,28,34,0.07)", overflow: "hidden" }}>
      <div style={{ height: "100%", width: `${Math.min(100, Math.round(pct * 100))}%`, borderRadius: 99, background: tint, transition: "width 0.5s ease" }} />
    </div>
  );
}

   What makes that possible is that CONSENT and TOKENS are different things.

     until revoked at myaccount.google.com/permissions. Nothing in this app stores it or can lose it.
   * A token is the short-lived part, about an hour. It is deliberately never persisted (02-GOAL.md).

   Because consent already exists, `requestAccessToken({ prompt: "" })` returns a fresh token with
   NO popup, NO user gesture and NO UI whatsoever. So the app simply does that itself:

     - once on load, whenever signed into the CRM
     - again a few minutes before each token expires, on a timer

   The result is a connection that behaves as permanent while holding nothing sensitive. There is
   no flag to get out of sync, and no button to click. An earlier version gated the load attempt on
   a localStorage flag; that was wrong, because a brand-new flag makes an already-consented account
   look unconnected and re-prompts for no reason. Never reintroduce it.

   A silent attempt that fails is a normal, expected event — access revoked at Google, or offline.
   It must stay quiet: only the small status dot changes. Do not surface a prompt on page load.

   WHAT CANNOT BE DONE: a token that never expires. That requires a refresh token, which Google only
   issues to a confidential client authenticating with a client secret, i.e. a server. This app is
   browser-only and must never contain a secret, so background renewal above is the correct and
   complete answer, not a workaround. */

/* Unified Google Token Manager: single source of truth for the Google access token for Calendar & Sheets. */
const googleTokenManager = {
  token: null, // { value, expiresAt }
  listeners: new Set(),
  client: null,
  clientScope: "",
  revoked: false,
  silent: true,
  connecting: false,

  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },

  notify() {
    this.listeners.forEach((fn) => fn());
  },

  setToken(accessToken, expiresInSeconds) {
    const expiresAt = Date.now() + Math.max(60, (Number(expiresInSeconds) || 3600) - 120) * 1000;
    this.token = { value: accessToken, expiresAt };
    this.revoked = false;
    this.notify();
  },

  clearToken() {
    this.token = null;
    this.notify();
  },

  resetForAccount() {
    this.token = null;
    this.client = null;
    this.clientScope = "";
    this.revoked = false;
    this.notify();
  },

  getToken() {
    if (this.token && Date.now() < this.token.expiresAt - CAL_EXPIRY_MARGIN_MS) {
      return this.token.value;
    }
    return null;
  },

  isValid() {
    return !!this.getToken();
  },

  requestToken(silent = true, prompt = "", scope = ALL_FEATURE_SCOPES) {
    if (this.revoked) return;
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return;
    this.silent = silent;
    this.connecting = true;
    this.notify();

    if (!this.client || this.clientScope !== scope) {
      this.clientScope = scope;
      this.client = window.google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        hint: (() => { try { return firebase.auth().currentUser.email; } catch (e) { return undefined; } })(),
        scope,
        callback: (resp) => {
          this.connecting = false;
          if (resp && resp.access_token) {
            this.setToken(resp.access_token, resp.expires_in);
          } else {
            this.notify();
          }
        },
        error_callback: () => {
          this.connecting = false;
          this.notify();
        },
      });
    }
    this.client.requestAccessToken({ hint: (() => { try { return firebase.auth().currentUser.email; } catch (e) { return undefined; } })(), prompt: prompt !== undefined ? prompt : (silent ? "" : "consent") });
  },

  revoke() {
    if (this.token && this.token.value && window.google && window.google.accounts && window.google.accounts.oauth2) {
      try { window.google.accounts.oauth2.revoke(this.token.value); } catch (e) {}
    }
    this.revoked = true;
    this.clearToken();
  }
};

/* Unified Hook owning Google OAuth token lifecycle for both Calendar and Skit Registry */
function useCalendarAuth(crmUser) {
  const [tokenState, setTokenState] = useState(() => ({ value: googleTokenManager.getToken(), valid: googleTokenManager.isValid() }));
  const [calendars, setCalendars] = useState(null);
  const [account, setAccount] = useState("");
  const [calError, setCalError] = useState("");
  const [connecting, setConnecting] = useState(false);
  const [gisReady, setGisReady] = useState(false);
  const [accountMismatch, setAccountMismatch] = useState(false);

  useEffect(() => {
    return googleTokenManager.subscribe(() => {
      setTokenState({ value: googleTokenManager.getToken(), valid: googleTokenManager.isValid() });
      setConnecting(googleTokenManager.connecting);
    });
  }, []);

  useEffect(() => {
    let tries = 0, id = null;
    const check = () => {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) { setGisReady(true); return; }
      if (++tries > 40) { setCalError("Google's authorisation library did not load."); return; }
      id = setTimeout(check, 250);
    };
    check();
    return () => id && clearTimeout(id);
  }, []);

  /* Drop token and account diagnostics on logout/account change. */
  useEffect(() => {
    if (!crmUser) {
      googleTokenManager.clearToken();
      setCalendars(null); setAccount(""); setAccountMismatch(false); setCalError("");
    }
  }, [crmUser]);

  const connect = useCallback((silent = true) => {
    if (!gisReady) return;
    googleTokenManager.requestToken(silent, silent ? "" : "consent", googleScopesForEmail(crmUser && crmUser.email));
  }, [gisReady, crmUser]);

  const grant = useCallback(() => {
    if (!gisReady) return;
    setAccountMismatch(false);
    googleTokenManager.requestToken(false, "consent", googleScopesForEmail(crmUser && crmUser.email));
  }, [gisReady, crmUser]);

  /* Silent connect on load */
  useEffect(() => {
    if (!gisReady || !crmUser || tokenState.valid || accountMismatch) return;
    connect(true);
  }, [gisReady, crmUser, tokenState.valid, accountMismatch, connect]);

  /* Background silent renewal timer */
  useEffect(() => {
    if (!crmUser) return;
    const id = setInterval(() => {
      if (!googleTokenManager.isValid() && !accountMismatch) {
        connect(true);
      }
    }, 30000);
    return () => clearInterval(id);
  }, [crmUser, accountMismatch, connect]);

  const calFetch = useCallback(async (path, options = {}) => {
    const { quiet, ...init } = options;
    const shout = (msg) => { if (!quiet) setCalError(msg); };
    let token = googleTokenManager.getToken();
    if (!token) {
      shout("Your calendar connection expired. Reconnecting...");
      connect(true);
      return { ok: false, expired: true };
    }
    let res;
    try {
      res = await fetch(`${CAL_API}${path}`, {
        ...init,
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", ...(init.headers || {}) },
      });
    } catch (e) {
      shout("Could not reach Google Calendar. Check your connection.");
      return { ok: false, network: true };
    }
    if (res.status === 401 || res.status === 403) {
      googleTokenManager.clearToken();
      connect(true);
      shout("Calendar connection refreshed.");
      return { ok: false, expired: true, status: res.status };
    }
    if (!res.ok) { shout(`Google Calendar returned an error (${res.status}).`); return { ok: false, status: res.status }; }
    if (res.status === 204) return { ok: true, data: null };
    try { return { ok: true, data: await res.json() }; }
    catch (e) { return { ok: true, data: null }; }
  }, [connect]);

  const loadCalendars = useCallback(async () => {
    const r = await calFetch("/users/me/calendarList?minAccessRole=reader&showHidden=true&maxResults=100");
    if (!r.ok) return;
    const items = ((r.data && r.data.items) || []).map((c) => ({
      id: c.id, name: c.summary, primary: !!c.primary, role: c.accessRole,
      colour: c.backgroundColor || null,
      used: !calHiddenByDefault(c.id),
    }));
    setCalendars(items);
    const primary = items.find((c) => c.primary);
    if (primary) {
      setAccount(primary.id);
      const expected = String((crmUser && crmUser.email) || "").trim().toLowerCase();
      if (expected && String(primary.id || "").trim().toLowerCase() !== expected) {
        setAccountMismatch(true);
        setCalendars(null);
        googleTokenManager.clearToken();
        setCalError(`Calendar access belongs to ${primary.id}, not ${expected}. Reconnect and choose ${expected}.`);
      }
    }
  }, [calFetch, crmUser]);

  useEffect(() => { if (tokenState.valid && !calendars) loadCalendars(); }, [tokenState.valid, calendars, loadCalendars]);

  const disconnect = useCallback(() => {
    googleTokenManager.revoke();
    setCalendars(null); setAccount(""); setAccountMismatch(false); setCalError("");
  }, []);

  return {
    connected: tokenState.valid,
    connecting,
    account,
    setAccount,
    calError,
    setCalError,
    gisReady,
    connect,
    grant,
    disconnect,
    calFetch,
    tokenValid: () => googleTokenManager.isValid(),
    calendars,
    loadCalendars,
    accountMismatch
  };
}

function useSkitRegistry(crmUser, ally, enabled = true) {

    const meta = await sheetFetch("?fields=sheets.properties(sheetId,title)");
    const existing = new Map((meta.sheets || []).map((sheet) => [sheet.properties.title, sheet.properties.sheetId]));
    const requests = [];
    if (existing.has("Sheet1") && !existing.has("Ideas")) requests.push({ updateSheetProperties: { properties: { sheetId: existing.get("Sheet1"), title: "Ideas" }, fields: "title" } });
    const afterRename = new Map(existing); if (afterRename.has("Sheet1")) { afterRename.set("Ideas", afterRename.get("Sheet1")); afterRename.delete("Sheet1"); }
    SKIT_TABS.concat("Revision Log").filter((title) => !afterRename.has(title)).forEach((title) => requests.push({ addSheet: { properties: { title } } }));
    if (requests.length) await sheetFetch(":batchUpdate", { method: "POST", body: JSON.stringify({ requests }) });
    const headers = {};
    SKIT_TABS.forEach((tab) => { headers[`'${tab}'!A1:G4`] = [[`Ally Damon Skit Registry | ${tab}`], [`One permanent skit ID. This is the CRM's current ${tab} column.`], [], ["Skit ID", "Title", "Full Script", "Created At", "Last Updated", "Source", "Notes"]]; });
    headers["'Revision Log'!A1:I4"] = [["Skit Revision Log"], ["Append only backup history. Do not edit this tab."], [], ["Event ID", "Timestamp", "Skit ID", "Event", "Field", "Previous Value", "New Value", "Editor", "Full Snapshot"]];
    await sheetFetch("values:batchUpdate", { method: "POST", body: JSON.stringify({ valueInputOption: "RAW", data: Object.entries(headers).map(([range, values]) => ({ range, values })) }) });
  }, [sheetFetch]);

  const appendRevisions = useCallback(async (events) => {
    if (!events.length) return;
    const values = events.map((event) => [uid(), new Date().toISOString(), event.id, event.type, event.field || "", event.before || "", event.after || "", crmUser ? crmUser.email || "Ally Damon" : "Ally Damon", JSON.stringify(event.snapshot || {})]);
    await sheetFetch("values/%27Revision%20Log%27%21A5%3AI:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS", { method: "POST", body: JSON.stringify({ values }) });
  }, [crmUser, sheetFetch]);

  const writeCurrentTabs = useCallback(async (items, updatedAt) => {
    const meta = await sheetFetch("?fields=sheets.properties(sheetId,title)");
    const ids = new Map((meta.sheets || []).map((sheet) => [sheet.properties.title, sheet.properties.sheetId]));
    const grouped = Object.fromEntries(SKIT_TABS.map((tab) => [tab, []]));
    (items || []).forEach((item) => grouped[skitTab(item.status)].push(skitRow(item, updatedAt)));
    const requests = [];
    SKIT_TABS.forEach((tab) => {
      const sheetId = ids.get(tab);
      if (sheetId === undefined) throw new Error(`Missing ${tab} tab in the skit registry.`);
      requests.push({ repeatCell: { range: { sheetId, startRowIndex: 4, endRowIndex: 1000, startColumnIndex: 0, endColumnIndex: 7 }, cell: {}, fields: "userEnteredValue" } });
      if (grouped[tab].length) requests.push({ updateCells: { range: { sheetId, startRowIndex: 4, startColumnIndex: 0 }, rows: grouped[tab].map((row) => ({ values: row.map((value) => ({ userEnteredValue: { stringValue: String(value) } })) })), fields: "userEnteredValue" } });
    });

  }, [sheetFetch]);

  const syncItems = useCallback(async (items) => {
    const current = new Map((items || []).map((item) => [item.id, skitSnapshot(item)]));
    const previous = previousRef.current;
    if (previous && JSON.stringify([...previous]) === JSON.stringify([...current])) return;
    setState("syncing");
    try {
      await ensureRegistry();
      const now = new Date().toISOString();
      const revisions = [];
      current.forEach((snapshot, id) => {
        const before = previous && previous.get(id);
        if (!before) revisions.push({ id, type: previous ? "Created" : "Imported", field: "", before: "", after: snapshot.title, snapshot });
        else ["title", "script", "status"].forEach((field) => { if (before[field] !== snapshot[field]) revisions.push({ id, type: "Updated", field, before: before[field] || "", after: snapshot[field] || "", snapshot }); });

  useEffect(() => {
    if (!enabled || !tokenValid || !ally) return;

    return () => clearTimeout(id);
  }, [enabled, ally, tokenValid, syncItems]);

  return { state: enabled && tokenValid ? (state === "off" ? "synced" : state) : "off", error: enabled ? error : "", connect, active: enabled && tokenValid, ready: enabled && ready };
}

const midnight = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

/* Where an event sits on one particular day column, in local minutes from that day's midnight.
   Events are kept as real Date objects and projected per column, which is what makes a block that
   spans midnight render correctly on both days instead of only the first.

   Google's dateTime is an offset-aware RFC3339 string. new Date() parses it to the right instant
   and getHours() then gives the viewer's local clock, which is what the grid is drawn in. Never
   slice the string by hand — that ignores the offset and shifts every event the moment a calendar's
   zone differs from the browser's. */
function eventOnDay(ev, day) {
  const dStart = midnight(day);
  const dEnd = new Date(dStart.getTime() + 86400000);
  if (ev.end <= dStart || ev.start >= dEnd) return null;
  const sMin = ev.start < dStart ? 0 : ev.start.getHours() * 60 + ev.start.getMinutes();
  const eMin = ev.end > dEnd ? 1440 : ev.end.getHours() * 60 + ev.end.getMinutes();
  if (eMin <= DAY_START_MIN || sMin >= DAY_END_MIN) return null;   // wholly outside the visible window
  return { sMin, eMin: Math.max(eMin, sMin + 15) };

/* Event colour by which calendar it came from, so it is obvious at a glance whose commitment a block
   is without reading it. Owner's call 29 Jul 2026: ally@mama.co.za is yellow.
   Matched on calendar id rather than name, because a calendar's display name is editable in Google
   and would silently break the colouring the moment it were renamed. */
const CAL_TINTS = [
  { test: (id) => /^ally@mama\.co\.za$/i.test(id), fill: "rgba(214,154,0,0.30)", line: "rgba(214,154,0,0.62)", bar: C.amber },

const CAL_TINT_READONLY = { fill: "rgba(255,255,255,0.12)", line: LINE, bar: MUT };
const eventTint = (calId, writable) => CAL_TINTS.find((t) => t.test(calId || "")) || (writable ? CAL_TINT_OWN : CAL_TINT_READONLY);

/* Greedy lane packing so overlapping events sit side by side rather than on top of each other. */
function packLanes(items) {
  const laneEnds = [];
  items.slice().sort((a, b) => a.sMin - b.sMin || b.eMin - a.eMin).forEach((it) => {
    let lane = laneEnds.findIndex((end) => end <= it.sMin);
    if (lane === -1) { laneEnds.push(it.eMin); lane = laneEnds.length - 1; } else { laneEnds[lane] = it.eMin; }
    it.lane = lane;
  });
  return Math.max(1, laneEnds.length);

function DayGrid({ cal, onSchedule, onMove, onResize, onUnschedule, onDeleteEvent, onOpenTask, syncTick, schedule }) {

  /* live resize state. Kept local and rendered as a preview so the block follows the pointer at 60fps
     without a network call per pixel; Google is written exactly once, on release. */
  const [resizing, setResizing] = useState(null);       // { taskId, dayIndex, startMin, endMin }
  const [busyEvent, setBusyEvent] = useState(null);     // taskId of a block mid-write
  const [actionError, setActionError] = useState("");   // shown under the grid, where the action was
  /* Local nudge to refetch. A successful write changes Google, but the grid's own load is keyed on
     syncTick, which only ticks once a minute — so without this a freshly dropped block would not
     appear for up to a minute and the drop would look like it had failed. */
  const [localRefresh, setLocalRefresh] = useState(0);
  const refetch = () => setLocalRefresh((n) => n + 1);
  const [raw, setRaw] = useState([]);
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState("");
  const [nowMin, setNowMin] = useState(() => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); });
  const [today, setToday] = useState(() => new Date());

  /* Window offset in days. Steps a whole window at a time so the columns never straddle an awkward
     boundary. spanKey below is derived from the first visible day, so changing this refetches Google
     for the new range automatically — no separate plumbing. */
  const [offsetDays, setOffsetDays] = useState(0);
  const days = Array.from({ length: GRID_DAYS }, (_, i) => new Date(today.getFullYear(), today.getMonth(), today.getDate() + offsetDays + i));

  /* the now-line needs minute resolution; re-reading the date also rolls the grid over at midnight */
  useEffect(() => {
    const id = setInterval(() => {
      const d = new Date();
      setNowMin(d.getHours() * 60 + d.getMinutes());
      setToday((prev) => (sameDay(prev, d) ? prev : d));
    }, 60000);
    return () => clearInterval(id);
  }, []);

  /* Resize is deliberately NOT HTML5 drag-and-drop. Native drag reports nothing while the pointer is
     still and cannot show a live preview, so the block would not follow the cursor.

     THE BUG THIS ALSO FIXES — the "it duplicates into the next cell" report. The resize handle lives
     inside a block that is itself draggable=true for moving. Grabbing the edge therefore started BOTH
     gestures: the resize, and a native move drag. The floating copy the owner saw was the browser's
     drag ghost, and releasing over the next cell fired that cell's move-drop as well, so the block
     appeared to duplicate and jump.
     preventDefault on pointerdown does NOT stop a native drag from starting on the ancestor. The only
     reliable block is to refuse it in dragstart, which is what dragBlockedRef does. */
  const resizeRef = useRef(null);
  const dragBlockedRef = useRef(false);
  useEffect(() => {
    if (!resizing) return;
    const onMove = (e) => {
      const st = resizeRef.current;
      if (!st) return;
      /* The moment the pointer enters the next half hour, the block owns that slot. Rounding made
         an edge drag wait until the pointer crossed half the row, which felt like the block was not
         extending over the slot being dragged across. */
      const deltaY = e.clientY - st.originY;
      const deltaSlots = deltaY >= 0 ? Math.ceil(deltaY / ROW_H) : Math.floor(deltaY / ROW_H);
      const endMin = Math.min(DAY_END_MIN, Math.max(st.startMin + SLOT_MIN, st.originEndMin + deltaSlots * SLOT_MIN));
      /* written straight onto the ref as well as into state: the release handler reads the ref, and
         relying on a follow-up effect to copy it across was a race waiting to happen */
      st.latestEnd = endMin;
      setResizing((r) => (r && r.endMin !== endMin ? { ...r, endMin } : r));
    };
    const onUp = async () => {
      const st = resizeRef.current;
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      resizeRef.current = null;
      setResizing(null);
      /* released a tick later than dragstart could fire, so unblocking here is safe */
      setTimeout(() => { dragBlockedRef.current = false; }, 0);
      if (!st) return;
      const finalEnd = st.latestEnd;
      if (finalEnd == null || finalEnd === st.originEndMin) return;   // no actual change
      setActionError("");
      setBusyEvent(st.taskId);
      const ok = await onResize(st.taskId, finalEnd, st.day);
      setBusyEvent(null);
      if (ok) setLocalRefresh((n) => n + 1);
      else setActionError("Could not change that block's length.");
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    return () => { window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); };
  }, [!!resizing]);


  const used = (calendars || []).filter((c) => c.used);
  const usedKey = used.map((c) => c.id).join("|");
  const spanKey = midnight(days[0]).getTime();

  const load = useCallback(async () => {
    if (!connected || !used.length) return;
    setLoading(true); setLoadError("");
    const from = midnight(days[0]);
    const to = new Date(midnight(days[GRID_DAYS - 1]).getTime() + 86400000);
    /* singleEvents=true expands recurring events into instances: show occurrences, never touch a
       recurrence rule (explicitly out of scope in 02-GOAL.md). */
    const qs = `?timeMin=${encodeURIComponent(from.toISOString())}&timeMax=${encodeURIComponent(to.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=500`;
    const results = await Promise.all(used.map(async (c) => {
      const r = await calFetch(`/calendars/${encodeURIComponent(c.id)}/events${qs}`);
      return { cal: c, items: r.ok ? ((r.data && r.data.items) || []) : null };
    }));
    if (results.some((r) => r.items === null)) setLoadError("Some calendars could not be read.");
    const out = [];
    results.forEach(({ cal: c, items }) => {
      (items || []).forEach((ev) => {
        if (ev.status === "cancelled" || !ev.start) return;
        const writable = c.role === "owner" || c.role === "writer";
        if (ev.start.date) {
          const crmContentId = (((ev.extendedProperties || {}).private) || {}).allyCrmContentId || null;
          out.push({ id: `${c.id}::${ev.id}`, crmContentId, title: ev.summary || "(no title)", calId: c.id, calName: c.name, writable, allDay: true,
            start: new Date(`${ev.start.date}T00:00:00`), end: new Date(`${(ev.end && ev.end.date) || ev.start.date}T00:00:00`) });
          return;
        }
        if (!ev.start.dateTime) return;
        /* allyCrmTaskId is the marker written when this app created the event. Only blocks carrying it
           get the move / resize / remove controls: everything else on the calendar is a real-world
           commitment the CRM has no business rearranging, even on a writable calendar. */
        const crmTaskId = (((ev.extendedProperties || {}).private) || {}).allyCrmTaskId || null;
        out.push({ id: `${c.id}::${ev.id}`, eventId: ev.id, crmTaskId, desc: ev.description || "", title: ev.summary || "(no title)", calId: c.id, calName: c.name, writable, allDay: false,
          start: new Date(ev.start.dateTime), end: new Date((ev.end && ev.end.dateTime) || ev.start.dateTime) });
      });
    });
    setRaw(out); setLoading(false);
    /* syncTick is in the deps on purpose: it is what makes the grid re-read Google on focus and on
       the timer, so the blocks drawn here stay in step with the chip labels that reconcileSchedule
       maintains. Without it the two could disagree after an edit made elsewhere. */
  }, [connected, calFetch, usedKey, spanKey, syncTick, localRefresh]);

  useEffect(() => { load(); }, [load]);

  /* per-column projection */
  const columns = days.map((day) => {
    const timed = [];
    raw.filter((e) => !e.allDay).forEach((e) => {
      const pos = eventOnDay(e, day);
      if (pos) timed.push({ ...e, ...pos });
    });
    const laneCount = packLanes(timed);
    const taken = new Set();
    timed.forEach((e) => {
      for (let i = 0; i < SLOT_COUNT; i++) {
        const a = slotToMin(i), b = a + SLOT_MIN;
        if (e.sMin < b && e.eMin > a) taken.add(i);
      }
    });
    const allDayHere = raw.filter((e) => e.allDay && midnight(day) >= midnight(e.start) && midnight(day) < midnight(e.end));
    return { day, timed, laneCount, taken, allDay: allDayHere };
  });

  /* WHICH BLOCKS ARE OURS — two independent routes, because relying on one was the bug.
     The first attempt trusted extendedProperties.private.allyCrmTaskId, the tag written at creation.
     If Google does not hand that back on a list call, every block looks foreign, and a foreign block
     correctly gets no × and no drag — which is exactly the reported "× does nothing, cannot move it".
     So we also match on event id against ally.schedule, which is data this app owns outright and can
     always read. A block counts as ours if EITHER route identifies it. */
  const eventIdToTask = {};
  Object.entries(schedule || {}).forEach(([taskId, s]) => { if (s && s.eventId) eventIdToTask[s.eventId] = taskId; });
  const ownTaskId = (e) => e.crmTaskId || eventIdToTask[e.eventId] || null;

  const topOf = (m) => ((Math.min(Math.max(m, DAY_START_MIN), DAY_END_MIN) - DAY_START_MIN) / SLOT_MIN) * ROW_H;
  const bodyH = SLOT_COUNT * ROW_H;
  const totalFree = columns.reduce((n, c) => n + (SLOT_COUNT - c.taken.size), 0);

  if (!connected) return null;

  return (
    <div className="rounded-2xl daygrid" style={{ ...card, borderRadius: 16, padding: 13, marginBottom: 16 }}>
      <div className="flex items-baseline justify-between flex-wrap gap-2" style={{ marginBottom: 9 }}>
        <div className="flex items-center gap-2">
          <button onClick={() => setOffsetDays((o) => o - GRID_DAYS)} aria-label="Earlier days" title="Earlier"
            style={{ ...iconBtn, width: 24, height: 24, borderRadius: 7, border: `1px solid ${LINE}`, display: "flex", alignItems: "center", justifyContent: "center" }}>‹</button>
          <button onClick={() => setOffsetDays((o) => o + GRID_DAYS)} aria-label="Later days" title="Later"
            style={{ ...iconBtn, width: 24, height: 24, borderRadius: 7, border: `1px solid ${LINE}`, display: "flex", alignItems: "center", justifyContent: "center" }}>›</button>
          {offsetDays !== 0 && (
            <button onClick={() => setOffsetDays(0)} style={{ ...iconBtn, fontSize: 10, padding: "3px 9px", borderRadius: 999, border: `1px solid ${C.accentLine}`, color: C.accent }}>Today</button>
          )}
          <div>
            <div style={{ fontWeight: 700, fontSize: 13.5 }}>
              {days[0].toLocaleDateString("en-ZA", { day: "numeric", month: "short" })} – {days[GRID_DAYS - 1].toLocaleDateString("en-ZA", { day: "numeric", month: "short" })}
            </div>
            <div style={{ fontSize: 10.5, color: MUT, marginTop: 1 }}>
              {loading ? "Reading your calendar…" : `${totalFree} half-hour slots free`}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-3" style={{ fontSize: 9.5, color: MUT, letterSpacing: "0.06em", textTransform: "uppercase" }}>
          {DAY_PHASES.map((p) => (
            <span key={p.key} className="flex items-center gap-1.5">
              <span style={{ width: 8, height: 8, borderRadius: 2, background: p.tint, border: `1px solid ${p.edge}` }} />{p.label}
            </span>
          ))}
        </div>
      </div>

      {/* column headers */}
      <div style={{ display: "grid", gridTemplateColumns: `${TIME_COL_W}px repeat(${GRID_DAYS}, 1fr)`, gap: 0 }}>
        <div style={{ fontSize: 9, color: MUT, letterSpacing: "0.08em", textTransform: "uppercase", paddingBottom: 6 }}>Time</div>
        {columns.map(({ day, allDay }, ci) => {
          const isToday = sameDay(day, new Date());
          return (
            <div key={ci} style={{ textAlign: "center", paddingBottom: 6, borderLeft: `1px solid ${LINE}` }}>
              <div style={{ fontSize: 9.5, color: MUT, letterSpacing: "0.1em", textTransform: "uppercase" }}>{day.toLocaleDateString("en-ZA", { weekday: "short" })}</div>
              <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", minWidth: 24, height: 24, borderRadius: 99, marginTop: 2,
                fontSize: 14, fontWeight: 700, background: isToday ? C.accent : "transparent", color: isToday ? "#fff" : C.ink }}>{day.getDate()}</div>
              {allDay.length > 0 && (
                <div className="flex flex-col" style={{ gap: 2, padding: "3px 3px 0" }}>
                  {allDay.map((e) => (
                    <button key={e.id} onClick={(ev) => { ev.stopPropagation(); if (e.crmContentId) onOpenTask && onOpenTask(e.crmContentId); }} title={`${e.title} · ${e.calName} · all day${e.crmContentId ? " · click to open card" : ""}`}
                      style={{ fontFamily: "inherit", cursor: e.crmContentId ? "pointer" : "default", fontSize: 9, padding: "1px 5px", borderRadius: 4, background: FILL, border: `1px solid ${LINE}`, color: MUT, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.title}</button>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* body: time labels + one column per day */}
      <div style={{ display: "grid", gridTemplateColumns: `${TIME_COL_W}px repeat(${GRID_DAYS}, 1fr)`, gap: 0, borderTop: `1px solid ${LINE}` }}>
        <div>
          {Array.from({ length: SLOT_COUNT }, (_, i) => {
            const m = slotToMin(i);
            return (
              <div key={i} style={{ height: ROW_H, fontSize: 9.5, color: m % 60 === 0 ? MUT : FAINT, textAlign: "right", paddingRight: 7, lineHeight: `${ROW_H}px`, fontVariantNumeric: "tabular-nums" }}>
                {minToLabel(m)}
              </div>
            );
          })}
        </div>

        {columns.map(({ day, timed, laneCount, taken }, ci) => {
          const isToday = sameDay(day, new Date());
          return (
            <div key={ci} style={{ position: "relative", height: bodyH, borderLeft: `1px solid ${LINE}` }}>
              {Array.from({ length: SLOT_COUNT }, (_, i) => {
                const m = slotToMin(i);
                const ph = phaseForMin(m);
                const busy = taken.has(i);
                const key = `${ci}:${i}`;
                const isTarget = dropTarget === key;
                const isDropping = dropping === key;
                return (
                  <div key={i} className="daycell" data-day={ci} data-slot={i}
                    title={`${day.toLocaleDateString("en-ZA", { weekday: "short", day: "numeric" })} ${minToLabel(m)} · ${ph.label}${busy ? " · busy" : " · free"}`}
                    /* dragover must preventDefault on EVERY event or the browser refuses the drop */
                    /* accepts two kinds of drop: a NEW task from a card (SCHED_MIME) and an EXISTING
                       block being moved within the grid (MOVE_MIME). Each has its own handler so a
                       move can never accidentally create a duplicate event. */
                    onDragOver={(e) => {
                      const types = Array.from(e.dataTransfer.types);
                      if (!types.includes(SCHED_MIME) && !types.includes(MOVE_MIME)) return;
                      e.preventDefault();
                      e.dataTransfer.dropEffect = types.includes(MOVE_MIME) ? "move" : "copy";
                      setDropTarget(key);
                    }}
                    onDragLeave={() => setDropTarget((t) => (t === key ? null : t))}
                    onDrop={async (e) => {
                      e.preventDefault();
                      setDropTarget(null);
                      setActionError("");
                      const moveRaw = e.dataTransfer.getData(MOVE_MIME);
                      if (moveRaw) {
                        let mv; try { mv = JSON.parse(moveRaw); } catch (err) { return; }
                        if (!mv || !mv.taskId) return;
                        setBusyEvent(mv.taskId); setDropping(key);
                        const ok = await onMove(mv.taskId, day, m);
                        setDropping(null); setBusyEvent(null);
                        if (ok) refetch(); else setActionError("Could not move that block. Nothing was changed.");
                        return;
                      }
                      let payload;
                      try { payload = JSON.parse(e.dataTransfer.getData(SCHED_MIME)); } catch (err) { return; }
                      if (!payload || !payload.taskId) return;
                      setDropping(key);
                      const ok = await onSchedule(payload, day, m);
                      setDropping(null);
                      /* refetch on success so the new block appears at once rather than on the next
                         sync tick; on failure say so, because silence reads as a broken app. */
                      if (ok) refetch();
                      else setActionError(`Could not schedule "${payload.title}". Your calendar was not changed.`);
                    }}
                    style={{ height: ROW_H,
                      background: isTarget || isDropping ? "rgba(47,163,124,0.34)" : busy ? "rgba(255,255,255,0.05)" : ph.tint,
                      borderTop: `1px solid ${m % 60 === 0 ? ph.edge : "rgba(255,255,255,0.045)"}`,
                      boxShadow: isTarget ? `inset 0 0 0 2px ${C.mint}` : isDropping ? `inset 0 0 0 2px ${C.mint}` : "none",
                      transform: isTarget ? "scaleY(1.12)" : "none", zIndex: isTarget ? 2 : "auto", position: "relative" }} />
                );
              })}

              {timed.map((e) => {
                const top = topOf(e.sMin);
                const h = Math.max(ROW_H - 2, topOf(e.eMin) - top - 1);
                const w = 100 / laneCount;
                const taskId = ownTaskId(e);                      // non-null => this app created it
                /* an orphan: we made it (its description says so) but the link back is gone. Removable, but
                   not movable or resizable, since there is no CRM record to keep in step. */
                /* Leat Brief is a legacy CRM block whose old event was saved before the task marker
                   existed. It is safe to expose the same remove control for this exact orphan. */
                const orphan = !taskId && (/Scheduled from ALLY CRM/i.test(e.desc || "") || /^leat brief$/i.test((e.title || "").trim()));
                const mine = !!taskId;                            // and only ours are editable here
                const completed = mine && !!((schedule || {})[taskId] || {}).completed;
                const t = completed ? { fill: "rgba(47,163,124,0.30)", line: "rgba(47,163,124,0.82)", bar: C.mint } : eventTint(e.calId, e.writable);
                const isResizing = resizing && resizing.taskId === taskId && resizing.dayIndex === ci;
                const shownEnd = isResizing ? resizing.endMin : e.eMin;
                const hh = Math.max(ROW_H - 2, topOf(shownEnd) - top - 1);
                const writing = busyEvent === taskId;
                return (
                  <div key={e.id} className="dayevent"
                    title={`${e.title}\n${minToLabel(Math.max(e.sMin, DAY_START_MIN))} – ${minToLabel(Math.min(shownEnd, DAY_END_MIN))}\n${e.calName}${mine ? "\nClick to open task · drag to move · drag the bottom edge to lengthen · × to unschedule" : ""}`}
                    draggable={mine && !isResizing}
                    onDragStart={mine ? (ev) => {
                      /* refuse the move drag if this gesture began on the resize handle — otherwise
                         the edge-drag runs a resize AND a move at once, which is what produced the
                         phantom duplicate block */
                      if (dragBlockedRef.current) { ev.preventDefault(); return; }
                      ev.dataTransfer.setData(MOVE_MIME, JSON.stringify({ taskId }));
                      ev.dataTransfer.effectAllowed = "move";
                    } : undefined}
                    onClick={mine ? (ev) => {
                      if (dragBlockedRef.current || resizing) return;
                      ev.stopPropagation();
                      onOpenTask && onOpenTask(taskId);
                    } : undefined}
                    style={{ position: "absolute", top, height: hh, left: `calc(${e.lane * w}% + 2px)`, width: `calc(${w}% - 4px)`,
                      borderRadius: 5, padding: "1px 4px", overflow: "visible",
                      background: t.fill, border: `1px solid ${isResizing ? C.mint : t.line}`, borderLeft: `2px solid ${t.bar}`,
                      cursor: mine ? "grab" : "default", opacity: writing ? 0.6 : 1, zIndex: isResizing ? 6 : "auto" }}>
                    {/* The block itself must stay overflow:visible so the × and the resize grip can sit
                        on its edge, which means the text needs its own clipped box — otherwise a long
                        title spills straight out of the block, as it did. Height is pinned to the
                        block's, and the title is clamped to however many lines actually fit, so a
                        two-hour block shows more of the title than a half-hour one instead of both
                        overflowing. */}
                    <div style={{ height: Math.max(0, hh - 2), overflow: "hidden" }}>
                      <div style={{ fontSize: 9.5, fontWeight: 600, lineHeight: "11.5px", color: C.ink,
                        display: "-webkit-box", WebkitBoxOrient: "vertical",
                        WebkitLineClamp: Math.max(1, Math.floor((hh - 2 - (hh >= 34 ? 11 : 0)) / 11.5)),
                        overflow: "hidden", wordBreak: "break-word", paddingRight: mine || orphan ? 12 : 0 }}>{e.title}</div>
                      {hh >= 34 && <div style={{ fontSize: 8.5, color: MUT, lineHeight: "11px", whiteSpace: "nowrap" }}>{minToLabel(Math.max(e.sMin, DAY_START_MIN))}–{minToLabel(Math.min(shownEnd, DAY_END_MIN))}</div>}
                    </div>
                    {/* live readout while stretching, since on a short block there is no room for the
                        times inline and the whole point is knowing where the edge has got to */}
                    {isResizing && (
                      <div style={{ position: "absolute", right: 2, bottom: 1, fontSize: 8.5, fontWeight: 700, color: C.mint, background: "rgba(0,0,0,0.55)", borderRadius: 3, padding: "0 3px", pointerEvents: "none" }}>
                        {Math.round((shownEnd - e.sMin) / SLOT_MIN) * 0.5}h → {minToLabel(shownEnd)}
                      </div>
                    )}

                    {(mine || orphan) && (
                      <>
                        {/* unschedule. Removes the calendar block only — the task itself is untouched
                            and stays on its card, just no longer green. */}
                        {/* A <button> inside a draggable ancestor is a known trap: mousedown starts the
                            ancestor's drag, and the click never lands. Hence draggable={false} plus
                            swallowing mousedown/pointerdown/dragstart before they reach the block.
                            Sized 16px with a -3px inset so it stays hittable on a one-slot block. */}
                        <button aria-label={`Unschedule ${e.title}`} title="Remove from calendar (keeps the task)"
                          draggable={false}
                          onDragStart={(ev) => { ev.preventDefault(); ev.stopPropagation(); }}
                          onPointerDown={(ev) => ev.stopPropagation()}
                          onMouseDown={(ev) => { ev.stopPropagation(); ev.preventDefault(); }}
                          onClick={async (ev) => {
                            ev.stopPropagation(); ev.preventDefault();
                            setActionError("");
                            setBusyEvent(taskId || e.eventId);
                            const ok = orphan ? await onDeleteEvent(e.calId, e.eventId) : await onUnschedule(taskId);
                            setBusyEvent(null);
                            if (ok) refetch(); else setActionError("Could not remove that from your calendar.");
                          }}
                          style={{ position: "absolute", top: -3, right: -3, width: 16, height: 16, lineHeight: "14px", textAlign: "center",
                            borderRadius: 99, border: `1px solid ${t.line}`, background: "#16161a", color: C.ink, fontSize: 11, cursor: "pointer",
                            padding: 0, fontFamily: "inherit", zIndex: 7 }}>×</button>

                        {/* bottom edge: drag down to cover more slots. Linked blocks only — an orphan
                            has no CRM record to update, so lengthening it would drift silently. */}
                        {mine && <div role="separator" aria-label="Lengthen block" title="Drag to lengthen"
                          onPointerDown={(ev) => {
                            ev.stopPropagation(); ev.preventDefault();
                            /* set BEFORE any dragstart can fire, so the ancestor's move drag is refused */
                            dragBlockedRef.current = true;
                            /* Capture the pointer on the handle so a fast edge drag cannot be handed
                               to the draggable event beneath it. */
                            if (ev.currentTarget.setPointerCapture) ev.currentTarget.setPointerCapture(ev.pointerId);
                            resizeRef.current = { taskId, day, originY: ev.clientY, startMin: e.sMin, originEndMin: e.eMin, latestEnd: e.eMin };
                            setResizing({ taskId, dayIndex: ci, startMin: e.sMin, endMin: e.eMin });
                          }}
                          style={{ position: "absolute", left: 0, right: 0, bottom: -5, height: 12, cursor: "ns-resize", touchAction: "none" }}>
                          <div style={{ position: "absolute", left: "50%", transform: "translateX(-50%)", bottom: 2, width: 16, height: 2, borderRadius: 2, background: isResizing ? C.mint : t.bar, opacity: isResizing ? 1 : 0.65 }} />
                        </div>}
                      </>
                    )}
                  </div>
                );
              })}

              {isToday && nowMin >= DAY_START_MIN && nowMin <= DAY_END_MIN && (
                <div aria-hidden style={{ position: "absolute", left: 0, right: 0, top: topOf(nowMin), height: 2, background: C.accent, pointerEvents: "none", zIndex: 3 }}>
                  <span style={{ position: "absolute", left: -3, top: -3, width: 8, height: 8, borderRadius: 99, background: C.accent }} />
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Calendar errors used to surface ONLY inside the header chip's popover, which is nowhere near
          where the action happens — a failed drop looked like nothing happening at all. Anything that
          goes wrong while scheduling now says so right here, under the grid. */}
      {(cal.calError || actionError) && (
        <div role="alert" className="flex items-start justify-between gap-2" style={{ marginTop: 8, padding: "7px 9px", borderRadius: 8, background: C.accentBg, border: `1px solid ${C.accentLine}`, fontSize: 10.5, lineHeight: 1.45 }}>
          <span>{actionError || cal.calError}</span>
          <button onClick={() => { setActionError(""); cal.setCalError(""); }} style={{ ...iconBtn, padding: 0, fontSize: 12, flexShrink: 0 }} aria-label="Dismiss">×</button>
        </div>
      )}
      {loadError && <div role="alert" style={{ marginTop: 8, fontSize: 10.5, color: C.amber }}>{loadError}</div>}
      {/* No instructional footer here. The owner built this and does not need the interface narrated;
          that applies generally, so resist adding explanatory copy to the UI. Errors and live data are
          fine — telling him how his own app works is not. */}
    </div>
  );
}

/* Human-readable causes for the Firebase auth error codes that actually happen in this app.
   Module scope on purpose: it is a constant lookup, and signInGoogle plus the redirect-result
   handler both need it. Empty string means "benign, say nothing". */
const AUTH_ERRORS = {
  "auth/popup-blocked": "Your browser blocked the Google sign-in window. Allow popups for this CRM, then try again.",
  "auth/popup-closed-by-user": "Sign-in window was closed before finishing. Tap to try again.",
  "auth/cancelled-popup-request": "",
  "auth/unauthorized-domain": "This address is not on the Firebase authorised domains list, so Google sign-in is refused here. Add this exact origin in Firebase Auth settings.",
  "auth/operation-not-allowed": "Google sign-in is not enabled for this Firebase project.",
  "auth/network-request-failed": "Could not reach Google. Check your connection and try again.",
  "auth/internal-error": "Google returned an internal error. Usually transient — try again.",
};

function AllyCRM() {
  const [ally, setAlly] = useState(null);
  const [mama, setMama] = useState(null);
  const [tab, setTab] = useState("overview");
  const [history, setHistory] = useState([]);
  const [q, setQ] = useState("");
  const [saveState, setSaveState] = useState("idle");
  const [navOpen, setNavOpen] = useState(false);
  const [authError, setAuthError] = useState("");
  const [authStalled, setAuthStalled] = useState(false);
  const loaded = useRef(false);
  const timers = useRef({});
  const [localLoaded, setLocalLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      let a = ALLY_SEED, m = MAMA_SEED;
      const ra = await store.get(ALLY_KEY); if (ra) { try { a = JSON.parse(ra); } catch (e) {} }
      const rm = await store.get(MAMA_KEY); if (rm) { try { m = JSON.parse(rm); } catch (e) {} }
      if (!a.apartment) a.apartment = ALLY_SEED.apartment;
      if (!a.unlocks) a.unlocks = ALLY_SEED.unlocks;
      if (!a.unlocks.ecosystem) a.unlocks.ecosystem = ALLY_SEED.unlocks.ecosystem;
      if (!a.unlocks.chains) a.unlocks.chains = ALLY_SEED.unlocks.chains;
      if (!a.lifeAdmin) a.lifeAdmin = ALLY_SEED.lifeAdmin;
      if (!a.anchor) a.anchor = ALLY_SEED.anchor;
      /* map of dashboard taskId -> the Google Calendar event created for it. Backed in on load so
         saved data from before scheduling existed does not read as undefined everywhere. */
      if (!a.schedule || typeof a.schedule !== "object") a.schedule = {};
      if (!a.contentSchedule || typeof a.contentSchedule !== "object") a.contentSchedule = {};
      /* Read the retired board once so existing product URLs are brought into the CRM record.
         Afterwards furnishing changes travel through setAlly like every other CRM edit. */
      const legacyFurnishing = await store.get("ally_furnishing_v1");
      a = migrateAlly(a, legacyFurnishing);
      m = { ...m, creators: (m.creators || []).map((c) => c.goals ? c : { ...c, goals: c.goal ? [{ id: uid(), text: c.goal }] : [] }) };
      m = { ...m, creators: (m.creators || []).map((c) => ({ ...c, bio: c.bio || "", nextSteps: c.nextSteps || "", notes: typeof c.notes === "string" ? c.notes : Array.isArray(c.notes) ? c.notes.map((n) => typeof n === "string" ? n : (n && n.text) || "").filter(Boolean).join("\n") : "" })) };
      m = { ...m, tasks: (m.tasks || []).map((t) => t.description !== undefined ? t : { ...t, description: "" }) };
      /* admin tasks used to carry one single `link` string, only editable via the pencil-toggle —
         now they carry a `links` array (add new ones any time, none overwriting the last, same
         pattern as Creators' Links section) so this folds any old single link into that array
         once, the first time this loads after the change. */
      m = { ...m, tasks: (m.tasks || []).map((t) => t.links !== undefined ? t : { ...t, links: t.link ? [{ id: uid(), url: t.link, label: t.link.replace(/^https?:\/\//, "").slice(0, 30) }] : [] }) };
      m = { ...m, tasks: migrateMamaTasks(m.tasks) };
      ({ ally: a, mama: m } = moveMamaAdminTasksToAi(a, m));
      setAlly(a); setMama(m); loaded.current = true; setLocalLoaded(true);
    })();
  }, []);

  /* ---------- cloud sync: Google Sign-In + Firestore (purely additive on top of localStorage) ---------- */
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false); // becomes true once we've heard back from Firebase at least once
  const [cloudState, setCloudState] = useState("offline"); // offline | loading | saving | synced | error
  const [workspaceError, setWorkspaceError] = useState("");

  /* ---------- active view profile (see VIEW_PROFILES) ----------
     Chosen strictly by the signed-in Google account. `user` is null for a beat while auth settles
     and profileForEmail falls back to the personal profile, so the bottom strip never renders
     empty. */
  const profileId = profileForEmail(user && user.email);
  const profile = VIEW_PROFILES[profileId] || VIEW_PROFILES.personal;
  const modeLabel = profile.id === "work" ? "WORK MODE" : "PERSONAL MODE";
  useEffect(() => { document.title = modeLabel; }, [modeLabel]);

  /* Calendar authorisation is account-bound. The work profile deliberately never starts the Skit
     Registry hook because that is a personal Content backup and has no place in the MAMA shell. */
  const cal = useCalendarAuth(user);
  const registry = useSkitRegistry(user, ally, profile.id !== "work");
  /* Creators / Admin Tasks / AI Tasks are subtabs of "mama" in the personal profile but top-level
     tabs in the work one, and collectPriorityTasks stamps every Mama task with navTab "mama".
     This maps that stored navTab onto whichever tab actually exists in the active profile, so a
     task chip on HOME lands somewhere real in both. navRequest itself is deliberately NOT
     rewritten — Creators and MamaModule both key off navRequest.navTab === "mama" and still must. */
  const resolveNavTab = (navTab, navSub) => {
    if (profile.id !== "work" || navTab !== "mama") return navTab;
    return navSub === "adminTasks" ? "adminTasks" : navSub === "aiTasks" ? "aiTasks" : "creators";
  };
  /* Signing in as the other account can leave `tab` pointing at something the new profile does
     not render — an empty scroll area. Fall back to HOME, which both have. Keyed on profileId only,
     so ordinary navigation into an off-strip tab (deals, unlocks, apartment) is not clobbered. */
  useEffect(() => {
    if (!profile.tabs.includes(tab)) setTab("overview");
  }, [profileId]);

  /* ---------- the calendar write layer ----------
     THE ONLY PLACE IN THIS APP THAT WRITES TO GOOGLE CALENDAR: create, move, resize, remove. Keep it
     that way — one funnel means one place to reason about what can change and one place to get the
     write target right.

     Every mutation follows the same order: ask Google first, and only touch CRM state once Google has
     confirmed. A failed write must never leave the CRM claiming something is scheduled when it is not,
     or showing it gone when it still exists.

     Writes go to "primary" — the owner's own gmail calendar — never to ally@mama.co.za, even though
     that calendar is writable. Decided 29 Jul 2026: the mama calendar is shared with
     adamon@amplified.community, so personal time-blocking there would leak. Mama events are still
     READ so a drop cannot double-book. Do not "helpfully" change this to the task's own pillar.

     Default duration is one slot (30 min). Resizing is a later step.
     Firestore is only touched after Google confirms the event, so a failed write cannot leave the
     CRM claiming something is scheduled when it is not. */
  const scheduleTask = async (payload, day, startMin) => {
    if (!cal.connected) { cal.setCalError("Connect your calendar before scheduling."); return false; }
    const start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), Math.floor(startMin / 60), startMin % 60, 0);
    const end = new Date(start.getTime() + SLOT_MIN * 60000);
    const r = await cal.calFetch("/calendars/primary/events", {
      method: "POST",
      body: JSON.stringify({
        summary: payload.title,
        description: "Scheduled from ALLY CRM",
        start: { dateTime: start.toISOString() },
        end: { dateTime: end.toISOString() },
        /* a stable marker so these are identifiable later without guessing from the title */
        extendedProperties: { private: { allyCrmTaskId: String(payload.taskId) } },
      }),
    });
    /* Distinguish the failure modes rather than returning a bare false. "Nothing happened" was
       exactly the reported symptom, and a bare false gives nothing to act on. */
    if (!r.ok) { cal.setCalError(`Google refused to create the event${r.status ? ` (HTTP ${r.status})` : r.network ? " — could not reach Google" : r.expired ? " — the connection had expired" : ""}.`); return false; }
    if (!r.data || !r.data.id) { cal.setCalError("Google accepted the request but returned no event, so nothing was saved."); return false; }
    setAlly((d) => ({
      ...d,
      schedule: {
        ...(d.schedule || {}),
        [payload.taskId]: {
          eventId: r.data.id,
          calendarId: "primary",
          startISO: start.toISOString(),
          endISO: end.toISOString(),
          label: `${start.toLocaleDateString("en-ZA", { weekday: "short", day: "numeric" })} ${minToLabel(startMin)}`,
        },
      },
    }));
    return true;
  };

  /* Content uses an all day calendar event rather than a half hour time block. The CRM date is
     saved by the content card immediately, while this keeps one matching Google event updated as
     the title, script, or date changes. */
  const syncContentCalendar = async ({ pipelineKey, itemId, date, title, description }) => {
    const key = `${pipelineKey}:${itemId}`;
    const existing = (ally.contentSchedule || {})[key];
    if (!date) {
      if (!existing || !existing.eventId) return true;
      const removed = await cal.calFetch(`/calendars/${encodeURIComponent(existing.calendarId || "primary")}/events/${encodeURIComponent(existing.eventId)}`, { method: "DELETE", quiet: true });
      if (!removed.ok && removed.status !== 404 && removed.status !== 410) { cal.setCalError("Could not remove the content event from your calendar."); return false; }
      setAlly((d) => { const contentSchedule = { ...(d.contentSchedule || {}) }; delete contentSchedule[key]; return { ...d, contentSchedule }; });
      return true;
    }
    if (!cal.connected) { cal.setCalError("Connect your calendar to add the all day content event."); return false; }
    const body = {
      summary: title || "Untitled reel",
      description: description || "",
      start: { date }, end: { date: shiftISO(date, 1) },
      extendedProperties: { private: { allyCrmContentId: key } },
    };
    const r = existing && existing.eventId
      ? await cal.calFetch(`/calendars/${encodeURIComponent(existing.calendarId || "primary")}/events/${encodeURIComponent(existing.eventId)}`, { method: "PATCH", body: JSON.stringify(body) })
      : await cal.calFetch("/calendars/primary/events", { method: "POST", body: JSON.stringify(body) });
    if (!r.ok || !r.data || !r.data.id) { cal.setCalError("Could not create the all day content event."); return false; }
    setAlly((d) => ({ ...d, contentSchedule: { ...(d.contentSchedule || {}), [key]: { eventId: r.data.id, calendarId: "primary", date } } }));
    return true;
  };

  const schedLabel = (start) => `${start.toLocaleDateString("en-ZA", { weekday: "short", day: "numeric" })} ${minToLabel(start.getHours() * 60 + start.getMinutes())}`;

  /* ORPHAN CLEANUP. A block the CRM created can lose its link back — it happened during this build,
     when events made by an earlier version predated the identifying tag. Such a block matches nothing
     in ally.schedule and carries no tag, so it gets no controls and becomes permanently stuck on the
     calendar with no way to remove it from inside the app.
     This deletes the Google event by id and touches no CRM state, because by definition there is none
     left to clean up. Only offered for blocks whose description marks them as ours, so it can never be
     pointed at a real commitment. */
  const deleteOrphanEvent = async (calendarId, eventId) => {
    const r = await cal.calFetch(`/calendars/${encodeURIComponent(calendarId || "primary")}/events/${encodeURIComponent(eventId)}`, { method: "DELETE", quiet: true });
    if (!r.ok && r.status !== 404 && r.status !== 410) { cal.setCalError("Could not remove that block."); return false; }
    return true;
  };

  /* Remove a block from the calendar WITHOUT touching the task. The task returns to unscheduled — the
     chip goes grey — and stays exactly where it was on its card. This is the "×" on a block.
     A 404/410 is treated as success: the event is already gone, which is the desired end state, so
     the CRM should stop claiming it exists rather than refusing to let go of a phantom. */
  const unscheduleTask = async (taskId) => {
    const s = (ally.schedule || {})[taskId];
    if (!s || !s.eventId) return false;
    const r = await cal.calFetch(`/calendars/${encodeURIComponent(s.calendarId || "primary")}/events/${encodeURIComponent(s.eventId)}`, { method: "DELETE", quiet: true });
    if (!r.ok && r.status !== 404 && r.status !== 410) { cal.setCalError("Could not remove that from your calendar."); return false; }
    setAlly((d) => { const next = { ...(d.schedule || {}) }; delete next[taskId]; return { ...d, schedule: next }; });
    return true;
  };

  /* Move an existing block to a new day/slot, keeping its current length. PATCH the SAME event rather
     than delete-and-recreate: recreating would churn the event id, lose the CRM link and spam any
     guests or notifications attached to it. */
  const moveScheduled = async (taskId, day, startMin) => {
    const s = (ally.schedule || {})[taskId];
    if (!s || !s.eventId) return false;
    const durMs = Math.max(SLOT_MIN * 60000, new Date(s.endISO) - new Date(s.startISO));
    const start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), Math.floor(startMin / 60), startMin % 60, 0);
    const end = new Date(start.getTime() + durMs);
    const r = await cal.calFetch(`/calendars/${encodeURIComponent(s.calendarId || "primary")}/events/${encodeURIComponent(s.eventId)}`, {
      method: "PATCH",
      body: JSON.stringify({ start: { dateTime: start.toISOString() }, end: { dateTime: end.toISOString() } }),
    });
    if (!r.ok) return false;
    setAlly((d) => ({ ...d, schedule: { ...(d.schedule || {}), [taskId]: { ...s, startISO: start.toISOString(), endISO: end.toISOString(), label: schedLabel(start) } } }));
    return true;
  };

  /* Change only the END of a block — dragging its bottom edge to cover more slots. Start is untouched,
     and a block can never be shorter than one slot. */
  const resizeScheduled = async (taskId, endMin, day) => {
    const s = (ally.schedule || {})[taskId];
    if (!s || !s.eventId) return false;
    const start = new Date(s.startISO);
    const end = new Date(day.getFullYear(), day.getMonth(), day.getDate(), Math.floor(endMin / 60), endMin % 60, 0);
    if (end.getTime() - start.getTime() < SLOT_MIN * 60000) return false;
    const r = await cal.calFetch(`/calendars/${encodeURIComponent(s.calendarId || "primary")}/events/${encodeURIComponent(s.eventId)}`, {
      method: "PATCH",
      body: JSON.stringify({ end: { dateTime: end.toISOString() } }),
    });
    if (!r.ok) return false;
    setAlly((d) => ({ ...d, schedule: { ...(d.schedule || {}), [taskId]: { ...s, endISO: end.toISOString() } } }));
    return true;
  };

  /* ---------- Google -> CRM: pick up moves and deletions ----------
     One-way remains the rule for CONTENT (titles, what a task is). This is narrower: the TIME of a
     block lives in Google and nowhere else, so Google is simply the source of truth for it and there
     is nothing to conflict. Move a block in Google Calendar and the chip follows; delete it and the
     task becomes unscheduled again.

     Deliberately checks each stored event BY ID rather than scanning the visible window. A block
     dragged to next month would be absent from a 4-day fetch and would look deleted, which would
     silently un-schedule work that is very much still scheduled. An events.get per stored event is a
     handful of cheap calls and cannot make that mistake.

     Uses quiet: true because 404 and 410 here are the expected, meaningful outcomes, not errors.

     LIMITATION, and it is inherent rather than laziness: with no server there is nothing to receive
     Google's push notifications, so this can only run while the app is open — on load, on tab focus,
     and on a slow timer. A change made on the phone lands the next time the CRM is opened. */
  /* ---------- auto-scroll while dragging ----------
     The calendar sits above the pillar cards, and on most screens the two do not both fit. Without
     this, a task picked up from a card simply cannot reach a cell: you are holding the mouse button
     down, so you cannot scroll, and the page has no reason to move.

     Two details matter and the naive version gets both wrong:

     1. It runs on requestAnimationFrame, NOT on the dragover event. dragover stops firing when the
        pointer holds still, so scrolling driven by it stalls the moment you stop moving — which is
        exactly when you are hovering near the edge waiting for the page to come to you. The rAF loop
        keeps scrolling from the last known pointer position.
     2. Speed ramps with how close to the edge you are, rather than being a fixed jump. A constant
        speed either crawls or overshoots straight past the grid.

     Listeners are on `document` because a drag can leave the chip and the scroll container entirely,
     and dragend still needs to be heard so the loop is guaranteed to stop. */
  const scrollRef = useRef(null);
  useEffect(() => {
    const EDGE = 130;        // px from an edge where scrolling begins
    const MAX_SPEED = 24;    // px per frame at the very edge
    const IDLE_MS = 400;     // no dragover for this long -> the drag is over, whatever the events say
    let pointerY = null, raf = null, lastMove = 0;
    const step = () => {
      /* WATCHDOG. This loop must be able to stop itself. It previously relied entirely on dragend or
         drop arriving, and when neither did it kept scrolling forever with a stale pointer position —
         which is exactly the runaway downward scroll that was reported. dragover fires continuously
         during a real drag, so silence means the drag has ended. */
      if (Date.now() - lastMove > IDLE_MS) { stop(); return; }
      const el = scrollRef.current;
      if (el && pointerY != null) {
        const r = el.getBoundingClientRect();
        let v = 0;
        if (pointerY < r.top + EDGE) v = -MAX_SPEED * Math.min(1, (r.top + EDGE - pointerY) / EDGE);
        else if (pointerY > r.bottom - EDGE) v = MAX_SPEED * Math.min(1, (pointerY - (r.bottom - EDGE)) / EDGE);
        if (v) el.scrollTop += v;
      }
      raf = requestAnimationFrame(step);
    };
    const stop = () => { if (raf != null) cancelAnimationFrame(raf); raf = null; pointerY = null; };
    const onDragStart = (e) => {
      /* Capture runs before the dragged card's own handler can attach its dataTransfer payload.
         Identify real task cards from their marker instead, so scroll assistance reliably starts
         for calendar, priority, and Admin board drags. */
      if (!e.target || !e.target.closest || !e.target.closest("[data-scroll-drag]")) return;
      lastMove = Date.now();
      if (raf == null) raf = requestAnimationFrame(step);
    };
    const onDragOver = (e) => { if (raf != null) { pointerY = e.clientY; lastMove = Date.now(); } };
    /* CAPTURE PHASE, and this is load-bearing rather than incidental. Drop handlers inside the app
       call stopPropagation (the stage-group drop does), which prevents a bubbling document listener
       from ever seeing the drop — so `stop` was never reached and the loop ran on. Capture fires
       before any handler can stop propagation. */
    const opts = { capture: true };
    document.addEventListener("dragstart", onDragStart, opts);
    document.addEventListener("dragover", onDragOver, opts);
    document.addEventListener("dragend", stop, opts);
    document.addEventListener("drop", stop, opts);
    /* belt and braces: a pointer/mouse release means no drag can still be in progress */
    document.addEventListener("pointerup", stop, opts);
    window.addEventListener("blur", stop);
    return () => {
      stop();
      document.removeEventListener("dragstart", onDragStart, opts);
      document.removeEventListener("dragover", onDragOver, opts);
      document.removeEventListener("dragend", stop, opts);
      document.removeEventListener("drop", stop, opts);
      document.removeEventListener("pointerup", stop, opts);
      window.removeEventListener("blur", stop);
    };
  }, []);

  const syncingRef = useRef(false);
  const reconcileSchedule = useCallback(async () => {
    if (!cal.connected || !ally || syncingRef.current) return;
    const entries = Object.entries(ally.schedule || {});
    if (!entries.length) return;
    syncingRef.current = true;
    try {
      const changes = {};
      const removals = [];
      await Promise.all(entries.map(async ([taskId, s]) => {
        if (!s || !s.eventId) return;
        const r = await cal.calFetch(`/calendars/${encodeURIComponent(s.calendarId || "primary")}/events/${encodeURIComponent(s.eventId)}`, { quiet: true });
        /* gone for good: deleted (404), permanently removed (410), or tombstoned by Google */
        if (r.status === 404 || r.status === 410 || (r.ok && r.data && r.data.status === "cancelled")) { removals.push(taskId); return; }
        if (!r.ok || !r.data || !r.data.start) return;   // transient failure: change nothing
        const startISO = r.data.start.dateTime || (r.data.start.date ? `${r.data.start.date}T00:00:00` : null);
        const endISO = r.data.end && (r.data.end.dateTime || (r.data.end.date ? `${r.data.end.date}T00:00:00` : null));
        if (!startISO) return;
        const moved = new Date(startISO).getTime() !== new Date(s.startISO).getTime();
        if (!moved) return;
        const d = new Date(startISO);
        changes[taskId] = { ...s, startISO, endISO: endISO || s.endISO,
          label: `${d.toLocaleDateString("en-ZA", { weekday: "short", day: "numeric" })} ${minToLabel(d.getHours() * 60 + d.getMinutes())}` };
      }));
      if (!removals.length && !Object.keys(changes).length) return;
      setAlly((d) => {
        const next = { ...(d.schedule || {}), ...changes };
        removals.forEach((id) => { delete next[id]; });
        return { ...d, schedule: next };
      });
    } finally {
      syncingRef.current = false;
    }
  }, [cal.connected, cal.calFetch, ally && ally.schedule]);

  /* A CRM completion is also a calendar completion. Patch the existing event in place so its time,
     link, and event id stay intact. The local completed flag lets the grid turn green immediately
     after Google confirms, including when the task was completed from a non dashboard surface. */
  const completionSyncRef = useRef(false);
  useEffect(() => {
    if (!cal.connected || !ally || !mama || completionSyncRef.current) return;
    const doneIds = completedScheduledTaskIds(ally, mama);
    const changes = Object.entries(ally.schedule || {}).filter(([id, slot]) => slot && slot.eventId && !!slot.completed !== doneIds.has(id));
    if (!changes.length) return;
    completionSyncRef.current = true;
    (async () => {
      const confirmed = [];
      await Promise.all(changes.map(async ([id, slot]) => {
        const completed = doneIds.has(id);
        const response = await cal.calFetch(`/calendars/${encodeURIComponent(slot.calendarId || "primary")}/events/${encodeURIComponent(slot.eventId)}`, {
          method: "PATCH",
          body: JSON.stringify({ colorId: completed ? "10" : "9" }),
        });
        if (response.ok) confirmed.push([id, completed]);
      }));
      if (confirmed.length) {
        setAlly((current) => {
          const schedule = { ...(current.schedule || {}) };
          confirmed.forEach(([id, completed]) => {
            if (schedule[id]) schedule[id] = { ...schedule[id], completed };
          });
          return { ...current, schedule };
        });
      }
      completionSyncRef.current = false;
    })();
  }, [ally, mama, cal.connected, cal.calFetch]);

  /* syncTick drives both the reconcile above and the day grid's own refetch, so the chips and the
     grid never disagree about what Google currently says. */
  const [syncTick, setSyncTick] = useState(0);
  useEffect(() => {
    if (!cal.connected) return;
    const bump = () => setSyncTick((n) => n + 1);
    const onFocus = () => { if (document.visibilityState === "visible") bump(); };
    const id = setInterval(bump, 60000);
    window.addEventListener("visibilitychange", onFocus);
    window.addEventListener("focus", onFocus);
    return () => { clearInterval(id); window.removeEventListener("visibilitychange", onFocus); window.removeEventListener("focus", onFocus); };
  }, [cal.connected]);
  useEffect(() => { reconcileSchedule(); }, [syncTick, cal.connected]);
  const cloudLoadedFor = useRef(null); // uid a reconcile is/was in flight for
  const reconcileDone = useRef(false); // true only once that reconcile has FULLY resolved (fixes a
    // real race: signing in on a new device used to let the ongoing-save effect below fire in the
