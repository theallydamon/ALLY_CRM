    // same tick as the pull-or-seed effect, writing this device's stale local data to Firestore
    // before the pull had a chance to land — a slow network made the stale write win, clobbering
    // the good cloud copy. Gating on a ref that only flips true after the reconcile's try/finally
    // fully completes closes that window.
  const allyRef = useRef(ally); allyRef.current = ally;
  const mamaRef = useRef(mama); mamaRef.current = mama;
  const cloudTimer = useRef(null);

  useEffect(() => {
    if (!fbAuth) { setAuthReady(true); return; }
    const unsub = fbAuth.onAuthStateChanged((u) => { setUser(u); setAuthReady(true); });
    /* Safari web apps do not preserve a popup opener reliably. Their login uses a full-page
       redirect and lands back here, so collect that result before rendering the sign-in screen. */
    fbAuth.getRedirectResult().catch((e) => {
      const code = (e && e.code) || "";
      if (code) setAuthError(AUTH_ERRORS[code] || `Sign-in failed (${code}). Try again.`);
    });
    return unsub;
  }, []);

  /* The Firebase hosted auth handler is cross-site from the CRM. Safari web apps can block that
     handoff before Google is even reached. Use the Google library already used by Calendar and
     Sheets instead, then exchange its access token directly with Firebase. This keeps the whole
     sign-in inside the CRM window and never visits Firebase's fragile handler page. */
  const signInGoogle = async () => {
    if (!fbAuth) { setAuthError("Firebase failed to load, so sign-in is unavailable. Check your connection and reload."); return; }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setAuthError("Google sign-in is still loading. Wait a moment, then try again."); return;
    }
    setAuthError(""); setAuthStalled(false);
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      hint: (() => { try { return firebase.auth().currentUser.email; } catch (e) { return undefined; } })(),
      /* Identity only. Once Firebase knows which account signed in, the feature hooks request the
         correct account-specific grant: Calendar only for work, Calendar + Sheets for personal.
         This prevents the MAMA account from ever receiving or using a Skit Registry token. */
      scope: "openid email profile",
      callback: async (response) => {
        if (!response || response.error || !response.access_token) {
          setAuthError("Google sign-in did not finish. Try again."); return;
        }
        try {
          const credential = window.firebase.auth.GoogleAuthProvider.credential(null, response.access_token);
          await fbAuth.signInWithCredential(credential);
          googleTokenManager.resetForAccount();
        } catch (e) {
          const code = (e && e.code) || "";
          setAuthError(AUTH_ERRORS[code] || "Google sign-in could not be completed. Try again.");
        }
      },
      error_callback: () => setAuthError("Google sign-in window could not be opened. Try again."),
    });
    client.requestAccessToken({ prompt: "select_account" });
  };
  const signOutGoogle = async () => {
    if (!fbAuth) return;
    /* Drop the calendar grant FIRST. useCalendarAuth also clears on `user` going null, but that is
       a reactive backstop; doing it explicitly here means the token is gone even if the sign-out
       below throws partway. Required by 02-GOAL.md: signing out clears the calendar token. */
    try { cal.disconnect(); } catch (e) {}
    try { await fbAuth.signOut(); } catch (e) {}
    cloudLoadedFor.current = null; reconcileDone.current = false; setCloudState("offline"); setUser(null);
  };

  /* one-time cleanup helper: wipes this browser's local cache of ally/mama data. Only ever used
     from the signed-out gate screen below, as a manual "tidy up the stale copy" action — Firestore
     is untouched, and the app reloads clean right after (nothing to display, since we're signed out). */
  const clearLocalCache = () => {
    if (!window.confirm("This clears the copy of your data saved in this browser only. Your Google account's cloud copy in Firestore is not touched. Continue?")) return;
    try { localStorage.removeItem(ALLY_KEY); localStorage.removeItem(MAMA_KEY); } catch (e) {}
    window.location.reload();
  };

  const lastCloudStr = useRef(null);
  const lastRemoteData = useRef(null);

  const normaliseCloudData = (raw) => {
    if (!raw || !raw.ally || !raw.mama) return null;
    const remoteAlly = migrateAlly(raw.ally);
    const migrated = moveMamaAdminTasksToAi(remoteAlly, { ...raw.mama, tasks: migrateMamaTasks(raw.mama.tasks) });
    return { ally: migrated.ally, mama: migrated.mama };
  };

  /* Real-time shared workspace. Existing owners are recognised by their legacy users/<uid>
     document and migrate that data into the shared workspace exactly once. Explicit collaborators
     (currently ally@mama.co.za) join the already-created workspace and receive the same snapshot. */
  useEffect(() => {
    if (!fbDb || !user || !localLoaded) return;
    cloudLoadedFor.current = user.uid;
    setCloudState("loading");
    setWorkspaceError("");

    const docRef = fbDb.doc(CRM_WORKSPACE_PATH);
    const legacyRef = fbDb.collection("users").doc(user.uid);
    let unsub = () => {};
    let cancelled = false;

    (async () => {
      try {
        /* Transaction prevents two first-time sessions from creating competing workspace copies. */
        await fbDb.runTransaction(async (transaction) => {
          const shared = await transaction.get(docRef);
          if (shared.exists) return;
          const legacy = await transaction.get(legacyRef);
          const legacyData = legacy.exists ? normaliseCloudData(legacy.data()) : null;
          const seed = legacyData || { ally: allyRef.current, mama: mamaRef.current };
          transaction.set(docRef, {
            ...seed,
            workspaceId: CRM_WORKSPACE_ID,
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: user.email || user.uid,
          });
        });
      } catch (e) {
        if (!cancelled) {
          setCloudState("error");
          setWorkspaceError(e && e.code === "permission-denied"
            ? `${user.email || "This account"} does not have access to the shared CRM.`
            : "The shared CRM could not be opened. Check Firebase and reload.");
          reconcileDone.current = true;
        }
        return;
      }
      if (cancelled) return;

      unsub = docRef.onSnapshot(
      async (snap) => {
        if (!snap.exists || (snap.metadata && snap.metadata.hasPendingWrites)) return;
        const remote = normaliseCloudData(snap.data());
        if (!remote) return;
        const current = { ally: allyRef.current, mama: mamaRef.current };
        const base = lastRemoteData.current;
        const incoming = base ? mergeLiveValue(base, current, remote) : remote;

        lastRemoteData.current = remote;
        lastCloudStr.current = JSON.stringify(remote);
        if (!jsonEqual(incoming.ally, allyRef.current)) setAlly(incoming.ally);
        if (!jsonEqual(incoming.mama, mamaRef.current)) setMama(incoming.mama);
        setWorkspaceError("");
        setCloudState(jsonEqual(incoming, remote) ? "synced" : "saving");
        reconcileDone.current = true;
      },
      (err) => {
        setCloudState("error");
        setWorkspaceError(err && err.code === "permission-denied"
          ? `${user.email || "This account"} does not have access to the shared CRM.`
          : "Live sync was interrupted. Changes remain saved on this device while it reconnects.");
        reconcileDone.current = true;
      }
      );
    })();

    return () => {
      cancelled = true;
      unsub();
    };
  }, [user, localLoaded]);

  /* Ongoing sync writes through a transaction. The merge is calculated against the newest server
     snapshot inside that transaction, so an edit made by another user during our 300 ms debounce
     is incorporated instead of overwritten. */
  useEffect(() => {
    if (!fbDb || !user || !reconcileDone.current) return;
    const currentStr = JSON.stringify({ ally, mama });
    if (lastCloudStr.current && currentStr === lastCloudStr.current) {
      setCloudState("synced");
      return;
    }
    setCloudState("saving"); clearTimeout(cloudTimer.current);
    cloudTimer.current = setTimeout(async () => {
      try {
        const docRef = fbDb.doc(CRM_WORKSPACE_PATH);
        const local = { ally, mama };
        const merged = await fbDb.runTransaction(async (transaction) => {
          const snapshot = await transaction.get(docRef);
          const remote = snapshot.exists ? normaliseCloudData(snapshot.data()) : null;
          const base = lastRemoteData.current || remote || local;
          const resolved = remote ? mergeLiveValue(base, local, remote) : local;
          transaction.set(docRef, {
            ally: resolved.ally,
            mama: resolved.mama,
            workspaceId: CRM_WORKSPACE_ID,
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: user.email || user.uid,
          });
          return resolved;
        });
        const finalStr = JSON.stringify(merged);
        lastRemoteData.current = merged;
        lastCloudStr.current = finalStr;
        if (!jsonEqual(merged.ally, allyRef.current)) setAlly(merged.ally);
        if (!jsonEqual(merged.mama, mamaRef.current)) setMama(merged.mama);
        setWorkspaceError("");
        setCloudState("synced");
      } catch (e) {
        setCloudState("error");
        setWorkspaceError(e && e.code === "permission-denied"
          ? `${user.email || "This account"} does not have permission to edit the shared CRM.`
          : "That change could not sync yet. It remains saved on this device and will retry after the next edit.");
      }
    }, 300);
    return () => clearTimeout(cloudTimer.current);
  }, [ally, mama, user]);

  const useSave = (key, data) => {
    useEffect(() => {
      if (!loaded.current || !data) return;
      setSaveState("saving"); clearTimeout(timers.current[key]);
      timers.current[key] = setTimeout(async () => {
        try { await store.set(key, JSON.stringify(data)); setSaveState("saved"); setTimeout(() => setSaveState("idle"), 1400); } catch (e) { setSaveState("error"); }
      }, 250);
      return () => clearTimeout(timers.current[key]);
    }, [data]);
  };
  useSave(ALLY_KEY, ally);
  useSave(MAMA_KEY, mama);

  /* safety net: any edit (priority, status, whatever) must survive a fast tab-switch or refresh,
     so flush straight to localStorage the instant the tab is hidden/closed, bypassing the debounce. */
  useEffect(() => {
    const flush = () => {
      if (!loaded.current) return;
      try { if (ally) localStorage.setItem(ALLY_KEY, JSON.stringify(ally)); } catch (e) {}
      try { if (mama) localStorage.setItem(MAMA_KEY, JSON.stringify(mama)); } catch (e) {}
    };
    const onVis = () => { if (document.visibilityState === "hidden") flush(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", flush);
    window.addEventListener("beforeunload", flush);
    return () => {
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("pagehide", flush);
      window.removeEventListener("beforeunload", flush);
    };
  }, [ally, mama]);

  /* ---------- global undo/redo (Cmd/Ctrl+Z, Cmd/Ctrl+Shift+Z) ----------
     Snapshot-based history over the whole data model (ally + mama together), so ANY change anywhere —
     ticking a task off the hub, dragging a chip, editing a deal, deleting a note — is one undoable step.
     A burst of rapid edits (e.g. typing) collapses into a single step: the pre-burst snapshot is pushed
     when the burst starts, and nothing else is pushed until the edits settle (500ms quiet). Recording
     only arms after the first real user interaction, so loading and cloud-sync writes never land on the
     stack. While focus is in a text field we let the browser's native text undo win instead. */
  const undoStack = useRef([]);   // snapshots to go back to
  const redoStack = useRef([]);   // snapshots to go forward to
  const committed = useRef(null); // last settled snapshot (the current restore point)
  const undoTimer = useRef(null); // burst debounce
  const suppress = useRef(false); // set while WE drive setAlly/setMama, so the watcher doesn't re-record
  const undoArmed = useRef(false);
  const snapClone = (o) => { try { return JSON.parse(JSON.stringify(o)); } catch (e) { return o; } };
  const takeSnap = () => ({ ally: snapClone(allyRef.current), mama: snapClone(mamaRef.current) });

  useEffect(() => {
    const arm = () => { undoArmed.current = true; };
    window.addEventListener("pointerdown", arm, { once: true });
    window.addEventListener("keydown", arm, { once: true });
    return () => { window.removeEventListener("pointerdown", arm); window.removeEventListener("keydown", arm); };
  }, []);

  useEffect(() => {
    if (!loaded.current || !ally || !mama) return;
    const snap = takeSnap();
    if (committed.current === null || !undoArmed.current) { committed.current = snap; return; }
    if (suppress.current) { suppress.current = false; committed.current = snap; return; }
    if (!undoTimer.current) {                       // start of an edit burst
      undoStack.current.push(committed.current);
      if (undoStack.current.length > 60) undoStack.current.shift();
      redoStack.current = [];
    }
    clearTimeout(undoTimer.current);
    undoTimer.current = setTimeout(() => { undoTimer.current = null; committed.current = takeSnap(); }, 500);
  }, [ally, mama]);

  useEffect(() => {
    const onKey = (e) => {
      if (!(e.metaKey || e.ctrlKey) || (e.key !== "z" && e.key !== "Z")) return;
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return; // native text undo
      e.preventDefault();
      if (undoTimer.current) { clearTimeout(undoTimer.current); undoTimer.current = null; committed.current = takeSnap(); }
      if (e.shiftKey) {
        if (!redoStack.current.length) return;
        const next = redoStack.current.pop();
        undoStack.current.push(takeSnap());
        suppress.current = true; committed.current = next;
        setAlly(next.ally); setMama(next.mama);
      } else {
        if (!undoStack.current.length) return;
        const prev = undoStack.current.pop();
        redoStack.current.push(takeSnap());
        suppress.current = true; committed.current = prev;
        setAlly(prev.ally); setMama(prev.mama);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);


/* auto-clean: anything marked Done (Admin Tasks / Life Admin's kanban) or checked off (the
MiniTaskList "done" toggle used under Creators/Deals/Clients) gets removed
     12 hours after it was completed, using the doneAt timestamp stamped on it the moment it was
          marked done. Runs once shortly after load (catching data that was already stale when you
               opened the app) and then rechecks periodically while the tab stays open — no need to be
                    precise to the minute, this is just tidying, not anything the priority engine depends on
                         (completed items are already excluded from collectPriorityTasks regardless of how long they
                              linger). Items with no doneAt (older data from before this existed) are left alone rather
                                   than guessed at.
                                        Scope: this only touches actual disposable to-do lists (Admin Tasks, Life Admin, and the
                                             MiniTaskList sub-tasks under Creators/Deals/Clients). It does NOT touch
     Content (Posted ideas stay until you hit "Clear posted archive"), Song stages, the Deals
     pipeline itself (a deal reaching "Posted" is a history record, not deleted), Apartment
     ("Bought" items), or Unlocks — those are milestones/records, not disposable tasks, and keep
     their existing manual-clear-only behavior. */
  useEffect(() => {
    const STALE_MS = 12 * 60 * 60 * 1000;
    const stale = (t) => !!t.doneAt && Date.now() - t.doneAt > STALE_MS;
    const sweep = () => {
      if (!loaded.current) return;
      const a = allyRef.current, m = mamaRef.current;
      if (!a || !m) return;

      let aChanged = false;
      const lifeAdminItems = a.lifeAdmin.items.filter((t) => !(t.status === "Done" && stale(t)));
      if (lifeAdminItems.length !== a.lifeAdmin.items.length) aChanged = true;
      const dealsDeals = a.deals.deals.map((d) => {
        const tasks = (d.tasks || []).filter((t) => !(t.done && stale(t)));
        if (tasks.length !== (d.tasks || []).length) aChanged = true;
        return tasks.length !== (d.tasks || []).length ? { ...d, tasks } : d;
      });
      const dealsClients = a.deals.clients.map((cl) => {
        const tasks = (cl.tasks || []).filter((t) => !(t.done && stale(t)));
        if (tasks.length !== (cl.tasks || []).length) aChanged = true;
        return tasks.length !== (cl.tasks || []).length ? { ...cl, tasks } : cl;
      });
      if (aChanged) setAlly((prev) => ({ ...prev, lifeAdmin: { ...prev.lifeAdmin, items: lifeAdminItems }, deals: { ...prev.deals, deals: dealsDeals, clients: dealsClients } }));

      let mChanged = false;
      const adminTasks = m.tasks.filter((t) => !(t.status === "Done" && stale(t)));
      if (adminTasks.length !== m.tasks.length) mChanged = true;
      const creators = m.creators.map((cr) => {
        const tasks = (cr.tasks || []).filter((t) => !(t.done && stale(t)));
        if (tasks.length !== (cr.tasks || []).length) mChanged = true;
        return tasks.length !== (cr.tasks || []).length ? { ...cr, tasks } : cr;
      });
if (mChanged) setMama((prev) => ({ ...prev, tasks: adminTasks, creators }));
    };
    const kickoff = setTimeout(sweep, 4000);
    const id = setInterval(sweep, 15 * 60 * 1000);
    return () => { clearTimeout(kickoff); clearInterval(id); };
  }, []);

  const go = (next) => { setNavOpen(false); if (next === tab) return; setHistory((h) => [...h, tab].slice(-20)); setTab(next); setQ(""); };
  const back = () => { setHistory((h) => { if (!h.length) return h; const prev = h[h.length - 1]; setTab(prev); setQ(""); return h.slice(0, -1); }); };

  /* ---------- dashboard task navigation hub: turns the Priorities/Mama hub cards into a
     navigation surface. navigateToTask switches to the task's tab (via go, a no-op if already
     there), then stamps navRequest with a fresh seq so downstream modules (MamaModule's subtab
     switch, Creators'/DealsModule's expand-card effect) and scrollAndHighlight all re-fire even
     if the same task is clicked twice in a row. completeTask ticks the checkbox: it patches the
     underlying record via completePriorityTask, which reuses each pillar's own "done" mechanism,
     so the source tab and every ring/percentage derived from it update immediately. */
  const navSeq = useRef(0);
  const [navRequest, setNavRequest] = useState(null);
  const navigateToTask = (task) => {
    if (!task || !task.navTab) return;
    go(resolveNavTab(task.navTab, task.navSub));
    navSeq.current += 1;
    setNavRequest({ id: task.id, navTab: task.navTab, navSub: task.navSub || null, navOpenId: task.navOpenId || null, seq: navSeq.current });
  };
  const completeTask = (task) => completePriorityTask(setAlly, setMama, task);
  /* HOME's pillar cards navigate with go(pillarKey) — clicking the MAMA card calls go("mama").
     In the work profile "mama" is not in the strip: it is split into Creators / Admin Tasks /
     AI Tasks. Route HOME's card clicks through the same resolver the task chips use, so the MAMA
     card lands on Creators there instead of dropping onto a tab with no button. Every other
     pillarKey passes straight through unchanged, so the personal profile is unaffected. */
  const goFromHome = (next) => go(resolveNavTab(next, "creators"));
  /* Mama opens straight to the creator roster. The old task dashboard duplicated Home and made
     the main Mama tab land in the wrong place. */
  const goMamaCreators = () => {
    go(resolveNavTab("mama", "creators"));
    navSeq.current += 1;
    setNavRequest({ id: null, navTab: "mama", navSub: "creators", navOpenId: null, seq: navSeq.current });
  };
  useEffect(() => {
    if (!navRequest) return;
    if (navRequest.id) scrollAndHighlight(navRequest.id);
    /* self-clears a couple seconds after landing so a stale request (e.g. "jump to Creators")
       can never leak into a later, unrelated remount of the same module and hijack its default
       subtab — without this, switching away from Mama and back in via the plain rail click could
       reopen whatever subtab the last dashboard-task click happened to target. */
    const t = setTimeout(() => setNavRequest(null), 1400);
    return () => clearTimeout(t);
  }, [navRequest]);

  /* Export/import remains as a manual disaster-recovery backup. Normal multi-device and multi-user
     movement is handled live by the shared Firestore workspace above. */
  const [importMsg, setImportMsg] = useState("");
  const importInputRef = useRef(null);
  const exportData = () => {
    const blob = new Blob([JSON.stringify({ ally, mama, exportedAt: todayISO() }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ally-crm-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const triggerImport = () => importInputRef.current && importInputRef.current.click();
  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== "object" || !parsed.ally || !parsed.mama) throw new Error("bad shape");
        if (!window.confirm("This replaces everything currently in this browser with the imported backup. Continue?")) return;
        setAlly(parsed.ally); setMama(parsed.mama);
        setImportMsg("Imported ✓"); setTimeout(() => setImportMsg(""), 2500);
      } catch (err) {
        setImportMsg("Invalid file"); setTimeout(() => setImportMsg(""), 2500);
      }
    };
    reader.readAsText(file);
  };

  if (!ally || !mama) {
    return <div style={{ background: C.canvas, minHeight: "100vh" }} className="flex items-center justify-center"><div style={{ color: MUT, fontFamily: "'Bricolage Grotesque', sans-serif" }}>Opening ALLY CRM…</div></div>;
  }

  /* auth gate: if cloud sync is available (fbAuth loaded), don't render the app — or any locally
     cached data — until we actually know the sign-in state. Signed out (or still checking) shows a
     dedicated screen instead of ever flashing whatever's sitting in this browser's localStorage. */
  if (fbAuth && !authReady) {
    return <div style={{ background: C.canvas, minHeight: "100vh" }} className="flex items-center justify-center"><div style={{ color: MUT, fontFamily: "'Bricolage Grotesque', sans-serif" }}>Checking sign-in…</div></div>;
  }
  if (fbAuth && authReady && !user) {
    return (
      <div style={{ background: C.canvas, minHeight: "100vh" }} className="flex items-center justify-center">
        <div className="flex flex-col items-center" style={{ ...card, borderRadius: 20, padding: "40px 36px", width: 340, textAlign: "center" }}>
          <div style={{ width: 148, height: 148, borderRadius: 28, overflow: "hidden", marginBottom: 20 }}><img src={AVATAR_IMG} alt="Ally Damon" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} /></div>
          <div style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontStyle: "italic", fontSize: 26, letterSpacing: "0.04em", color: "#E6090F", textTransform: "uppercase", marginBottom: 6 }}>ALLY CRM</div>
          <div style={{ fontSize: 12.5, color: MUT, marginBottom: 24 }}>Sign in with Google to continue</div>
          <button onClick={signInGoogle} className="flex items-center justify-center gap-2 w-full" style={{ ...pillDark, padding: "11px 16px", fontSize: 14 }}>
            <CloudIcon size={15} /> Sign in with Google
          </button>
          {authError && (
            <div role="alert" style={{ marginTop: 14, padding: "9px 11px", borderRadius: 10, background: C.accentBg, border: `1px solid ${C.accentLine}`, fontSize: 11.5, lineHeight: 1.45, color: C.ink, textAlign: "left" }}>
              {authError}
              <div style={{ marginTop: 6, color: MUT, fontSize: 10.5 }}>Origin: {window.location.origin}</div>
            </div>
          )}
        </div>
      </div>
    );
  }

  const aptUnlocked = isApartmentUnlocked(ally);
  /* sidebar badge counts: for the 4 pillars that feed the Priorities dashboard (song, unlocks,
     deals, mama), pull the count from the exact same collectPriorityTasks pool the dashboard uses —
     that's every open task from every source for that pillar (e.g. Mama's badge used to only count
           the top-level captured-tasks board and miss anything logged under Creators;
     Deals only counted open deal records and missed deal/client sub-task checklists). Now every
     tab's badge means the same thing: how much open, non-paused work is sitting in that pillar. */
  const priorityTaskCounts = (() => {
    const tasks = collectPriorityTasks(ally, mama);
    return Object.fromEntries(PRIORITY_PILLARS.map((k) => [k, tasks.filter((t) => t.pillar === k).length]));
  })();
  /* Own counts for the three promoted work tabs. priorityTaskCounts.mama lumps creator, admin and
     AI tasks into one number, which is right for the single MAMA tab but useless when they are
     three separate tabs. Same filters the MAMA subtab pills already use, so the numbers agree. */
  const creatorTaskCount = (mama.creators || []).reduce((n, cr) => n + (cr.tasks || []).filter((t) => !t.done && !t.paused).length, 0);
  const adminTaskCount = (mama.tasks || []).filter((t) => !t.done && t.status !== "Done" && !t.paused).length;
  const aiTaskCount = (((ally.aiTasks || {}).projects) || []).reduce((n, pr) => n + (pr.tasks || []).filter((t) => !t.done).length, 0);
  const badges = {
    content: priorityTaskCounts.content,
    unlocks: priorityTaskCounts.unlocks,
    apartment: aptUnlocked ? ally.apartment.items.filter((i) => i.status === "Bought").length : null,
    lifeAdmin: priorityTaskCounts.lifeAdmin,
    deals: priorityTaskCounts.deals,
    mama: priorityTaskCounts.mama,
    creators: creatorTaskCount,
    adminTasks: adminTaskCount,
    aiTasks: aiTaskCount,
  };
  const mod = MODULES[tab];

  return (
    <div style={{ background: C.canvas, height: "100vh", overflow: "hidden", color: C.ink }}>
      <style>{`

/* ================= content health ================= */
function contentHealth(content) {
  const since = daysSince(content.lastPosted);
  const counts = Object.fromEntries(CONTENT_COLS.map((c) => [c, content.items.filter((i) => i.status === c).length]));
  const ready = content.items.filter((i) => i.status === "To Edit").length;
  let tint = C.mint, msg = "On track. Keep the machine fed.";
if (since === null) { tint = C.sky; msg = "Log when you last posted to start the runway clock."; }
  else if (since >= content.cadence && ready === 0) { tint = C.rose; msg = "Post overdue and nothing edited. Film or edit today."; }
  else if (since >= content.cadence) { tint = C.amber; msg = `Time to post. ${ready} sitting in To Edit.`; }
  else if (ready === 0 && counts["To Film"] === 0) { tint = C.amber; msg = "Downstream pipeline is empty. Script and film next."; }
  return { since, counts, ready, tint, msg };
}

/* finds whichever underlying record a dashboard task-id belongs to (a deal, a client sub-task, a
   mama creator's sub-task, a chain node, etc.) and patches its priority — this is what makes
   dragging a chip between Urgent/Medium/Low columns on the dashboard itself actually work, and it's
   the same setAlly/setMama the source tab reads from, so the tab reflects it immediately too. */
function setPillarItemPriority(setAlly, setMama, pillar, id, patch) {
  if (pillar === "song") {
    setAlly((d) => ({ ...d, song: { ...d.song, stages: d.song.stages.map((s) => (s.id === id ? { ...s, ...patch } : s)) } }));
    return;
  }
  if (pillar === "unlocks") {
    setAlly((d) => {
      const eco = d.unlocks.ecosystem;
      const ecosystem = eco ? { ...eco, pillars: eco.pillars.map((pl) => ({ ...pl, benefits: pl.benefits.map((b) => (b.id === id ? { ...b, ...patch } : b)) })) } : eco;
      const chains = d.unlocks.chains.map((ch) => ({ ...ch, nodes: ch.nodes.map((n) => (n.id === id ? { ...n, ...patch } : n)) }));
      return { ...d, unlocks: { ...d.unlocks, ecosystem, chains } };
    });
    return;
  }
  if (pillar === "deals") {
    setAlly((d) => {
      const deals = d.deals.deals.map((deal) => {
        if (deal.id === id) return { ...deal, ...patch };
        if ((deal.tasks || []).some((t) => t.id === id)) return { ...deal, tasks: deal.tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)) };
        return deal;
      });
      const clients = d.deals.clients.map((c) => ((c.tasks || []).some((t) => t.id === id) ? { ...c, tasks: c.tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)) } : c));
      return { ...d, deals: { ...d.deals, deals, clients } };
    });
    return;
  }
  if (pillar === "mama") {
    setMama((d) => ({
      ...d,
      tasks: d.tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)),
      creators: d.creators.map((cr) => ((cr.tasks || []).some((t) => t.id === id) ? { ...cr, tasks: cr.tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)), updatedAt: Date.now() } : cr)),
    }));
    setAlly((d) => ({
      ...d,
      aiTasks: { ...(d.aiTasks || {}), projects: ((d.aiTasks || {}).projects || []).map((project) => (
        (project.tasks || []).some((t) => t.id === id)
          ? { ...project, tasks: project.tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)) }
          : project
      )) },
    }));
    return;
  }
  if (pillar === "lifeAdmin") { setAlly((d) => ({ ...d, lifeAdmin: { ...d.lifeAdmin, items: d.lifeAdmin.items.map((t) => (t.id === id ? { ...t, ...patch } : t)) } })); return; } /* content has no draggable per-item priority — it's a single master signal, not handled here */
}

/* marks a dashboard task's underlying record complete/done, using whatever "done" mechanism its
   own source tab already uses (a checkbox toggle, a status column, an eco-state cycle...) — same
   setAlly/setMama as setPillarItemPriority above, so the source tab and every ring/percentage that
   depends on it update in the same tick the checkbox is ticked. Keyed off task.sourceType, which
   collectPriorityTasks / MamaTaskDashboard stamp onto every task alongside the nav fields below. */
function completePriorityTask(setAlly, setMama, task) {
  const now = Date.now();
  switch (task.sourceType) {
    case "song":
      setAlly((d) => ({ ...d, song: { ...d.song, stages: d.song.stages.map((s) => (s.id === task.id ? { ...s, status: "done", lastProgress: todayISO() } : s)) } }));
      return;
    case "unlocksBenefit":
      setAlly((d) => {
        const eco = d.unlocks.ecosystem;
        if (!eco) return d;
        return { ...d, unlocks: { ...d.unlocks, ecosystem: { ...eco, pillars: eco.pillars.map((pl) => ({ ...pl, benefits: pl.benefits.map((b) => (b.id === task.id ? { ...b, state: "live" } : b)) })) } } };
      });
      return;
    case "unlocksNode":
      setAlly((d) => ({ ...d, unlocks: { ...d.unlocks, chains: d.unlocks.chains.map((ch) => ({ ...ch, nodes: ch.nodes.map((n) => (n.id === task.id ? { ...n, status: "done" } : n)) })) } }));
      return;
    case "deal":
      /* completing a deal's hub task advances it to the next production stage; a Story (or the
         final Reel stage) goes straight to "done". */
      setAlly((d) => ({ ...d, deals: { ...d.deals, deals: d.deals.deals.map((x) => {
        if (x.id !== task.id) return x;
        if ((x.piece || "Reel") === "Story") return { ...x, stage: "done" };
        const i = REEL_STAGE_KEYS.indexOf(x.stage || "script");
        const next = i < REEL_STAGE_KEYS.length - 1 ? REEL_STAGE_KEYS[i + 1] : "done";
        return { ...x, stage: next };
      }) } }));
      return;
    case "clientTask":
      setAlly((d) => ({ ...d, deals: { ...d.deals, clients: d.deals.clients.map((c) => ((c.tasks || []).some((t) => t.id === task.id) ? { ...c, tasks: c.tasks.map((t) => (t.id === task.id ? { ...t, done: true, doneAt: now } : t)) } : c)) } }));
      return;
    case "mamaAdmin":
      setMama((d) => ({ ...d, tasks: d.tasks.map((t) => (t.id === task.id ? { ...t, status: "Done", doneAt: now } : t)) }));
      return;
    case "mamaCreator":
      setMama((d) => ({ ...d, creators: d.creators.map((cr) => ((cr.tasks || []).some((t) => t.id === task.id) ? { ...cr, tasks: cr.tasks.map((t) => (t.id === task.id ? { ...t, done: true, doneAt: now } : t)), updatedAt: now } : cr)) }));
      return;
    case "aiTask":
      setAlly((d) => ({
        ...d,
        aiTasks: { ...(d.aiTasks || {}), projects: ((d.aiTasks || {}).projects || []).map((project) => (
          (project.tasks || []).some((t) => t.id === task.id)
            ? { ...project, tasks: project.tasks.map((t) => (t.id === task.id ? { ...t, done: true, doneAt: now } : t)) }
            : project
        )) },
      }));
      return;
/* content's two hub lists ("To Film" deadlines, "To Edit" deadlines) each have their own
       "done" mechanism on the Content tab itself: ticking a "To Film" item advances it straight
       to "To Edit" (same as the → arrow on its card) and resets the due date, since there's no
       separate "filmed" flag anymore — the column alone decides whether a deadline is a filming
       date or an editing date, so nothing can silently disable it out of sync with reality.
  Ticking a "To Edit" item marks it READY TO POST (editing's done, it just needs a
  publish date now — see the Content calendar), exactly like clicking the → arrow on
       place you tick it off from). */
    case "contentToFilm":
      setAlly((d) => ({ ...d, content: { ...d.content, items: d.content.items.map((i) => (i.id === task.id ? { ...i, status: "To Edit", due: null } : i)) } }));
      return;
    case "contentToEdit":
      setAlly((d) => ({ ...d, content: { ...d.content, items: d.content.items.map((i) => (i.id === task.id ? { ...i, status: "Ready to Post", due: null } : i)) } }));
      return;
    case "musicToFilm":
setAlly((d) => ({ ...d, musicContent: { ...d.musicContent, items: d.musicContent.items.map((i) => (i.id === task.id ? { ...i, status: "To Edit", due: null } : i)) } }));
return;
case "musicToEdit":
setAlly((d) => ({ ...d, musicContent: { ...d.musicContent, items: d.musicContent.items.map((i) => (i.id === task.id ? { ...i, status: "Ready to Post", due: null } : i)) } }));
return;
case "lifeAdmin":
      setAlly((d) => ({ ...d, lifeAdmin: { ...d.lifeAdmin, items: d.lifeAdmin.items.map((t) => (t.id === task.id ? { ...t, status: "Done", doneAt: now } : t)) } }));
      return;
  }
}

/* finds the DOM node a dashboard task points at (every source render tags its own task's root
   element with data-nav-id={id}) and scrolls it into view + gives it a ~1s blinking highlight, then
   removes the flash class. Retries for a bit because the target tab/subtab/expand-card usually
   still needs one or two renders to mount after navigateToTask fires (tab switch -> module mounts
   -> its own effect flips a subtab/openId -> that renders the actual element) — polling sidesteps
   having to hand-sequence those renders exactly. Gives up silently after ~1.2s if nothing turns up. */
function scrollAndHighlight(id, attempts) {
  if (attempts === undefined) attempts = 20;
  const el = document.querySelector(`[data-nav-id="${id}"]`);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("nav-highlight");
    setTimeout(() => el.classList.remove("nav-highlight"), 1000);
    return;
  }
  if (attempts > 0) setTimeout(() => scrollAndHighlight(id, attempts - 1), 60);
}

/* Shared tick-off checkbox for every hub dashboard task. Empty rounded box that, on click, fills
   mint with a checkmark for a beat, then fires onComplete (which marks the underlying record done via
   completePriorityTask, dropping it off the dashboard). Local `done` state so the tick reads before it
   goes. Same 14px footprint as the old bare complete-dots it replaces. */
function CompleteCheckbox({ onComplete, size = 18, mt = 0, label = "Mark complete" }) {
  const [done, setDone] = useState(false);
  const [hover, setHover] = useState(false);
  return (
    <button onClick={(e) => { e.stopPropagation(); if (done) return; setDone(true); setTimeout(() => onComplete && onComplete(), 240); }}

      aria-label={label} title={label}
      style={{ width: size, height: size, borderRadius: 6, cursor: "pointer", flexShrink: 0, marginTop: mt, padding: 0, display: "flex", alignItems: "center", justifyContent: "center", background: done ? C.mint : hover ? "rgba(47,163,124,0.15)" : "rgba(255,255,255,0.04)", border: `2px solid ${done ? C.mint : hover ? C.mint : "rgba(242,242,244,0.45)"}`, transition: "background 0.15s, border-color 0.15s" }}>
      {(done || hover) && <Check size={size - 6} color={done ? "#0B0B0D" : C.mint} strokeWidth={3} />}
    </button>

}

/* ================= PRIORITY DASHBOARD ================= */
function PriorityDashboard({ ally, mama, go, setAlly, setMama, navigateToTask, completeTask, schedule, onlyPillar }) {
const tasks = collectPriorityTasks(ally, mama);
const byPillar = Object.fromEntries(PRIORITY_PILLARS.map((k) => [k, tasks.filter((t) => t.pillar === k)]));
const contentPostUrgency = computeContentUrgency(ally.content);
const musicPostUrgency = computeContentUrgency(ally.musicContent);
const contentTaskPct = computePillarFillPercent(byPillar.content.filter((t) => !t._preScored));
const musicTaskPct = computePillarFillPercent(byPillar.music.filter((t) => !t._preScored));
const fillPct = Object.fromEntries(PRIORITY_PILLARS.map((k) => [k,
k === "content" ? Math.max(contentTaskPct, contentPostUrgency.pct) :
k === "music" ? Math.max(musicTaskPct, musicPostUrgency.pct) :
computePillarFillPercent(byPillar[k])]));
/* FIXED ORDER, owner's call 30 Jul 2026: Life Admin, Comedy Content, Music Content, Mama.
   The cards used to re-sort themselves by how full each ring was, which meant they moved around under
   the cursor between visits — bad for muscle memory generally, and actively bad now that tasks are
   dragged out of them onto the calendar. The rings still show urgency; only the position is frozen.
   The number badge is therefore position, not rank. */
const CARD_ORDER = ["lifeAdmin", "content", "music", "mama"];
const ranked = CARD_ORDER.filter((k) => PRIORITY_PILLARS.includes(k) && (!onlyPillar || k === onlyPillar));
const rankOf = Object.fromEntries(ranked.map((k, i) => [k, i + 1]));
const onDropPriority = (pillar, id, patch) => setPillarItemPriority(setAlly, setMama, pillar, id, patch);

/* Moving a content task between stages from its dashboard card. Writes the real item in the real
   pipeline, which is why it shows up on the Content tab's board immediately — same data, two views,
   no mirroring logic to drift.
   `pipe` comes from the chip rather than being inferred, because the Comedy card merges brandContent
   items alongside content ones and they live in different pipelines. */
const onSetStatus = ({ id, pipe, from }, status) => {
  if (!pipe || from === status) return;
  setAlly((d) => {
    const p = d[pipe];
    if (!p || !Array.isArray(p.items)) return d;
    return { ...d, [pipe]: { ...p, items: p.items.map((i) => (i.id === id ? { ...i, status } : i)) } };
  });
};

return (
<section>
<div style={{ marginBottom: 16 }}>
<h1 className="page-h1" style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700 }}>{onlyPillar ? (onlyPillar === "lifeAdmin" ? "Life Admin" : onlyPillar === "music" ? MUSIC_CONTENT_MOD.label : MODULES[onlyPillar].label) : "Priorities right now"}</h1>
</div>

{/* ALL FOUR PILLARS ON ONE ROW, deliberately a fixed 4-up rather than auto-fit.
auto-fit used to wrap to 3 + 1, which puts the fourth card on a second line — and in step 4 a task
is dragged from a card UP into the calendar, so a card on a lower row would force the drag to
travel across two other cards to get there. Fixed columns keep every card the same distance from
the grid. The class (not inline style) is so the media queries below can collapse it on narrow
screens, where a 4-up would be unusable and there is no dragging anyway. */}
<div className={`grid gap-3${onlyPillar ? "" : " pillar-grid"}`} style={onlyPillar ? { gridTemplateColumns: "minmax(0, 1fr)" } : undefined}>
{ranked.map((k) => (
k === "content"
? <ContentPillarCard key={k} content={ally.content} pipelineKey="content" mod={MODULES.content} go={go} rank={rankOf[k]} taskPct={contentTaskPct} postPct={contentPostUrgency.pct} onNavigate={navigateToTask} onComplete={completeTask} extraItems={ally.brandContent.items} schedule={schedule} onSetStatus={onSetStatus} />
: k === "music"
? <ContentPillarCard key={k} content={ally.musicContent} pipelineKey="musicContent" mod={MUSIC_CONTENT_MOD} go={go} rank={rankOf[k]} taskPct={musicTaskPct} postPct={musicPostUrgency.pct} onNavigate={navigateToTask} onComplete={completeTask} schedule={schedule} onSetStatus={onSetStatus} />
: <PriorityPillarCard key={k} pillarKey={k} tasks={byPillar[k]} go={go} rank={rankOf[k]} onDropPriority={onDropPriority} pct={fillPct[k]} onNavigate={navigateToTask} onComplete={completeTask} schedule={schedule} />
))}
</div>
</section>
);
}

const PRIORITY_COL_TINT = { Urgent: C.rose, Medium: C.amber, Low: C.sky };

/* ================= TASK CHIPS: DRAG A TASK ONTO THE CALENDAR =================
   Step 4. A chip can be picked up from any pillar card and dropped on a half-hour cell in the day
   grid, which creates a real Google Calendar event. The chip STAYS on the card — it is not moved
   away — and turns green to show it now has a time.

   TWO DRAG PAYLOADS, ON PURPOSE. The pillar cards already had their own internal drag for moving a
   task between the Urgent/Medium/Low columns, using "application/json". The calendar needs its own
   type so the two cannot be confused: dropping on a column must never try to schedule, and dropping
   on a cell must never try to re-prioritise. Both are set on the same drag, and each drop target
   reads only the type it understands. Do not collapse them into one.

   WHERE THE SCHEDULE LIVES: ally.schedule, a flat map of taskId -> { eventId, calendarId, ... }.
   Deliberately NOT stored on the individual pipeline items. Tasks reaching the dashboard come from
   half a dozen different shapes (content items, mama tasks, life-admin items, deal sub-tasks), and
   some are synthetic — a content item with both a deadline and a post date produces two task rows,
   one with an id of `<id>-sched`. One flat map keyed by the dashboard's own task id sidesteps all of
   that, and means scheduling never has to reach into a pillar's data shape. */
/* A chip is green only while its scheduled slot is still ahead of it — today or later. The moment that
   day passes without the task being ticked off, the green clears and it reads as unscheduled again,
   because a plan you did not act on is not a plan any more and should be prompting a reschedule.

   The underlying entry is deliberately NOT deleted. The Google event still exists as history, and
   keeping the record means scrolling the grid back to a past day still shows that block as ours, with
   its × and its link intact. Only the card's treatment of it expires, not the data.

   Compared by calendar day rather than by timestamp: a block at 09:00 should stay green all day, not
   go stale at 09:31. */
function currentSchedule(schedule) {
  const t = new Date(); const todayStart = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
  const out = {};
  Object.entries(schedule || {}).forEach(([id, s]) => {
    if (!s || !s.startISO) return;
    const d = new Date(s.startISO);
    if (new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() >= todayStart) out[id] = s;
  });
  return out;
}

/* Calendar blocks belong to many different task stores. Keep the completion test in one place so
   a completed task always changes its matching calendar event to green, regardless of where it was
   checked off. */
function completedScheduledTaskIds(ally, mama) {
  const done = new Set();
  (ally.lifeAdmin.items || []).forEach((t) => { if (t.status === "Done") done.add(t.id); });
  (ally.deals.deals || []).forEach((d) => {
    if (d.stage === "done") done.add(d.id);
    (d.tasks || []).forEach((t) => { if (t.done) done.add(t.id); });
  });
  (ally.deals.clients || []).forEach((c) => (c.tasks || []).forEach((t) => { if (t.done) done.add(t.id); }));
  [ally.content, ally.brandContent, ally.musicContent].forEach((pipeline) => (pipeline && pipeline.items || []).forEach((i) => { if (i.status === "Posted") done.add(i.id); }));
  (mama.tasks || []).forEach((t) => { if (t.status === "Done") done.add(t.id); });
  (mama.creators || []).forEach((creator) => (creator.tasks || []).forEach((t) => { if (t.done) done.add(t.id); }));
  return done;
}

const SCHED_MIME = "application/x-ally-schedule";
const ADMIN_TASK_MIME = "application/x-ally-admin-task";
/* Moving a content task between pipeline stages by dragging it across the groups on its dashboard
   card. Its own type, kept separate from SCHED_MIME (calendar) and "application/json" (priority
   buckets), so a single drag can offer all three and each drop target reads only what it understands. */
const STATUS_MIME = "application/x-ally-status";

function TaskChip({ taskId, title, pillar, due, dateKind, scheduled, onOpen, statusMove }) {
  const [dragging, setDragging] = useState(false);
  return (
    <div
      draggable
      data-scroll-drag
      onDragStart={(e) => {
        setDragging(true);
        e.dataTransfer.setData(SCHED_MIME, JSON.stringify({ taskId, title, pillar }));
        /* keep the legacy payload so the within-card column drop still works */
        e.dataTransfer.setData("application/json", JSON.stringify({ id: taskId, pillar }));
        /* content chips can additionally be dropped on another stage group to move pipeline stage */
        if (statusMove) e.dataTransfer.setData(STATUS_MIME, JSON.stringify(statusMove));
        e.dataTransfer.effectAllowed = "copyMove";
      }}
      onDragEnd={() => setDragging(false)}
      onClick={(e) => { e.stopPropagation(); onOpen && onOpen(); }}
      title={`${title}${scheduled ? `\nScheduled ${scheduled.label}` : ""}\nDrag onto the calendar to give it a time`}
      className="lift"
      style={{
        minWidth: 0, cursor: "grab", opacity: dragging ? 0.45 : 1,
        borderRadius: 7, padding: "4px 6px", fontSize: 10.5, lineHeight: 1.25,
        background: scheduled ? "rgba(47,163,124,0.20)" : FILL,
        border: `1px solid ${scheduled ? "rgba(47,163,124,0.60)" : LINE}`,
        color: C.ink,
      }}>
      <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
        {scheduled && <span aria-hidden style={{ width: 5, height: 5, borderRadius: 99, background: C.mint, flexShrink: 0 }} />}
        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", minWidth: 0 }}>{title}</span>
      </div>
      {/* Says WHICH of the two dates is counting down. "5d" alone was the thing being misread as the
          other date; "post 5d" versus "do 5d" cannot be. */}
      <div style={{ fontSize: 8.5, color: scheduled ? C.mint : dateKind === "post" ? C.sky : MUT, marginTop: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
        {scheduled ? scheduled.label
          : due ? `${dateKind === "post" ? "post" : "do"} ${dueLabel(due)}`
          : "no date"}
      </div>
    </div>
  );
}

/* One bordered group per column, laid out horizontally with its tasks underneath, three across
   before wrapping — the owner's layout, so a card reads as grouped blocks rather than tall columns. */
/* One group per pipeline stage, tinted with that stage's own colour at low alpha so the stages read as
   separate zones at a glance rather than three near-identical boxes.
   `onDropStatus` makes the group a drop target for a chip dragged out of another stage. */
function TaskGroup({ label, tint, count, children, empty, onDropStatus }) {
  const [over, setOver] = useState(false);
  const base = tint || MUT;
  return (
    <div
      onDragOver={onDropStatus ? (e) => {
        if (!Array.from(e.dataTransfer.types).includes(STATUS_MIME)) return;
        e.preventDefault(); e.dataTransfer.dropEffect = "move";
        if (!over) setOver(true);
      } : undefined}
      onDragLeave={onDropStatus ? () => setOver(false) : undefined}
      onDrop={onDropStatus ? (e) => {
        e.preventDefault(); e.stopPropagation(); setOver(false);
        let p; try { p = JSON.parse(e.dataTransfer.getData(STATUS_MIME)); } catch (err) { return; }
        if (p && p.id) onDropStatus(p);
      } : undefined}
      style={{ border: `1px solid ${over ? base : `${base}33`}`, borderRadius: 9, padding: "6px 7px 7px",
        background: over ? `${base}26` : `${base}12`, transition: "background-color 0.14s ease, border-color 0.14s ease" }}>
      <div className="flex items-center justify-between" style={{ marginBottom: 5 }}>
        <span style={{ fontSize: 8.5, letterSpacing: "0.09em", textTransform: "uppercase", color: base, fontWeight: 700 }}>{label}</span>
        {count != null && <span style={{ fontSize: 8.5, color: FAINT }}>{count}</span>}
      </div>
      {children ? (
        <div className="grid" style={{ gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 4 }}>{children}</div>
      ) : <div style={{ fontSize: 9, color: FAINT }}>{empty || "—"}</div>}
    </div>
  );
}

/* short human label for a due date, used on the chips */
function dueLabel(iso) {
  const d = daysUntil(iso);
  if (d === null || d === undefined) return "";
  if (d < 0) return `${Math.abs(d)}d overdue`;
  if (d === 0) return "today";
  if (d === 1) return "tomorrow";
  return `${d}d`;
}

/* Content's card doesn't show Urgent/Medium/Low task columns like the other pillars — content has no
   individual priorities anymore, just one master signal (days since last post, entirely independent
   of the pipeline) rendered as its own fill ring, plus a glance at where ideas sit in the pipeline. */
function ContentPillarCard({ content, pipelineKey, mod, go, rank, taskPct, postPct, onNavigate, onComplete, extraItems, schedule, onSetStatus }) {
const since = daysSince(content.lastPosted);
const taskTint = urgencyTint(taskPct);
const postTint = urgencyTint(postPct);
const critical = postPct > 100;
const filmType = pipelineKey === "musicContent" ? "musicToFilm" : "contentToFilm";
const editType = pipelineKey === "musicContent" ? "musicToEdit" : "contentToEdit";
const navSub = pipelineKey === "musicContent" ? "musicContent" : "content";
const pipelineCols = ["Ready to Post", "To Edit", "To Film", "Ideas"];
const counts = Object.fromEntries(pipelineCols.map((c) => [c, content.items.filter((i) => i.status === c).length]));
/* two separate deadline feeds so filming deadlines and editing deadlines stay visually apart —
title pulls through by title only (never the script/desc box), same rule every other pillar
follows. Both rings above stay purely score-driven regardless of what is in either list. */
/* Each item is tagged with the pipeline it actually lives in. The Comedy card merges brandContent
alongside content, and a status change has to patch the pipeline that owns the item — without the tag a
Brand Deals item dropped on another stage would be written into `content` and silently vanish. */
const allItems = [
  ...content.items.map((i) => ({ ...i, _pipe: pipelineKey })),
  ...((extraItems || []).map((i) => ({ ...i, _pipe: "brandContent" }))),
];
/* TO POST is the Ready-to-Post stage. Unlike the other feeds it deliberately does NOT require a
date: something finished and waiting to go out is actionable regardless, and needing a date first
was why this stage never appeared as a task list at all. */
/* All four feeds read dates through liveDue/livePost, so muting a chip removes the item from the
   dashboard immediately without deleting the date underneath. */
const byDate = (a, b) => daysUntil(liveDate(a)) - daysUntil(liveDate(b));
/* `paused` means the owner switched this item's priority off — clicking the active L/M/H pill in
PriorityControls sets it. A paused item must not appear on the dashboard at all; it was still showing
under TO POST because that feed only checked status. */
/* NO CAPS on any of these. They used to slice to 3 (and 6 for To Post), which quietly hid work —
if six videos are waiting to be filmed, six must be visible, or the card lies about the workload.
The groups wrap at three per row, so extra items flow onto the next row. */
const toPostDated = allItems.filter((i) => i.status === "Ready to Post" && !i.paused).sort((a, b) => daysUntil(livePost(a) || liveDue(a)) - daysUntil(livePost(b) || liveDue(b)));
const toFilmDated = allItems.filter((i) => i.status === "To Film" && !i.paused && liveDate(i)).sort(byDate);
const toEditDated = allItems.filter((i) => i.status === "To Edit" && !i.paused && liveDate(i)).sort(byDate);
return (
<div onClick={() => onNavigate && onNavigate({ navTab: "content", navSub })} className="rounded-2xl p-4 pillar-card" style={{ ...card, borderRadius: 16, borderLeft: "4px solid " + mod.accent, cursor: "pointer" }}>
<div className="flex items-center justify-between mb-3">
<div className="flex items-center gap-2 min-w-0">
<span style={{ width: 28, height: 28, borderRadius: 99, background: mod.accent, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 14, flexShrink: 0 }}>{rank}</span>
{(() => { const G = NAV_ICONS[mod.icon]; return G ? <G size={17} color={MUT} strokeWidth={1.9} style={{ flexShrink: 0 }} /> : null; })()}
<span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 16, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{mod.label}</span>
</div>
<ArrowUpRight size={16} color={MUT} />
</div>
<div className="flex items-center justify-center gap-6" style={{ padding: "6px 0 16px" }}>
<div className="flex flex-col items-center text-center">
<Ring pct={Math.min(1, taskPct / 100)} tint={taskTint} size={104} thick={12} label={Math.round(taskPct) + "%"} />
<div style={{ fontSize: 11, fontWeight: 600, color: MUT, marginTop: 8, letterSpacing: "0.03em", textTransform: "uppercase" }}>Tasks</div>
</div>
<div className="flex flex-col items-center text-center">
<Ring pct={Math.min(1, postPct / 100)} tint={postTint} size={104} thick={12} label={Math.round(postPct) + "%"} />
<div style={{ fontSize: 11, fontWeight: 600, color: MUT, marginTop: 8, letterSpacing: "0.03em", textTransform: "uppercase" }}>Posting</div>
</div>
</div>
<div style={{ fontSize: 13.5, fontWeight: 600, color: postTint, textAlign: "center", marginTop: -6, marginBottom: 12 }}>{since === null ? "no post logged yet" : since === 1 ? "1 day since last post" : since + " days since last post"}</div>
{critical && <div style={{ fontSize: 10.5, fontWeight: 700, color: C.rose, marginTop: -8, marginBottom: 10, textAlign: "center", letterSpacing: "0.03em" }}>⚠ CRITICAL — post overdue</div>}
<div className="grid gap-2" style={{ gridTemplateColumns: "repeat(3, 1fr)" }}>
{pipelineCols.map((c) => (
<div key={c} className="rounded-lg py-2 text-center" style={{ background: C.soft, border: "1px solid " + LINE }}>
<div style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 19, color: CONTENT_TINT[c] }}>{counts[c]}</div>
<div style={{ fontSize: 9.5, letterSpacing: "0.04em", textTransform: "uppercase", color: MUT, marginTop: 2 }}>{c}</div>
</div>
))}
</div>
<div className="flex flex-col gap-2 mt-3 pt-3" style={{ borderTop: "1px solid " + LINE }}>
{/* FIXED ORDER, owner's call 30 Jul 2026: TO FILM, then TO EDIT, then TO POST — the real production
sequence, so the card reads top-to-bottom the way the work actually flows.
IDEAS is deliberately absent from both this and the Music card. It is a bank of unstarted thoughts
rather than scheduleable work, and it crowded out the three stages that are. It is still on the
Content board and still in the counts row above.
Each column is a bordered group with its tasks underneath, three across before wrapping. */}
<TaskGroup label="To Film" tint={CONTENT_TINT["To Film"]} count={toFilmDated.length || null} empty="—" onDropStatus={(p) => onSetStatus && onSetStatus(p, "To Film")}>
{toFilmDated.length ? toFilmDated.map((i) => (
<TaskChip key={i.id} taskId={i.id} title={i.title} pillar={pipelineKey} due={liveDate(i)} dateKind={liveDue(i) ? "do" : "post"}
scheduled={schedule && schedule[i.id]} statusMove={{ id: i.id, pipe: i._pipe, from: i.status }}
onOpen={() => onNavigate && onNavigate({ id: i.id, navTab: "content", navSub })} />
)) : null}
</TaskGroup>
<TaskGroup label="To Edit" tint={CONTENT_TINT["To Edit"]} count={toEditDated.length || null} empty="—" onDropStatus={(p) => onSetStatus && onSetStatus(p, "To Edit")}>
{toEditDated.length ? toEditDated.map((i) => (
<TaskChip key={i.id} taskId={i.id} title={i.title} pillar={pipelineKey} due={liveDate(i)} dateKind={liveDue(i) ? "do" : "post"}
scheduled={schedule && schedule[i.id]} statusMove={{ id: i.id, pipe: i._pipe, from: i.status }}
onOpen={() => onNavigate && onNavigate({ id: i.id, navTab: "content", navSub })} />
)) : null}
</TaskGroup>
<TaskGroup label="To Post" tint={CONTENT_TINT["Ready to Post"]} count={toPostDated.length || null} empty="—" onDropStatus={(p) => onSetStatus && onSetStatus(p, "Ready to Post")}>
{toPostDated.length ? toPostDated.map((i) => (
<TaskChip key={i.id} taskId={i.id} title={i.title} pillar={pipelineKey} due={livePost(i) || liveDue(i)} dateKind={livePost(i) ? "post" : "do"}
scheduled={schedule && schedule[i.id]} statusMove={{ id: i.id, pipe: i._pipe, from: i.status }}
onOpen={() => onNavigate && onNavigate({ id: i.id, navTab: "content", navSub })} />
)) : null}
</TaskGroup>
</div>
</div>
);
}
/* dragging a chip between Urgent/Medium/Low sets its underlying priority (High/Medium/Low) via
   setPillarItemPriority, so it feeds straight back into the item's own tab. Drops carry their
   source pillar in the payload, so a drop is ignored unless it lands on a column in its own card —
   dragging across cards (e.g. Deals into Mama) is a strict no-op by design. */
const DROP_PRIORITY = { Urgent: "High", Medium: "Medium", Low: "Low" }; /* dropping onto a column also sets a matching due date: Urgent -> due today, Medium -> due tomorrow, Low -> due in a week. */ const DROP_DUE_OFFSET = { Urgent: 0, Medium: 1, Low: 7 }; const dropPatchFor = (col) => ({ priority: DROP_PRIORITY[col], due: shiftISO(todayISO(), DROP_DUE_OFFSET[col]) });

function PriorityPillarCard({ pillarKey, tasks, go, rank, onDropPriority, pct, onNavigate, onComplete, schedule }) {
  const mod = MODULES[pillarKey];
  const cols = ["Urgent", "Medium", "Low"];
  const [dragOverCol, setDragOverCol] = useState(null);
  const tint = urgencyTint(pct);
  const critical = pct > 100;
  const handleDrop = (e, col) => {
    e.preventDefault();
    setDragOverCol(null);
    let payload;
    try { payload = JSON.parse(e.dataTransfer.getData("application/json")); } catch (err) { return; }
    if (!payload || payload.pillar !== pillarKey) return; // strictly within-card only
    onDropPriority(pillarKey, payload.id, dropPatchFor(col));
  };
  return (
    <div onClick={() => go(pillarKey)} className="rounded-2xl p-4 pillar-card" style={{ ...card, borderRadius: 16, borderLeft: `4px solid ${mod.accent}`, cursor: "pointer" }}>
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2 min-w-0">
          <span style={{ width: 28, height: 28, borderRadius: 99, background: mod.accent, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 14, flexShrink: 0 }}>{rank}</span>
          {(() => { const G = NAV_ICONS[mod.icon]; return G ? <G size={17} color={MUT} strokeWidth={1.9} style={{ flexShrink: 0 }} /> : null; })()}
          <span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 16, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{mod.label}</span>
        </div>
        <ArrowUpRight size={16} color={MUT} />
      </div>
      <div className="flex flex-col items-center text-center" style={{ padding: "6px 0 16px" }}>
        <Ring pct={Math.min(1, pct / 100)} tint={tint} size={148} thick={16} label={`${Math.round(pct)}%`} />
        {critical && <span style={{ fontSize: 10.5, fontWeight: 700, color: C.rose, letterSpacing: "0.03em", marginTop: 10 }}>⚠ CRITICAL — overloaded</span>}
      </div>
      {/* Same shape as the Content card: each bucket is a bordered group laid out horizontally with
          its tasks underneath, three across before wrapping. The group is still a drop target for the
          existing within-card priority drag, which reads "application/json"; the chips additionally
          carry SCHED_MIME for the calendar. The two never collide because each target only reads its
          own type. */}
      <div className="flex flex-col gap-2">
        {cols.map((col) => {
          const items = tasks.filter((t) => t.bucket === col).sort((a, b) => b.score - a.score);
          const over = dragOverCol === col;
          return (
            <div key={col}
              onDragOver={(e) => {
                /* only react to the priority drag — a calendar drag passing over must not light this up */
                if (!Array.from(e.dataTransfer.types).includes("application/json")) return;
                e.preventDefault();
                if (!over) setDragOverCol(col);
              }}
              onDragLeave={() => setDragOverCol((c) => (c === col ? null : c))}
              onDrop={(e) => handleDrop(e, col)}
              style={{ border: `1px solid ${over ? PRIORITY_COL_TINT[col] : LINE}`, borderRadius: 9, padding: "6px 7px 7px",
                background: over ? `${PRIORITY_COL_TINT[col]}14` : "rgba(255,255,255,0.02)" }}>
              <div className="flex items-center justify-between" style={{ marginBottom: 5 }}>
                <span style={{ fontSize: 8.5, letterSpacing: "0.09em", textTransform: "uppercase", color: PRIORITY_COL_TINT[col], fontWeight: 700 }}>{col}</span>
                <span style={{ fontSize: 8.5, color: FAINT }}>{items.length}</span>
              </div>
              {items.length ? (
                <div className="grid" style={{ gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 4 }}>
                  {items.map((t) => (
                    <TaskChip key={t.id} taskId={t.id} title={t.title} pillar={pillarKey} due={t.due}
                      scheduled={schedule && schedule[t.id]} onOpen={() => onNavigate(t)} />
                  ))}
                </div>
              ) : <div style={{ fontSize: 9, color: FAINT }}>—</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* `off` + `onToggle` are optional. Pass onToggle to make the chip a click-to-disable switch:
   the date stays stored on the item, but while off the chip renders struck-through/greyed and every
   urgency reader (computeContentUrgency, collectPriorityTasks, the hub To Film/To Edit feeds) skips
   it — so a deadline can be muted without losing the date, then clicked again to bring it back.
   stopPropagation keeps the toggle from also firing the card's expand/collapse click. */
function DueChip({ due, inline, off, onToggle }) {
  const d = daysUntil(due);
  if (d === null) return null;
  const tint = off ? MUT : d < 0 ? C.rose : d <= 2 ? C.amber : MUT;
  const text = d < 0 ? `overdue ${-d}d` : d === 0 ? "today" : `${d}d`;
  const deco = off ? "line-through" : "none";
  if (inline) return <span style={{ color: tint, textDecoration: deco }}>{text}</span>;
  const clickable = !!onToggle;
  return <span
    onClick={clickable ? (e) => { e.stopPropagation(); onToggle(); } : undefined}
    title={clickable ? (off ? "Deadline off — click to switch it back on" : "Click to disable this deadline") : undefined}
    style={{ fontSize: 10.5, color: tint, background: `${tint}1a`, border: `1px solid ${tint}44`, borderRadius: 99, padding: "2px 8px", flexShrink: 0, textDecoration: deco, opacity: off ? 0.75 : 1, cursor: clickable ? "pointer" : "default", userSelect: "none" }}>{text}</span>;
}

/* the same day bands as dueBandScore, but returning an actual priority label instead of a score —
   this is what makes picking a date auto-select the priority. High = due today or overdue,
   Medium = due 1-3 days out, Low = due 4+ days out. Content is untouched by this — it has its own
   separate days-since-last-post urgency model (computeContentUrgency), no due dates involved. */
function priorityFromDueDate(daysUntilDue) {
  if (daysUntilDue === null || daysUntilDue === undefined) return null;
  if (daysUntilDue <= 0) return "High";   // today or overdue
  if (daysUntilDue <= 3) return "Medium"; // due in 1-3 days
  return "Low";                            // due 4+ days out
}

/* used by every task-capture form (Admin Tasks, Life Admin, MiniTaskList) so picking an optional
   due date at creation time auto-selects the right starting priority instead of always defaulting
   to Medium — same day bands as priorityFromDueDate/PriorityControls, so there's no gap where a
   freshly-captured task with a close date briefly shows the wrong priority before the next render. */
function priorityForNewTask(due) {
  return due ? (priorityFromDueDate(daysUntil(due)) || "Medium") : "Medium";
}
/* Capture forms use tomorrow when no date is selected. This keeps a new task visible in the
   Medium daily-triage group immediately, instead of storing a date-less task that can be missed. */
const defaultTaskDue = () => shiftISO(todayISO(), 1);

/* shared control row: due date + priority (Low/Med/High) + log progress + due-date readout.
   Used on every item across the 6 pillars so the Priorities dashboard can score them all the same way.
   Whenever a due date is set, the priority is auto-selected from it and kept in sync continuously as
   the date gets closer (today or overdue -> High, 1-3 days -> Medium, 4+ days -> Low) — same day bands
   as the Urgent/Medium/Low bucket, so nothing here can disagree with the dashboard. A deadline is
   pass/fail, so once a date is set it drives the priority; the two non-matching L/M/H buttons grey
   out (they're not there to be manually overridden away from what the calendar says). Clear the due
   date, or pause the item, to take manual control of priority again.
   Clicking the already-selected priority button again PAUSES this item instead: it stops feeding the
   Priorities dashboard entirely (collectPriorityTasks skips anything with .paused), the due date
   clears and greys out, and none of L/M/H show as selected. It's for things you want to keep on the
   board but haven't decided are a live priority yet — existing, not urgent. Clicking any L/M/H
   button again un-pauses it, picks that priority, and resets the due date back to blank so you set
   a fresh one rather than reviving a stale old date. */
function PriorityControls({ item, onChange, hideDue }) {
  const u = computeUrgency(item);
  const pr = item.priority || "Medium";
  const paused = !!item.paused;
  const dateTarget = paused ? null : priorityFromDueDate(u.daysUntilDue);
  useEffect(() => {
    if (dateTarget && pr !== dateTarget) onChange({ priority: dateTarget });
  }, [dateTarget, pr]);
  const dueTint = u.daysUntilDue === null ? MUT : u.daysUntilDue < 0 ? C.rose : u.daysUntilDue <= 2 ? C.amber : MUT;
  const setPriority = (p) => {
    if (paused) onChange({ priority: p, paused: false, due: null });
    else if (pr === p) onChange({ paused: true, due: null });
    else if (!dateTarget) onChange({ priority: p }); // no date driving it -> free manual choice
    // else: a due date is actively setting this item's priority; only the matching button (handled
    // above via pr === p, which pauses) does anything — the other two are disabled below.
  };
  return (
    <div className="flex items-center gap-1.5 flex-wrap mt-1.5" style={{ fontSize: 11, opacity: paused ? 0.55 : 1 }}>
      {!hideDue && (
        <input type="date" value={item.due || ""} disabled={paused} onClick={(e) => e.stopPropagation()} onChange={(e) => onChange({ due: e.target.value || null })}
          className="rounded-md" style={{ ...darkInput, fontSize: 10.5, padding: "3px 5px", cursor: paused ? "not-allowed" : "text" }} aria-label="Due date" />
      )}
      <div className="flex gap-1">
        {PRIORITY_LEVELS.map((p) => {
          const locked = !!dateTarget && p !== dateTarget;
          return (
            <button key={p} onClick={(e) => { e.stopPropagation(); setPriority(p); }} disabled={locked} className="rounded-full px-2 py-0.5"
              title={!paused && pr === p && !dateTarget ? "Click again to pause — stop tracking this as a priority"
                : !paused && pr === p && dateTarget ? "Set by the due date. Click to pause, or clear/edit the date to change it."
                : paused ? "Paused — click a level to resume"
                : locked ? "Set by the due date — clear the date or pause to override manually" : undefined}
              style={{ fontSize: 10, cursor: locked ? "not-allowed" : "pointer", fontFamily: "inherit",
                background: !paused && pr === p ? `${PRIORITY_TINT[p]}22` : FILL, border: `1px solid ${!paused && pr === p ? PRIORITY_TINT[p] : LINE}`,
                color: !paused && pr === p ? PRIORITY_TINT[p] : locked ? FAINT : MUT, opacity: locked ? 0.5 : 1 }}>{p[0]}</button>
          );
        })}
      </div>
      <button onClick={(e) => { e.stopPropagation(); onChange({ lastProgress: todayISO() }); }} className="flex items-center gap-1 rounded-full px-2 py-0.5"
        style={{ fontSize: 10, cursor: "pointer", fontFamily: "inherit", background: FILL, border: `1px solid ${LINE}`, color: MUT }}
        title="Log progress today"><Zap size={10} /> progress</button>
      {/* waiting on someone else: parks the task off the Priorities dashboard until the chase date,
          then brings it back flagged and High so a silent reply can't quietly bury it. */}
      <button onClick={(e) => { e.stopPropagation(); onChange(item.chaseOn ? { chaseOn: null } : { chaseOn: shiftISO(todayISO(), 3) }); }} className="flex items-center gap-1 rounded-full px-2 py-0.5"
        style={{ fontSize: 10, cursor: "pointer", fontFamily: "inherit", background: item.chaseOn ? `${C.sky}22` : FILL, border: `1px solid ${item.chaseOn ? C.sky : LINE}`, color: item.chaseOn ? C.sky : MUT, whiteSpace: "nowrap" }}
        title="Waiting on a reply — pauses priority until the follow up date, then restores it as due">waiting on reply</button>
      {item.chaseOn && (
        <span className="flex items-center gap-1" style={{ fontSize: 10, color: C.sky, whiteSpace: "nowrap" }}>
          follow up
          <input type="date" value={item.chaseOn} onClick={(e) => e.stopPropagation()} onChange={(e) => onChange({ chaseOn: e.target.value || null })} className="rounded-md" style={{ ...darkInput, fontSize: 10.5, padding: "3px 5px" }} aria-label="Chase date" />
        </span>
      )}
      {paused ? (
        <span style={{ marginLeft: "auto", color: FAINT, fontWeight: 600, whiteSpace: "nowrap" }}>paused</span>
      ) : u.daysUntilDue !== null ? (
        <span style={{ marginLeft: "auto", color: dueTint, fontWeight: 600, whiteSpace: "nowrap" }}>
          {u.daysUntilDue < 0 ? `${-u.daysUntilDue}d overdue` : u.daysUntilDue === 0 ? "today" : `${u.daysUntilDue}d`}
        </span>
      ) : null}
    </div>
  );
}

/* ---- rich text paste sanitizer for the skit script box ----
   goal: let bold / italic / font size survive a paste from Claude, Docs, Word, Notion etc,
   without dragging in the source's colors or backgrounds, and without literal pasted sizes
   blowing out this small card. every size found (explicit or implied by a heading tag) gets
   rescaled onto a small fixed range relative to the box's own font size, so relative emphasis
   (this was bigger than that) survives but nothing can overflow. */
const SCRIPT_SIZE_MIN = 0.85, SCRIPT_SIZE_MAX = 1.7, SCRIPT_ASSUMED_SOURCE_BASE_PX = 16;
const SCRIPT_SIZE_STEPS = [0.85, 1, 1.15, 1.35, 1.6];
const SCRIPT_HEADING_EM = { H1: 2, H2: 1.5, H3: 1.17, H4: 1, H5: 0.83, H6: 0.67 };
const SCRIPT_ALLOWED_INLINE = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1, P: 1, DIV: 1, SPAN: 1, UL: 1, OL: 1, LI: 1 };

function scriptToPx(raw, parentPx) {
  if (!raw) return null;
  raw = raw.trim();
  const m = raw.match(/^([\d.]+)\s*(px|pt|em|rem|%)$/i);
  if (!m) return null;
  const num = parseFloat(m[1]), unit = m[2].toLowerCase();
  if (unit === "px") return num;
  if (unit === "pt") return num * (96 / 72);
  if (unit === "em") return num * (parentPx || SCRIPT_ASSUMED_SOURCE_BASE_PX);
  if (unit === "rem") return num * SCRIPT_ASSUMED_SOURCE_BASE_PX;
  if (unit === "%") return (num / 100) * (parentPx || SCRIPT_ASSUMED_SOURCE_BASE_PX);
  return null;
}
function scriptNormalizeSize(px) {
  const ratio = px / SCRIPT_ASSUMED_SOURCE_BASE_PX;
  return Math.min(SCRIPT_SIZE_MAX, Math.max(SCRIPT_SIZE_MIN, ratio));
}
function scriptStyleFromDecl(styleAttr) {
  const out = {};
  if (!styleAttr) return out;
  styleAttr.split(";").forEach((decl) => {
    const parts = decl.split(":");
    if (parts.length < 2) return;
    const key = parts[0].trim().toLowerCase();
    const val = parts.slice(1).join(":").trim();
    if (key === "font-size") out.fontSize = val;
    if (key === "font-weight") out.fontWeight = val;
    if (key === "font-style") out.fontStyle = val;
    if (key === "text-decoration") out.textDecoration = val;
    /* color, background, background-color, font-family: intentionally dropped */
  });
  return out;
}
function scriptSanitizeNode(node, parentPx, out) {
  if (node.nodeType === Node.TEXT_NODE) { out.appendChild(document.createTextNode(node.textContent)); return; }
  if (node.nodeType !== Node.ELEMENT_NODE) return;
  const tag = node.tagName;
  const decl = scriptStyleFromDecl(node.getAttribute("style"));
  const explicitPx = decl.fontSize ? scriptToPx(decl.fontSize, parentPx) : null;
  const headingPx = SCRIPT_HEADING_EM[tag] ? SCRIPT_HEADING_EM[tag] * SCRIPT_ASSUMED_SOURCE_BASE_PX : null;
  const sourcePx = explicitPx || headingPx || parentPx;
  const isHeading = !!SCRIPT_HEADING_EM[tag];
  let container;
  if (isHeading || explicitPx) {
    container = document.createElement("span");
    const scale = scriptNormalizeSize(sourcePx);
    let css = "font-size:" + scale.toFixed(2) + "em;";
    if (isHeading) css += "font-weight:600;";
    if (decl.fontWeight) css += "font-weight:" + decl.fontWeight + ";";
    if (decl.fontStyle) css += "font-style:" + decl.fontStyle + ";";
    if (decl.textDecoration) css += "text-decoration:" + decl.textDecoration + ";";
    container.setAttribute("style", css);
  } else if (SCRIPT_ALLOWED_INLINE[tag]) {
    container = document.createElement(tag.toLowerCase());
    if (decl.fontWeight) container.style.fontWeight = decl.fontWeight;
    if (decl.fontStyle) container.style.fontStyle = decl.fontStyle;
    if (decl.textDecoration) container.style.textDecoration = decl.textDecoration;
  } else {
    /* unknown/disallowed tag (a, img, table, font, o:p, etc): unwrap, keep text + children */
    container = document.createDocumentFragment();
  }
  for (let i = 0; i < node.childNodes.length; i++) scriptSanitizeNode(node.childNodes[i], sourcePx, container);
  if (isHeading) container.appendChild(document.createElement("br"));
  out.appendChild(container);
}
function scriptSanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const out = document.createDocumentFragment();
  for (let i = 0; i < doc.body.childNodes.length; i++) scriptSanitizeNode(doc.body.childNodes[i], SCRIPT_ASSUMED_SOURCE_BASE_PX, out);
  const wrapper = document.createElement("div");
  wrapper.appendChild(out);
  return wrapper.innerHTML;
}
function scriptEscapeToHtml(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML.replace(/\n/g, "<br>");
}

/* skit script box: collapsed to a single line by default (so the board stays compact),
   auto-grows to fit whatever's pasted in once focused, and can be manually collapsed
