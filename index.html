            <div key={col} onDragOver={(e) => { e.preventDefault(); setDragOverCol(col); }} onDragLeave={() => setDragOverCol(null)} onDrop={(e) => { e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (id) dropIntoColumn(id, col); setDragOverCol(null); }} style={{ background: dragOverCol === col ? CONTENT_TINT[col] + "14" : C.canvas, padding: 16, display: "flex", flexDirection: "column", gap: 9, transition: "background 120ms ease" }}>
              <div className="flex items-center justify-between px-0.5" style={{ paddingBottom: 9, borderBottom: `1px solid ${LINE}`, marginBottom: 2 }}>
                <span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 12.5, letterSpacing: "0.05em", textTransform: "uppercase", color: CONTENT_TINT[col] }}>{col}</span>
                <span className="flex items-center gap-1"><span style={{ fontSize: 12.5, color: MUT }}>{cItems.length}</span><button onClick={() => setColumnCards(true)} style={{ ...iconBtn, padding: "2px 4px", fontSize: 10 }} title="Expand all cards">Expand all</button><button onClick={() => setColumnCards(false)} style={{ ...iconBtn, padding: "2px 4px", fontSize: 10 }} title="Collapse all cards">Collapse all</button></span>
              </div>
              <div className="flex flex-col gap-2.5">
                {cItems.map((i) => {
                  /* description defaults to open (full height) the moment it has content, so an
                     idea with a pasted paragraph always shows the whole thing without a click —
                     openDesc only overrides that once you've explicitly toggled it yourself. */
                  const descOpen = openDesc[i.id] !== undefined ? openDesc[i.id] : false;
                  const toggleDesc = () => { if (hasTextSelection()) return; setOpenDesc((o) => ({ ...o, [i.id]: !descOpen })); };
                  return (
                  <div key={i.id} data-nav-id={i.id} draggable onDragStart={(e) => { e.dataTransfer.setData("text/plain", i.id); e.dataTransfer.effectAllowed = "move"; }} onClick={toggleDesc} className="rounded-lg" style={{ cursor: "pointer", background: "rgba(255,255,255,0.035)", border: `1px solid ${LINE}`, borderLeft: `2px solid ${CONTENT_TINT[col]}`, borderRadius: 10, padding: "11px 13px" }}>
                    <InlineEdit value={i.title} onChange={(v) => updateItem(i.id, { title: v })} strong bubbleClicks />{livePost(i) && <span title={"Posts on " + i.scheduledFor} style={{ marginLeft: 6, fontSize: 12 }}>📅</span>}<button onClick={(e) => { e.stopPropagation(); setExpandedId(i.id); }} style={{ ...iconBtn, padding: 2, marginLeft: 6 }} aria-label="Expand description" title="Expand description to full screen">⤢</button>
                    <ScriptBox value={i.desc || ""} isHtml={!!i.descHtml} open={descOpen} onFocus={() => openIfNot(i.id)} onChange={(v) => updateItem(i.id, { desc: v, descHtml: true })} onToggle={toggleDesc} />
                    {col !== "Posted" && <div className="flex items-center gap-2 mt-1.5 flex-wrap" style={{ fontSize: 10.5 }}>
                      {/* TWO DIFFERENT DATES, and they were being mistaken for each other. Each now sits
                          in its own bordered, colour-coded block with an unambiguous name:
                            DO BY   (amber) — finish this stage's work
                            POST ON (blue)  — publish it
                          Both day-count chips are clickable to mute that date. Muting does NOT delete
                          it — the value stays and returns on a second click — because the usual reason
                          to mute is having typed into the wrong box. */}
                      <span onClick={(e) => e.stopPropagation()} className="flex items-center gap-1.5"
                        style={{ border: `1px solid ${i.due && !i.dueOff ? `${C.amber}55` : LINE}`, borderRadius: 8, padding: "2px 5px", background: i.due && !i.dueOff ? `${C.amber}0f` : "transparent" }}>
                        <span style={{ fontSize: 8.5, letterSpacing: "0.08em", color: i.dueOff ? FAINT : C.amber, fontWeight: 700 }}>DO BY</span>
                        <input type="date" value={i.due || ""} onClick={(e) => e.stopPropagation()} onChange={(e) => updateItem(i.id, { due: e.target.value || null })} className="rounded-md" style={{ ...darkInput, fontSize: 10.5, padding: "2px 4px", opacity: i.dueOff ? 0.45 : 1 }} aria-label="Do by — finish this stage's work" title="Finish this stage's work by this date" />
                        <DueChip due={i.due} off={i.dueOff} onToggle={() => updateItem(i.id, { dueOff: !i.dueOff })} />
                      </span>
                      <span onClick={(e) => e.stopPropagation()} className="flex items-center gap-1.5"
                        style={{ border: `1px solid ${livePost(i) ? `${C.sky}55` : LINE}`, borderRadius: 8, padding: "2px 5px", background: livePost(i) ? `${C.sky}0f` : "transparent" }}>
                        <span style={{ fontSize: 8.5, letterSpacing: "0.08em", color: i.schedOff ? FAINT : C.sky, fontWeight: 700 }}>POST ON</span>
                        <input type="date" value={i.scheduledFor || ""} onClick={(e) => e.stopPropagation()} onChange={(e) => setPostDate(i, e.target.value)} className="rounded-md" style={{ ...darkInput, fontSize: 10.5, padding: "2px 4px", opacity: i.schedOff ? 0.45 : 1 }} aria-label="Post on — publish date" title="Publish it on this date" />
                        <DueChip due={i.scheduledFor} off={i.schedOff} onToggle={() => updateItem(i.id, { schedOff: !i.schedOff })} />
                      </span>
                      {col === "Ready to Post" && <button onClick={(e) => { e.stopPropagation(); markPosted(i.id); }} className="rounded-full px-2 py-0.5" style={{ fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", background: `${C.mint}1a`, border: `1px solid ${C.mint}55`, color: C.mint }} title="Move to posted archive">✓ Posted</button>}
                    </div>}
                    {col !== "Posted" && <PriorityControls item={i} onChange={(p) => updateItem(i.id, p)} hideDue />}
                    <div className="flex items-center gap-1 mt-1.5"><span className="ml-auto flex gap-1">
                      {col === "Posted" ? <button onClick={(e) => { e.stopPropagation(); updateItem(i.id, { status: "Ready to Post", postedAt: null }); }} style={{ ...iconBtn, padding: 2, color: C.mint }} title="Restore to Ready to Post">←</button> : col !== "Ideas" && <button onClick={(e) => { e.stopPropagation(); move(i.id, -1); }} style={{ ...iconBtn, padding: 2, color: C.mint }} aria-label="Back" title="Move to previous stage">←</button>}
                      {col !== "Posted" && <button onClick={(e) => { e.stopPropagation(); col === "Ready to Post" ? markPosted(i.id) : move(i.id, 1); }} style={{ ...iconBtn, padding: 2, color: C.mint }} aria-label="Forward" title={col === "Ready to Post" ? "Move to posted archive" : "Move to next stage"}>→</button>}
                      <button onClick={(e) => { e.stopPropagation(); remove(i.id); }} style={{ ...iconBtn, padding: 2 }} aria-label="Delete"><X size={11} /></button>
                    </span></div>
                  </div>
                  );
                })}
                {cItems.length === 0 && <div className="rounded-lg text-center" style={{ border: `1px dashed ${LINE}`, fontSize: 12, color: FAINT, borderRadius: 10, padding: "14px 6px" }}>{ql ? "No match" : "Empty"}</div>}
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}


function RingDark({ value, max, label, tint, size = 100 }) {
  const r = (size - 9) / 2, c = 2 * Math.PI * r, pct = max ? Math.min(1, value / max) : 0;
  return (
    <div className="flex flex-col items-center" style={{ flexShrink: 0, gap: 3 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={`${label} since post`} style={{ position: "relative" }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth="9" />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={tint} strokeWidth="9" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - pct)} transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset 0.6s ease" }} />
        <text x={size / 2} y={size / 2} textAnchor="middle" dominantBaseline="central" fill="#fff" style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontSize: size * 0.26, fontWeight: 700 }}>{label}</text>
      </svg>
      <span style={{ fontSize: 9, letterSpacing: "0.06em", color: "rgba(255,255,255,0.55)", whiteSpace: "nowrap" }}>SINCE POST</span>
    </div>
  );
}

/* ================= SONG ================= */
function SongModule({ data, setData }) {
  const song = data.song;
  const patch = (p) => setData((d) => ({ ...d, song: { ...d.song, ...p } }));
  const updateStage = (id, p) => patch({ stages: song.stages.map((s) => (s.id === id ? { ...s, ...p } : s)) });
  const updateGear = (id, p) => patch({ gear: song.gear.map((g) => (g.id === id ? { ...g, ...p } : g)) });
  const addGear = () => patch({ gear: [...song.gear, { id: uid(), name: "New item", price: 0, bought: false }] });
  const removeGear = (id) => patch({ gear: song.gear.filter((g) => g.id !== id) });
  const done = song.stages.filter((s) => s.status === "done").length;
  const gearTotal = song.gear.reduce((s, g) => s + (Number(g.price) || 0), 0);
  const gearSpent = song.gear.filter((g) => g.bought).reduce((s, g) => s + (Number(g.price) || 0), 0);

  /* the "current" stage is derived — the first not-done stage in order — never stored.
     that way it can never get stuck: toggle any stage's checkbox to mark it done (which
     unlocks the next one) or undo it, and the current step always recalculates from that. */
  const currentIdx = song.stages.findIndex((s) => s.status !== "done");
  const toggleStage = (i) => {
    const wasDone = song.stages[i].status === "done";
    patch({ stages: song.stages.map((st, j) => (j === i ? { ...st, status: wasDone ? "todo" : "done", lastProgress: wasDone ? st.lastProgress : todayISO() } : st)) });
  };

  return (
    <section>
      <SectionHead title="Get a song out" sub="One roadmap from sing test to release. Only the stage you're on right now carries a deadline — finish it to unlock the next." />
      <div className="rounded-2xl mb-6 flex items-center gap-4" style={{ ...card, borderRadius: 16, padding: 16, background: `linear-gradient(135deg, ${C.lilacBg}, ${C.card})`, border: `1px solid ${C.lilac}33` }}>
        <Ring pct={done / song.stages.length} tint={C.lilac} size={58} thick={7} label={`${done}`} />
        <div className="flex-1"><div style={{ fontSize: 13, color: MUT, marginBottom: 6 }}>{done} of {song.stages.length} stages done</div><Bar pct={done / song.stages.length} tint={C.lilac} /></div>
      </div>
      <div className="flex flex-col">
        {song.stages.map((s, i) => {
          const isDone = s.status === "done", isCurrent = !isDone && i === currentIdx, isLocked = !isDone && !isCurrent;
          const tint = isDone ? C.mint : isCurrent ? AURAS[i % AURAS.length] : FAINT;
          return (
          <div key={s.id} className="flex gap-4" style={{ opacity: isLocked ? 0.7 : 1 }}>
            <div className="flex flex-col items-center" style={{ width: 36, flexShrink: 0 }}>
              <button onClick={() => toggleStage(i)} aria-label={isDone ? "Mark not done" : "Mark done"} title={isLocked ? "Out of order — click to mark done anyway and skip ahead" : isDone ? "Mark not done" : "Mark done"}
                style={{ width: 34, height: 34, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", background: isDone ? C.mint : isCurrent ? `${tint}22` : C.card, border: `1px solid ${isDone ? C.mint : isCurrent ? tint : LINE}`, fontFamily: "'Bricolage Grotesque', sans-serif", fontSize: 13, fontWeight: 600, color: isDone ? "#fff" : isCurrent ? tint : MUT }}>
                {isDone ? <Check size={16} strokeWidth={3} /> : isLocked ? <Lock size={14} /> : i + 1}
              </button>
              {i < song.stages.length - 1 && <div style={{ width: 2, flex: 1, minHeight: 22, background: isDone ? `${C.mint}66` : LINE }} />}
            </div>
            <div data-nav-id={s.id} className="rounded-2xl p-4 mb-4 flex-1" style={{ ...card, borderRadius: 16, borderLeft: `3px solid ${tint}`, background: isCurrent ? `${tint}0d` : card.background }}>
              <div className="flex items-center gap-2 flex-wrap">
                <div className="flex-1" style={{ minWidth: 140, textDecoration: isDone ? "line-through" : "none" }}><InlineEdit value={s.name} onChange={(v) => updateStage(s.id, { name: v })} strong /></div>
                <span className="rounded-full px-3 py-1" style={{ fontSize: 11, fontWeight: 600, background: `${tint}1e`, border: `1px solid ${tint}55`, color: tint }}>{isDone ? "Done" : isCurrent ? "Current" : "Locked"}</span>
              </div>
              <div style={{ fontSize: 12.5, color: MUT, margin: "4px 0 6px" }}>{s.desc}</div>
              {s.kind === "gear" && (
                <div className="rounded-xl p-3 my-2" style={{ ...cardSoft, borderRadius: 12 }}>
                  {song.gear.filter((g) => !g.bought).map((g) => (
                    <div key={g.id} className="flex items-center gap-2 py-1 flex-wrap">
                      <button onClick={() => updateGear(g.id, { bought: !g.bought })} aria-label="Toggle bought" style={{ width: 22, height: 22, borderRadius: 7, cursor: "pointer", flexShrink: 0, background: g.bought ? C.mint : C.card, border: `1px solid ${g.bought ? C.mint : LINE}`, display: "flex", alignItems: "center", justifyContent: "center" }}>{g.bought && <Check size={13} color="#fff" strokeWidth={3} />}</button>
                      <div className="flex-1" style={{ minWidth: 130, textDecoration: g.bought ? "line-through" : "none", opacity: g.bought ? 0.55 : 1 }}><InlineEdit value={g.name} onChange={(v) => updateGear(g.id, { name: v })} /></div>
                      <span style={{ fontSize: 12, color: MUT }}>R</span>
                      <input type="number" min="0" value={g.price || ""} placeholder="0" onChange={(e) => updateGear(g.id, { price: Number(e.target.value) || 0 })} className="rounded-lg px-2 py-1" style={{ ...inputStyle, width: 86, fontSize: 12 }} />
                      <button onClick={() => removeGear(g.id)} style={iconBtn} aria-label="Remove"><X size={12} /></button>
                    </div>
                  ))}
                  <div className="flex items-center justify-between mt-2 flex-wrap gap-2">
                    <button onClick={addGear} className="flex items-center gap-1" style={{ ...iconBtn, color: C.lilac, fontSize: 12 }}><Plus size={12} /> Add item</button>
                    <span style={{ fontSize: 12, color: MUT }}>Spent <b style={{ color: C.mint }}>{fmtR(gearSpent)}</b> of {fmtR(gearTotal)}</span>
                  </div>
                </div>
              )}
              {s.kind === "mix" && (
                <div className="flex gap-2 my-2 flex-wrap">{MIX_ROUTES.map((r) => (
                  <button key={r} onClick={() => patch({ mixRoute: song.mixRoute === r ? "" : r })} className="rounded-full px-3 py-1.5" style={{ fontSize: 12, cursor: "pointer", fontFamily: "inherit", background: song.mixRoute === r ? `${C.coral}22` : FILL, border: `1px solid ${song.mixRoute === r ? C.coral : LINE}`, color: song.mixRoute === r ? C.coral : MUT }}>{r}{song.mixRoute === r ? " ✓" : ""}</button>
                ))}</div>
              )}
              <InlineEdit value={s.note} onChange={(v) => updateStage(s.id, { note: v })} placeholder="Notes…" dim />
              {isCurrent && <PriorityControls item={s} onChange={(p) => updateStage(s.id, p)} />}
            </div>
          </div>
        ); })}
      </div>
    </section>
  );
}

/* ================= MUSIC =================
   Two gated chains, each one a straight line: a step only unlocks once the step before it is
   ticked. Same derived-current-step trick as the old song roadmap — "current" is simply the first
   step that isn't done, so nothing can get stuck out of sync. */
/* ================= UNLOCKS (Discovery ecosystem) ================= */
const ECO_STATE = {
  live:     { label: "Live",        tint: C.mint,   dot: C.mint },
  progress: { label: "In progress", tint: C.yellow, dot: C.yellow },
  locked:   { label: "Locked",      tint: FAINT,    dot: FAINT },
  parked:   { label: "Parked",      tint: C.sky,    dot: C.sky },
};
const ECO_CYCLE = { locked: "progress", progress: "live", live: "parked", parked: "locked" };

function UnlocksModule({ data, setData }) {
  const eco = data.unlocks.ecosystem || { pillars: [], keystoneNote: "" };

  const patchBenefit = (pid, bid, p) => setData((d) => ({ ...d, unlocks: { ...d.unlocks, ecosystem: { ...d.unlocks.ecosystem, pillars: d.unlocks.ecosystem.pillars.map((pl) => pl.id === pid ? { ...pl, benefits: pl.benefits.map((b) => b.id === bid ? { ...b, ...p } : b) } : pl) } } }));
  const addBenefit = (pid) => setData((d) => ({ ...d, unlocks: { ...d.unlocks, ecosystem: { ...d.unlocks.ecosystem, pillars: d.unlocks.ecosystem.pillars.map((pl) => pl.id === pid ? { ...pl, benefits: [...pl.benefits, { id: uid(), label: "New benefit", state: "locked", note: "", due: null, priority: "Medium", lastProgress: null, created: todayISO() }] } : pl) } } }));
  const removeBenefit = (pid, bid) => setData((d) => ({ ...d, unlocks: { ...d.unlocks, ecosystem: { ...d.unlocks.ecosystem, pillars: d.unlocks.ecosystem.pillars.map((pl) => pl.id === pid ? { ...pl, benefits: pl.benefits.filter((b) => b.id !== bid) } : pl) } } }));

  /* chains (apartment gating + car ownership) */
  const updateNode = (cid, nid, p) => setData((d) => ({ ...d, unlocks: { ...d.unlocks, chains: d.unlocks.chains.map((c) => c.id === cid ? { ...c, nodes: c.nodes.map((n) => (n.id === nid ? { ...n, ...p } : n)) } : c) } }));
  const cycle = { locked: "active", active: "done", done: "locked" };

  const allB = eco.pillars.flatMap((p) => p.benefits);
  const liveN = allB.filter((b) => b.state === "live").length;

  return (
    <section>
      <SectionHead title="Discovery ecosystem" />

      {/* pillars */}
      <div className="grid gap-4" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))" }}>
        {eco.pillars.map((pl) => {
          const live = pl.benefits.filter((b) => b.state === "live").length;
          return (
            <div key={pl.id} className="rounded-2xl p-4" style={{ ...card, borderRadius: 18, borderTop: `2px solid ${pl.accent}` }}>
              <div className="flex items-center gap-2 mb-1">
                <span style={{ fontSize: 20 }}>{pl.emoji}</span>
                <div className="flex-1"><span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 600, fontSize: 16 }}>{pl.name}</span></div>
                <span style={{ fontSize: 11, color: MUT }}>{live}/{pl.benefits.length} live</span>
              </div>
              <p style={{ fontSize: 12, color: MUT, margin: "0 0 12px", lineHeight: 1.45 }}>{pl.role}</p>
              <div className="flex flex-col gap-2">
                {pl.benefits.map((b) => {
                  const st = ECO_STATE[b.state] || ECO_STATE.locked;
                  return (
                    <div key={b.id} data-nav-id={b.id} className="rounded-xl p-2.5" style={{ ...cardSoft, borderRadius: 12, opacity: b.state === "locked" ? 0.62 : 1, borderLeft: b.keystone ? `2px solid ${C.lilac}` : `1px solid ${LINE}` }}>
                      <div className="flex items-start gap-2">
                        <button onClick={() => patchBenefit(pl.id, b.id, { state: ECO_CYCLE[b.state] })} aria-label={`State ${b.state}`} className={b.state === "progress" ? "pulse-dot" : ""} style={{ width: 12, height: 12, borderRadius: 99, marginTop: 4, flexShrink: 0, cursor: "pointer", background: st.dot, border: "none" }} />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-1">
                            <div className="flex-1 min-w-0"><InlineEdit value={b.label} onChange={(v) => patchBenefit(pl.id, b.id, { label: v })} strong /></div>
                            {b.keystone && <span style={{ fontSize: 13 }} title="Keystone">🗝️</span>}
                            <button onClick={() => removeBenefit(pl.id, b.id)} style={iconBtn} aria-label="Remove"><X size={11} /></button>
                          </div>
                          <div className="flex items-center gap-1.5 flex-wrap" style={{ marginTop: 2 }}>
                            <span style={{ fontSize: 10, letterSpacing: "0.04em", textTransform: "uppercase", color: st.tint, fontWeight: 600 }}>{st.label}</span>
                            {b.ampFrom && <span className="rounded" style={{ fontSize: 10, color: C.lilac, background: "rgba(123,103,224,0.14)", padding: "1px 6px", borderRadius: 6 }}>↑ amplified by {b.ampFrom}</span>}
                          </div>
                          <InlineEdit value={b.note || ""} onChange={(v) => patchBenefit(pl.id, b.id, { note: v })} placeholder="Detail…" dim />
                          {b.state === "progress" && <PriorityControls item={b} onChange={(p) => patchBenefit(pl.id, b.id, p)} />}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
              <button onClick={() => addBenefit(pl.id)} className="flex items-center gap-1 mt-2" style={{ ...iconBtn, color: pl.accent, fontSize: 12 }}><Plus size={12} /> Add benefit</button>
            </div>
          );
        })}
      </div>

      {/* legend */}
      <div className="flex items-center gap-4 flex-wrap mt-4 mb-6" style={{ fontSize: 11, color: MUT }}>
        {Object.values(ECO_STATE).map((s) => (
          <span key={s.label} className="flex items-center gap-1.5"><span style={{ width: 9, height: 9, borderRadius: 99, background: s.dot }} />{s.label}</span>
        ))}
        <span className="flex items-center gap-1.5" style={{ color: C.lilac }}>🗝️ keystone · unlocks multiple branches</span>
      </div>

      {/* gated tracks (linear by nature: apartment + car ownership) */}
      <SectionHead title="Sequential tracks" sub="These are genuinely linear, each step gates the next. Tap the icon to cycle locked, in progress, done." />
      <div className="grid gap-4" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))" }}>
        {data.unlocks.chains.map((ch) => {
          const tint = /apartment/i.test(ch.name) ? C.peach : C.sky;
          const done = ch.nodes.filter((n) => n.status === "done").length;
          return (
            <div key={ch.id} className="rounded-2xl p-4" style={{ ...card, borderRadius: 18 }}>
              <div className="flex items-center gap-3 mb-3">
                <Ring pct={ch.nodes.length ? done / ch.nodes.length : 0} tint={tint} size={50} thick={6} label={`${done}`} />
                <div className="flex-1"><span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 600, fontSize: 15 }}>{ch.name}</span><div style={{ fontSize: 12, color: MUT }}>{done}/{ch.nodes.length} done</div></div>
              </div>
              <div className="flex flex-col">
                {ch.nodes.map((n, i) => (
                  <div key={n.id} className="flex gap-3">
                    <div className="flex flex-col items-center" style={{ width: 30, flexShrink: 0 }}>
                      <button onClick={() => updateNode(ch.id, n.id, { status: cycle[n.status] })} aria-label={`Status ${n.status}`} className={n.status === "active" ? "pulse-dot" : ""} style={{ width: 28, height: 28, borderRadius: 10, cursor: "pointer", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", background: n.status === "done" ? tint : n.status === "active" ? `${tint}22` : C.card, border: `1px solid ${n.status === "done" ? tint : n.status === "active" ? tint : LINE}` }}>
                        {n.status === "done" && <Check size={14} color="#fff" strokeWidth={3} />}
                        {n.status === "active" && <Sparkles size={13} color={tint} />}
                        {n.status === "locked" && <Lock size={12} color={FAINT} />}
                      </button>
                      {i < ch.nodes.length - 1 && <div style={{ width: 2, flex: 1, minHeight: 16, background: n.status === "done" ? `${tint}66` : LINE }} />}
                    </div>
                    <div data-nav-id={n.id} className="flex-1 pb-3" style={{ opacity: n.status === "locked" ? 0.6 : 1, minWidth: 0 }}>
                      <InlineEdit value={n.label} onChange={(v) => updateNode(ch.id, n.id, { label: v })} strong />
                      <InlineEdit value={n.sub} onChange={(v) => updateNode(ch.id, n.id, { sub: v })} placeholder="Detail…" dim />
                      {n.status === "active" && <PriorityControls item={n} onChange={(p) => updateNode(ch.id, n.id, p)} />}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

function makeFurnishingData(legacyRaw = null) {
  let legacy = null;
  try { legacy = typeof legacyRaw === "string" ? JSON.parse(legacyRaw) : legacyRaw; } catch (e) {}
  const legacyItems = (legacy && legacy.it) || {};
  const deleted = (legacy && legacy.del) || {};
  const added = (legacy && legacy.add) || {};
  const rooms = {};
  FURNISH_ROOMS.forEach((room) => {
    const base = room.items.filter(([id]) => !deleted[id]).map(([id, name, price, source, note]) => {
      const old = legacyItems[id] || {};
      return { id, name, price: price || "", source: old.src !== undefined ? old.src : (source || ""), note: note || "", link: old.link || "", status: old.got ? "Decided" : ((old.link || "").trim() ? "Shortlisted" : "Open") };
    });
    const extras = (added[room.key] || []).map((item) => ({ id: item.id || uid(), name: item.name || "New item", price: "", source: "", note: "", link: "", status: "Open" }));
    rooms[room.key] = base.concat(extras);
  });
  return { rooms };
}

function FurnishingModule({ data, setData, q }) {
  const furnishing = data.furnishing || makeFurnishingData();
  const rooms = furnishing.rooms || {};
  const query = (q || "").trim().toLowerCase();
  const [openRooms, setOpenRooms] = useState({});
  const [newItems, setNewItems] = useState({});
  const updateItem = (roomKey, id, patch) => setData((d) => ({ ...d, furnishing: { ...(d.furnishing || makeFurnishingData()), rooms: { ...((d.furnishing || {}).rooms || {}), [roomKey]: (((d.furnishing || {}).rooms || {})[roomKey] || []).map((item) => item.id === id ? { ...item, ...patch } : item) } } }));
  const removeItem = (roomKey, id) => setData((d) => ({ ...d, furnishing: { ...(d.furnishing || makeFurnishingData()), rooms: { ...((d.furnishing || {}).rooms || {}), [roomKey]: (((d.furnishing || {}).rooms || {})[roomKey] || []).filter((item) => item.id !== id) } } }));
  const addItem = (roomKey) => {
    const name = (newItems[roomKey] || "").trim(); if (!name) return;
    setData((d) => ({ ...d, furnishing: { ...(d.furnishing || makeFurnishingData()), rooms: { ...((d.furnishing || {}).rooms || {}), [roomKey]: [...(((d.furnishing || {}).rooms || {})[roomKey] || []), { id: uid(), name, price: "", source: "", note: "", link: "", status: "Open" }] } } }));
    setNewItems((current) => ({ ...current, [roomKey]: "" }));
  };
  const allItems = Object.values(rooms).flat();
  const decided = allItems.filter((item) => item.status === "Decided").length;
  const shortlisted = allItems.filter((item) => item.status === "Shortlisted").length;
  return (
    <section>
      <SectionHead title="Apartment furnishing" sub="Your furniture list lives in the CRM now. Links, sources, and decisions save with your normal CRM data." />
      <div className="rounded-2xl p-5 mb-6 flex items-center gap-5 flex-wrap" style={{ ...card, borderRadius: 18 }}>
        <Ring pct={allItems.length ? decided / allItems.length : 0} tint={C.accent} size={72} thick={8} label={`${decided}`} sub="DECIDED" />
        <div style={{ fontSize: 13, color: MUT }}>{decided} decided · {shortlisted} shortlisted · {Math.max(0, allItems.length - decided - shortlisted)} still open</div>
      </div>
      <div className="flex flex-col gap-4">
        {FURNISH_ROOMS.map((room) => {
          const items = (rooms[room.key] || []).filter((item) => !query || [item.name, item.price, item.source, item.note, item.link].join(" ").toLowerCase().includes(query));
          const open = !!openRooms[room.key] || !!query;
          if (query && !items.length) return null;
          return <div key={room.key} className="rounded-2xl" style={{ ...card, borderRadius: 18, overflow: "hidden", borderLeft: `4px solid ${room.tint}` }}>
            <button onClick={() => setOpenRooms((current) => ({ ...current, [room.key]: !current[room.key] }))} className="w-full text-left px-5 py-4 flex items-center justify-between gap-3" style={{ cursor: "pointer", fontFamily: "inherit", background: "transparent", border: 0, color: C.ink }}>
              <div><div style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontSize: 17, fontWeight: 700 }}>{room.label}</div><div style={{ fontSize: 12, color: MUT, marginTop: 3 }}>{items.filter((item) => item.status === "Decided").length} decided · {items.filter((item) => item.status === "Shortlisted").length} shortlisted · {items.length} items</div></div>
              {open ? <ChevronUp size={18} /> : <ChevronDown size={18} />}
            </button>
            {open && <div className="px-5 pb-5 flex flex-col gap-3">
              {items.map((item) => <div key={item.id} className="rounded-xl p-4 flex flex-col gap-3" style={{ ...cardSoft, borderRadius: 13 }}>
                <div className="flex items-start gap-3 flex-wrap">
                  <div className="flex-1" style={{ minWidth: 220 }}><InlineEdit value={item.name} onChange={(value) => updateItem(room.key, item.id, { name: value })} strong /><InlineEdit value={item.note || ""} onChange={(value) => updateItem(room.key, item.id, { note: value })} placeholder="Note…" dim /></div>
                  <select value={item.status || "Open"} onChange={(e) => updateItem(room.key, item.id, { status: e.target.value })} className="rounded-lg px-2 py-1.5" style={{ ...inputStyle, width: 118, fontSize: 12 }}><option>Open</option><option>Shortlisted</option><option>Decided</option></select>
                  <button onClick={() => removeItem(room.key, item.id)} style={iconBtn} aria-label={`Remove ${item.name}`}><Trash2 size={15} /></button>
                </div>
                <div className="flex gap-2 flex-wrap items-center">
                  {FURNISH_SOURCES.map((source) => <button key={source} onClick={() => updateItem(room.key, item.id, { source: item.source === source ? "" : source })} style={{ ...pillGhost, padding: "5px 9px", fontSize: 11, borderColor: item.source === source ? SRC_TINT[source] : LINE, color: item.source === source ? SRC_TINT[source] : MUT }}>{source}</button>)}
                  <input value={item.price || ""} onChange={(e) => updateItem(room.key, item.id, { price: e.target.value })} placeholder="Price" className="rounded-lg px-2.5 py-1.5" style={{ ...inputStyle, width: 100, fontSize: 12 }} />
                  <input value={item.link || ""} onChange={(e) => updateItem(room.key, item.id, { link: e.target.value, status: item.status === "Open" && e.target.value.trim() ? "Shortlisted" : item.status })} placeholder="Paste product URL" className="rounded-lg px-2.5 py-1.5 flex-1" style={{ ...inputStyle, minWidth: 180, fontSize: 12 }} />
                  {/^https?:\/\//i.test((item.link || "").trim()) && <a href={item.link.trim()} target="_blank" rel="noreferrer" style={{ ...pillGhost, padding: "5px 9px", fontSize: 11 }}>Open ↗</a>}
                </div>
              </div>)}
              <div className="flex gap-2"><input value={newItems[room.key] || ""} onChange={(e) => setNewItems((current) => ({ ...current, [room.key]: e.target.value }))} onKeyDown={(e) => { if (e.key === "Enter") addItem(room.key); }} placeholder={`Add a ${room.label.toLowerCase()} item`} className="rounded-lg px-3 py-2 flex-1" style={{ ...inputStyle, fontSize: 13 }} /><button onClick={() => addItem(room.key)} style={pillDark}>Add</button></div>
            </div>}
          </div>;
        })}
        {query && !FURNISH_ROOMS.some((room) => (rooms[room.key] || []).some((item) => [item.name, item.price, item.source, item.note, item.link].join(" ").toLowerCase().includes(query))) && <Empty text="No furnishing item matches your search." />}
      </div>
    </section>
  );
}

            {nodes.map((n) => (
              <div key={n.id} className="flex items-center gap-2 py-1" style={{ fontSize: 13, opacity: n.status === "locked" ? 0.55 : 1 }}>
                {n.status === "done" ? <Check size={14} color={C.mint} strokeWidth={3} /> : n.status === "active" ? <Sparkles size={13} color={C.yellow} /> : <Lock size={12} color={FAINT} />}
                <span style={{ textDecoration: n.status === "done" ? "line-through" : "none", fontWeight: /move\s*in/i.test(n.label) ? 600 : 400 }}>{n.label}</span>
              </div>
            ))}
          </div>
          <div className="flex gap-2 justify-center flex-wrap">
            <button onClick={() => go("unlocks")} style={pillDark}>Open the Apartment chain</button>
            <button onClick={() => patch({ unlockedOverride: true })} style={pillGhost}>Open early anyway</button>
          </div>
        </div>
      </section>
    );
  }

  let shown = items;
  if (ql) shown = items.filter((i) => i.name.toLowerCase().includes(ql) || (i.source || "").toLowerCase().includes(ql));
  return (
    <section>
      <SectionHead title="8 Kingsbury · furnishing" sub="From your Apartment Budget note. Tap a status pill to cycle it, log the real price when you buy." action={<AddBtn onClick={add} label="Add item" />} />
      {data.apartment.unlockedOverride && (
        <div className="rounded-xl px-3 py-2 mb-4 flex items-center justify-between flex-wrap gap-2" style={{ background: `${C.amber}14`, border: `1px solid ${C.amber}44`, borderRadius: 12, fontSize: 12.5 }}>
          <span>Opened early. Normally gated until move-in.</span><button onClick={() => patch({ unlockedOverride: false })} style={{ ...iconBtn, fontSize: 12, color: C.amber }}>Re-lock</button>
        </div>
      )}
      <div className="rounded-2xl p-7 mb-7 flex items-center gap-7 flex-wrap" style={{ ...card, borderRadius: 20 }}>
        <Ring pct={budgetTotal ? spent / budgetTotal : 0} tint={over ? C.rose : C.mint} size={100} thick={12} label={`${Math.round((budgetTotal ? spent / budgetTotal : 0) * 100)}%`} />
        <div className="flex-1" style={{ minWidth: 240 }}>
          <div style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontSize: 32, fontWeight: 700, color: over ? C.rose : C.ink }}>{fmtR(spent)} <span style={{ fontSize: 15, color: MUT, fontWeight: 400 }}>of {fmtR(budgetTotal)} plan</span></div>
          <div style={{ fontSize: 14.5, color: C.mint, marginBottom: 8 }}>{boughtCount}/{items.length} items bought</div>
          <Bar pct={budgetTotal ? spent / budgetTotal : 0} tint={over ? C.rose : C.mint} />
          <div style={{ fontSize: 12.5, color: FAINT, marginTop: 10 }}>Tiers: budget ~R26k · medium R38-45k · high R55-65k</div>
        </div>
      </div>
      <div className="flex flex-col gap-3">
        {shown.map((i) => (
          <div key={i.id} className="rounded-2xl px-5 py-4 flex items-center gap-4 flex-wrap" style={{ ...card, borderRadius: 16, borderLeft: `3px solid ${ST[i.status]}` }}>
            <button onClick={() => update(i.id, { status: cycleStatus(i.status) })} className="rounded-full px-3.5 py-1.5" style={{ fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", width: 108, flexShrink: 0, background: `${ST[i.status]}1a`, border: `1px solid ${ST[i.status]}55`, color: ST[i.status] }}>{i.status}</button>
            <div className="flex-1" style={{ minWidth: 220 }}><InlineEdit value={i.name} onChange={(v) => update(i.id, { name: v })} strong /><InlineEdit value={i.source} onChange={(v) => update(i.id, { source: v })} placeholder="Source…" dim /></div>
            <div style={{ fontSize: 12.5, color: MUT }}>budget<input type="number" min="0" value={i.budget || ""} placeholder="0" onChange={(e) => update(i.id, { budget: Number(e.target.value) || 0 })} className="rounded-lg px-2.5 py-1.5 ml-1.5" style={{ ...inputStyle, width: 96, fontSize: 13.5 }} /></div>
            <div style={{ fontSize: 12.5, color: i.status === "Bought" ? C.mint : MUT }}>paid<input type="number" min="0" value={i.paid || ""} placeholder="0" onChange={(e) => update(i.id, { paid: Number(e.target.value) || 0 })} className="rounded-lg px-2.5 py-1.5 ml-1.5" style={{ ...inputStyle, width: 96, fontSize: 13.5 }} /></div>
            <button onClick={() => remove(i.id)} style={iconBtn} aria-label="Delete"><Trash2 size={15} /></button>
          </div>
        ))}
        {shown.length === 0 && <Empty text={ql ? "No item matches your search." : "No items. Add what the apartment needs."} />}
      </div>
    </section>
  );
}

/* ================= LIFE ADMIN ================= */
/* Personal catch-all pillar: a flat kanban of your own life stuff (paperwork, errands, calls to
   make), sharing the exact same due-date/priority engine as every other pillar (PriorityControls,
   computeUrgency) so it feeds the main Priorities dashboard with zero special-casing. */
function LifeAdminModule({ data, setData, q, boardKey = "lifeAdmin", boardTitle = "General tasks", subtitle = "Your own stuff: paperwork, errands, calls to make. Same due date and priority logic as everywhere else." }) {
  const [title, setTitle] = useState(""); const [description, setDescription] = useState(""); const [due, setDue] = useState("");
  const [openDesc, setOpenDesc] = useState({});
  const items = (data[boardKey] && data[boardKey].items) || [];
  const ql = (q || "").toLowerCase();
  const add = () => {
    const t = title.trim(); if (!t) return;
    const taskDue = due || defaultTaskDue();
    setData((d) => ({ ...d, [boardKey]: { ...(d[boardKey] || { items: [] }), items: [{ id: uid(), title: t, description: description.trim(), status: "To do", created: todayISO(), due: taskDue, priority: priorityForNewTask(taskDue), lastProgress: null }, ...((d[boardKey] || {}).items || [])] } }));
    setTitle(""); setDescription(""); setDue("");
  };
  const toggleDone = (id) => setData((d) => ({ ...d, [boardKey]: { ...d[boardKey], items: d[boardKey].items.map((t) => { if (t.id !== id) return t; const done = t.status === "Done"; return { ...t, status: done ? "To do" : "Done", doneAt: done ? null : Date.now() }; }) } }));
  const update = (id, p) => setData((d) => ({ ...d, [boardKey]: { ...d[boardKey], items: d[boardKey].items.map((t) => (t.id === id ? { ...t, ...p } : t)) } }));
  const remove = (id) => setData((d) => ({ ...d, [boardKey]: { ...d[boardKey], items: d[boardKey].items.filter((t) => t.id !== id) } }));
  const clearDone = () => setData((d) => ({ ...d, [boardKey]: { ...d[boardKey], items: d[boardKey].items.filter((t) => t.status !== "Done") } }));
  const matched = ql ? items.filter((t) => t.title.toLowerCase().includes(ql) || (t.description || "").toLowerCase().includes(ql)) : items;
  const visible = matched.filter((t) => t.status !== "Done");
const __groupDefs = [{ key: "High", label: "High priority" }, { key: "Medium", label: "Medium priority" }, { key: "Low", label: "Low priority" }];
const __waitingItems = visible.filter((t) => !!t.chaseOn);
const __priorityGroups = __groupDefs.map((g) => ({ ...g, items: visible.filter((t) => !t.chaseOn && (t.priority || "Medium") === g.key) }));
const __groupHead = (label, count) => (<div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: MUT, marginBottom: 10 }}>{label} <span style={{ opacity: 0.6 }}>{count}</span></div>);
const renderCard = (t) => {
const descOpen = openDesc[t.id] !== undefined ? openDesc[t.id] : true;
const toggleDesc = () => { if (hasTextSelection()) return; setOpenDesc((o) => ({ ...o, [t.id]: !descOpen })); };
const isDone = t.status === "Done";
return (
<div key={t.id} data-nav-id={t.id} onClick={toggleDesc} className="rounded-2xl p-3" style={{ cursor: "pointer", ...card, borderRadius: 14, borderLeft: `2px solid ${C.rose}`, opacity: isDone ? 0.55 : 1, height: "fit-content" }}>
<div className="flex items-start gap-2">
<button onClick={(e) => { e.stopPropagation(); toggleDone(t.id); }} aria-label="Toggle done" style={{ marginTop: 2, width: 18, height: 18, borderRadius: 6, cursor: "pointer", flexShrink: 0, background: isDone ? C.mint : C.card, border: `1px solid ${isDone ? C.mint : LINE}`, display: "flex", alignItems: "center", justifyContent: "center" }}>{isDone && <Check size={11} color="#fff" strokeWidth={3} />}</button>
<div className="flex-1 min-w-0" style={{ fontSize: 13.5, textDecoration: isDone ? "line-through" : "none" }}><InlineEdit value={t.title} onChange={(v) => update(t.id, { title: v })} bubbleClicks /></div>
<button onClick={(e) => { e.stopPropagation(); remove(t.id); }} style={{ ...iconBtn, padding: 2 }} aria-label="Delete"><X size={12} /></button>
</div>
<div style={{ marginTop: 4, marginLeft: 26 }}><AutoTextarea value={t.description || ""} onChange={(v) => update(t.id, { description: v })} placeholder="Add a description…" open={descOpen} onToggle={toggleDesc} /></div>
{!isDone && <div style={{ marginLeft: 26 }}><PriorityControls item={t} onChange={(p) => update(t.id, p)} /></div>}
</div>
);
};

  return (
    <section>
      <SectionHead title={boardTitle} sub={subtitle} />
      <div className="rounded-2xl p-4 mb-6" style={{ ...card, borderRadius: 16 }}>
        <div className="flex gap-2 flex-wrap mb-2">
          <input value={title} onChange={(e) => setTitle(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="What needs doing?" className="flex-1 rounded-lg px-3 py-2" style={{ ...inputStyle, minWidth: 200 }} />
          <input type="date" value={due} onChange={(e) => setDue(e.target.value)} className="rounded-lg px-3 py-2" style={{ ...inputStyle, width: 150 }} aria-label="Due date (optional)" title="Due date (optional) — auto-sets the priority" />
        </div>
        <div className="flex gap-2 flex-wrap items-start">
          <GrowingTextarea value={description} onChange={setDescription} placeholder="Description (optional) — the actual detail. Keeps the title short." rows={2} className="flex-1 rounded-lg px-3 py-2" style={{ ...inputStyle, minWidth: 200, lineHeight: 1.45 }} />
          <button onClick={add} style={pillDark}><Plus size={14} style={{ display: "inline", marginRight: 4 }} />Add</button>
        </div>
      </div>
      <div style={{ borderTop: `1px solid ${LINE}`, margin: "-2px 0 20px" }} />
      {/* flat card grid — no columns. Cards fill 3-wide on desktop and wrap onto new rows
          indefinitely as they're added; a per-card checkbox marks done (done cards sink to the
          bottom, dimmed) and "Clear done" sweeps them out. */}
      {visible.length > 0 ? (
<>
{__priorityGroups.map((g) => g.items.length === 0 ? null : (
<div key={g.key} style={{ marginBottom: 20 }}>
{__groupHead(g.label, g.items.length)}
<div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))" }}>
{g.items.map(renderCard)}
</div>
</div>
))}
{__waitingItems.length > 0 && (
<div style={{ marginBottom: 20 }}>
{__groupHead("Waiting on reply", __waitingItems.length)}
<div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))" }}>
{__waitingItems.map(renderCard)}
</div>
</div>
)}
</>
) : (
<Empty text={ql ? "No item matches your search." : "Nothing here yet. Add your first bit of life admin above."} />
)}
{items.some((t) => t.status === "Done") && <button onClick={clearDone} className="mt-4" style={{ ...iconBtn, fontSize: 12 }}>Clear done</button>}
    </section>
  );
}

/* ================= DEALS ================= */
const CLIENT_TINT = { Lead: C.sky, Active: C.mint, Paused: MUT };
const DEAL_TYPE_TINT = { Active: C.mint, Prospect: C.sky };

/* shared mini task tracker: used under each brand deal and each client so granular
   action items ("reply to email", "send rate card"...) get their own due date + priority
   and feed straight into the Priorities dashboard via collectPriorityTasks. */
  /* `withLink` is opt-in for creator tasks and adds a URL field to the composer and to each row, same "turns into a
   button once you type something in" pattern Admin Tasks already has for its link field.
   `composerAtBottom` is opt-in too (Deals/Clients only, per Ally's call) — puts the "add a task"
   capture row after the existing tasks instead of before them, so scanning the card reads task
   list first, capture-a-new-one last. */
function MiniTaskList({ tasks, onChange, withLink, composerAtBottom }) {
  const [title, setTitle] = useState(""); const [description, setDescription] = useState(""); const [due, setDue] = useState(""); const [link, setLink] = useState("");
  const list = tasks || [];
  const visibleList = list.filter((t) => !t.done);
  const add = () => {
    const t = title.trim(); if (!t) return;
    const taskDue = due || defaultTaskDue();
    onChange([{ id: uid(), title: t, description: description.trim(), link: link.trim(), due: taskDue, priority: priorityForNewTask(taskDue), lastProgress: null, done: false, created: todayISO() }, ...list]);
    setTitle(""); setDescription(""); setDue(""); setLink("");
  };
  const update = (id, p) => onChange(list.map((t) => (t.id === id ? { ...t, ...p } : t)));
  const remove = (id) => onChange(list.filter((t) => t.id !== id));
  const composer = (
    <>
      <div className="flex gap-1.5 flex-wrap">
        <input value={title} onChange={(e) => setTitle(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="Add a task (e.g. Reply to email)…" className="flex-1 rounded-lg px-2 py-1.5" style={{ ...inputStyle, fontSize: 12, minWidth: 140 }} />
        {withLink && <input value={link} onChange={(e) => setLink(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="URL (optional)" className="rounded-lg px-2 py-1.5" style={{ ...inputStyle, fontSize: 11, width: 130 }} />}
        <input type="date" value={due} onChange={(e) => setDue(e.target.value)} className="rounded-lg px-2 py-1.5" style={{ ...inputStyle, fontSize: 11, width: 120 }} aria-label="Due date (optional)" title="Due date (optional) — auto-sets the priority" />
      </div>
      <div className="flex gap-1.5 items-start">
        <GrowingTextarea value={description} onChange={setDescription} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); add(); } }} placeholder="Description (optional)…" rows={1} className="flex-1 rounded-lg px-2 py-1.5" style={{ ...inputStyle, fontSize: 11.5, lineHeight: 1.4 }} />
        <button onClick={add} style={{ ...pillDark, fontSize: 11, padding: "5px 10px" }}><Plus size={11} style={{ display: "inline", marginRight: 3 }} />Add</button>
      </div>
    </>
  );
  return (
    <div onClick={(e) => e.stopPropagation()} className="flex flex-col gap-1.5">
      {!composerAtBottom && composer}
      {!composerAtBottom && <div style={{ borderTop: `1px solid ${LINE}`, margin: "2px 0" }} />}
      {visibleList.length === 0 && <div style={{ fontSize: 11.5, color: FAINT }}>No tasks yet.</div>}
      {visibleList.map((t) => <MiniTaskRow key={t.id} t={t} onUpdate={(p) => update(t.id, p)} onRemove={() => remove(t.id)} withLink={withLink} />)}
      {composerAtBottom && <div style={{ borderTop: `1px solid ${LINE}`, margin: "2px 0" }} />}
      {composerAtBottom && composer}
    </div>
  );
}
/* split out from MiniTaskList purely so each sub-task's description can have its own lifted open
   state — same "click anywhere on the card to expand/collapse its description" convention as every
   other card, now including these (previously the one place in the CRM where a description never
   collapsed at all). */
function MiniTaskRow({ t, onUpdate, onRemove, withLink }) {
  const [descOpen, setDescOpen] = useState(true);
  return (
    <div data-nav-id={t.id} onClick={() => { if (hasTextSelection()) return; setDescOpen((v) => !v); }} className="rounded-lg px-2.5 py-2" style={{ cursor: "pointer", background: C.soft, border: `1px solid ${LINE}`, opacity: t.done ? 0.5 : 1 }}>
      <div className="flex items-center gap-2">
        <button onClick={(e) => { e.stopPropagation(); onUpdate({ done: !t.done, doneAt: !t.done ? Date.now() : null }); }} aria-label="Toggle done" style={{ width: 18, height: 18, borderRadius: 6, cursor: "pointer", flexShrink: 0, background: t.done ? C.mint : C.card, border: `1px solid ${t.done ? C.mint : LINE}`, display: "flex", alignItems: "center", justifyContent: "center" }}>{t.done && <Check size={11} color="#fff" strokeWidth={3} />}</button>
        <div className="flex-1 min-w-0" style={{ textDecoration: t.done ? "line-through" : "none" }}><InlineEdit value={t.title} onChange={(v) => onUpdate({ title: v })} bubbleClicks /></div>
        <button onClick={(e) => { e.stopPropagation(); onRemove(); }} style={{ ...iconBtn, padding: 2 }} aria-label="Delete"><X size={11} /></button>
      </div>
      <div style={{ fontSize: 11, color: MUT, marginTop: 2, marginLeft: 26 }}><InlineEditArea value={t.description || ""} onChange={(v) => onUpdate({ description: v })} placeholder="Add a description…" open={descOpen} onToggle={() => setDescOpen((v) => !v)} /></div>
      {withLink && (
        <div onClick={(e) => e.stopPropagation()} className="flex items-center gap-1.5 mt-1" style={{ marginLeft: 26 }}>
          <input value={t.link || ""} onChange={(e) => onUpdate({ link: e.target.value })} placeholder="Add a URL…" className="rounded-md px-2 py-1 flex-1" style={{ ...inputStyle, fontSize: 10.5 }} />
          {t.link && <a href={t.link.startsWith("http") ? t.link : `https://${t.link}`} target="_blank" rel="noreferrer" className="rounded-full px-2 py-1 flex items-center gap-1 flex-shrink-0" style={{ background: FILL, border: `1px solid ${LINE}`, fontSize: 10.5, color: C.sky, textDecoration: "none" }}><ExternalLink size={10} />Open</a>}
        </div>
      )}
      {!t.done && <PriorityControls item={t} onChange={onUpdate} />}
    </div>
  );
}
/* read-only glance list used when a Deal/Client card is collapsed — title + description only, no
   controls, so the card still tells you what's outstanding without needing to expand it. */
function TaskPreviewList({ tasks }) {
  const list = (tasks || []).filter((t) => !t.done);
  if (list.length === 0) return <div style={{ fontSize: 12, color: FAINT }}>No tasks yet.</div>;
  return (
    <div className="flex flex-col gap-1.5">
      {list.map((t) => (
        <div key={t.id} style={{ fontSize: 12.5 }}>
          <div style={{ color: t.done ? MUT : C.ink, textDecoration: t.done ? "line-through" : "none", opacity: t.done ? 0.6 : 1 }}>{t.title}</div>
          {t.description && <div style={{ fontSize: 11, color: MUT, marginTop: 1 }}>{t.description}</div>}
        </div>
      ))}
    </div>
  );
}

function DealCard({ x, open, onToggleOpen, update, remove, isProspect }) {
  /* card accent follows Active/Prospect status (green/blue). Two layouts, driven by the
     content-piece toggle:
       • Reel  → the 5-stage production line, each stage carrying its OWN deadline. The current
                 stage (x.stage) is highlighted; its deadline is the card's headline deadline and
                 the one that feeds the Priorities hub ("Write script (Brand)"...). Marking a later
                 stage current ticks off the earlier ones. Reel gets Script + Caption boxes.
       • Story → no stages: a single deadline (x.storyDue → "Post story (Brand)" in the hub) and a
                 Caption box. */
  const tint = isProspect ? C.sky : C.mint;
  const typeTint = DEAL_TYPE_TINT[isProspect ? "Prospect" : "Active"];
  const piece = x.piece || "Reel";
  const stageKey = x.stage || "script";
  const done = stageKey === "done";
  const stageIdx = REEL_STAGE_KEYS.indexOf(stageKey);
  const stageDue = x.stageDue || {};
  const setStage = (key) => update(x.id, { stage: key });
  const setStageDue = (key, val) => update(x.id, { stageDue: { ...(x.stageDue || {}), [key]: val } });
  return (
    <div data-nav-id={x.id} onClick={() => { if (hasTextSelection()) return; onToggleOpen(); }} className="rounded-2xl p-4" style={{ cursor: "pointer", ...card, borderRadius: 16, borderLeft: `3px solid ${tint}`, opacity: done ? 0.65 : 1 }}>
      {/* header: brand name (card title) + active/prospect + expand */}
      <div className="flex items-center gap-3 flex-wrap">
        <div className="flex-1" style={{ minWidth: 150 }}><InlineEdit value={x.brand} onChange={(v) => update(x.id, { brand: v })} strong bubbleClicks /></div>
        <button onClick={(e) => { e.stopPropagation(); update(x.id, { type: isProspect ? "Active" : "Prospect" }); }} className="rounded-full px-2.5 py-1" style={{ fontSize: 10.5, cursor: "pointer", fontFamily: "inherit", background: `${typeTint}1a`, border: `1px solid ${typeTint}55`, color: typeTint, whiteSpace: "nowrap" }}>{isProspect ? "→ mark active" : "→ mark prospect"}</button>
        <button onClick={(e) => { e.stopPropagation(); onToggleOpen(); }} style={iconBtn} aria-label="Expand">{open ? <ChevronUp size={16} /> : <ChevronDown size={16} />}</button>
      </div>

      {/* content-piece toggle */}
      <div onClick={(e) => e.stopPropagation()} className="flex gap-1 mt-3" style={{ maxWidth: 220 }}>
        {["Reel", "Story"].map((p) => (
          <button key={p} onClick={() => update(x.id, { piece: p })} className="rounded-full px-3 py-1 flex-1" style={{ fontSize: 11, cursor: "pointer", fontFamily: "inherit", background: piece === p ? `${tint}2b` : FILL, border: `1px solid ${piece === p ? tint : LINE}`, color: piece === p ? tint : MUT }}>{p === "Reel" ? "🎬 Reel" : "📖 Story"}</button>
        ))}
      </div>

      {/* active Reel: per-stage line with its own deadline on each stage */}
      {!isProspect && piece === "Reel" && (
        <div onClick={(e) => e.stopPropagation()} className="mt-3 flex flex-col gap-1.5">
          {REEL_STAGES.map((s, i) => {
            const isCurrent = !done && s.key === stageKey;
            const complete = done || i < stageIdx;
            return (
              <div key={s.key} className="flex items-center gap-2 flex-wrap">
                <button onClick={() => setStage(s.key)} className="rounded-full px-2.5 py-1" style={{ fontSize: 10.5, cursor: "pointer", fontFamily: "inherit", flex: "0 0 auto", minWidth: 158, textAlign: "left", background: complete ? `${tint}14` : isCurrent ? `${tint}2b` : FILL, border: `1px solid ${isCurrent ? tint : complete ? `${tint}55` : LINE}`, color: isCurrent || complete ? tint : MUT }}>{complete ? "✓ " : ""}{s.label}</button>
                <input type="date" value={stageDue[s.key] || ""} onChange={(e) => setStageDue(s.key, e.target.value)} className="rounded-lg px-2 py-1" style={{ ...inputStyle, fontSize: 11 }} aria-label={`${s.label} deadline`} title={`${s.label} deadline`} />
                {isCurrent && stageDue[s.key] && <DueChip due={stageDue[s.key]} />}
              </div>
            );
          })}
          {done && <div style={{ fontSize: 11, color: MUT }}>All stages complete ✓ <button onClick={() => setStage("script")} style={{ ...iconBtn, fontSize: 11 }}>reopen</button></div>}
        </div>
      )}

      {/* active Story: single deadline */}
      {!isProspect && piece === "Story" && (
        <div onClick={(e) => e.stopPropagation()} className="mt-3 flex items-center gap-2 flex-wrap">
          <Label text="Deadline" />
          <input type="date" value={x.storyDue || ""} onChange={(e) => update(x.id, { storyDue: e.target.value })} className="rounded-lg px-2 py-1" style={{ ...inputStyle, fontSize: 12 }} aria-label="Story deadline" />
          {x.storyDue && <DueChip due={x.storyDue} />}{done ? <span style={{ fontSize: 11, color: MUT }}>Posted ✓ <button onClick={() => setStage("script")} style={{ ...iconBtn, fontSize: 11 }}>reopen</button></span> : <button onClick={() => setStage("done")} className="rounded-full px-2.5 py-1" style={{ fontSize: 10.5, cursor: "pointer", fontFamily: "inherit", background: `${tint}1a`, border: `1px solid ${tint}55`, color: tint }}>✓ Mark posted</button>}
        </div>
      )}

        {!done && <PriorityControls item={x} onChange={(p) => update(x.id, p)} hideDue />}

  <div className="mt-3" onClick={(e) => e.stopPropagation()}>
  <Label text="Tasks" />
  {open ? <MiniTaskList tasks={x.tasks} onChange={(tasks) => update(x.id, { tasks })} composerAtBottom /> : <TaskPreviewList tasks={x.tasks} />}
  </div>

  {/* expanded: Script (Reel only) + Caption + Notes */}
  {open && (
  <div className="mt-4 flex flex-col gap-3" onClick={(e) => e.stopPropagation()}>
  {piece === "Reel" && <div><Label text="Script" /><AutoTextarea value={x.script} onChange={(v) => update(x.id, { script: v })} placeholder="Write the script…" /></div>}
  <div><Label text="Caption" /><AutoTextarea value={x.caption} onChange={(v) => update(x.id, { caption: v })} placeholder="Caption, hashtags, promo code…" /></div>
  <div><Label text="Notes" /><AutoTextarea value={x.notes || ""} onChange={(v) => update(x.id, { notes: v })} placeholder="Notes…" /></div>

  </div>
  )}
</div>
  );
}

function DealsModule({ data, setData, q, navRequest }) {
  const [openId, setOpenId] = useState(null);
  const [sub, setSub] = useState("brandDeals");
  const deals = data.deals.deals, clients = data.deals.clients;
  /* a dashboard task pointing at a deal (navOpenId) always lands on the single Brand Deals tab
  now, then opens its card same as before. */
  useEffect(() => {
    if (navRequest && navRequest.navTab === "deals" && navRequest.navOpenId) {
      setOpenId(navRequest.navOpenId);
      setSub("brandDeals");
    }
  }, [navRequest]);
  const ql = (q || "").toLowerCase();
  const patch = (p) => setData((d) => ({ ...d, deals: { ...d.deals, ...p } }));
  const update = (id, p) => patch({ deals: deals.map((x) => (x.id === id ? { ...x, ...p } : x)) });
  const remove = (id) => patch({ deals: deals.filter((x) => x.id !== id) });
  const add = () => { const x = { id: uid(), brand: "New brand", piece: "Reel", stage: "script", stageDue: {}, storyDue: "", script: "", caption: "", tasks: [], notes: "", priority: "Medium", lastProgress: null, created: todayISO(), type: "Prospect" }; patch({ deals: [x, ...deals] }); setOpenId(x.id); setSub("brandDeals"); };
  const updateClient = (id, p) => patch({ clients: clients.map((c) => (c.id === id ? { ...c, ...p } : c)) });
  const addClient = () => { patch({ clients: [{ id: uid(), name: "New client", service: "", status: "Lead", notes: "", tasks: [] }, ...clients] }); setSub("socialClients"); };
  const removeClient = (id) => patch({ clients: clients.filter((c) => c.id !== id) });

  const matchDeal = (x) => !ql || x.brand.toLowerCase().includes(ql);
  const matchClient = (c) => !ql || c.name.toLowerCase().includes(ql);

  const allDeals = deals.filter(matchDeal)
    .sort((a, b) => { const ap = (a.stage || "script") === "done", bp = (b.stage || "script") === "done"; if (ap !== bp) return ap ? 1 : -1; const ad = dealHeadlineDue(a), bd = dealHeadlineDue(b); if (ad && bd) return ad.localeCompare(bd); return ad ? -1 : bd ? 1 : 0; });
  const allClients = clients.filter(matchClient);
  const activeReels = deals.filter((d) => (d.type || "Active") === "Active" && (d.piece || "Reel") === "Reel");

  /* distribution of active Reels across the production line (Stories have no stages) */
  const stageBars = REEL_STAGES.map((s, i) => ({ label: s.label.split(" ")[0], value: activeReels.filter((d) => (d.stage || "script") === s.key).length, color: AURAS[i % AURAS.length] }));

  const subs = [
    { id: "brandDeals", emoji: "🤝", label: "Brand Deals", count: allDeals.length },
    { id: "socialClients", emoji: "🧑‍💼", label: "Social Media Clients", count: allClients.length },
  ];

  return (
    <section>
      <SectionHead title="Brand deals & clients" sub="Brand deals and social media clients, each in their own tab. Every deal, client, and task here still feeds the Priorities dashboard." />
      <nav className="flex gap-2 mb-6 flex-wrap">
        {subs.map(({ id, emoji, label, count }) => {
          const on = sub === id;
          return (
            <button key={id} onClick={() => setSub(id)} className="flex items-center gap-2 rounded-full px-4 py-2" style={{ background: on ? C.dark : C.card, border: `1px solid ${on ? C.dark : LINE}`, color: on ? C.canvas : C.ink, cursor: "pointer", fontSize: 14, fontWeight: on ? 600 : 400, fontFamily: "inherit" }}>
              <span>{emoji}</span><span>{label}</span><span style={{ fontSize: 11, background: on ? "rgba(11,11,13,0.15)" : FILL2, color: on ? C.canvas : MUT, borderRadius: 99, padding: "1px 7px" }}>{count}</span>
            </button>
          );
        })}
      </nav>

      {sub === "brandDeals" && (
        <>
          <div className="flex justify-end mb-3"><AddBtn onClick={add} label="Add deal" /></div>
          {activeReels.length > 0 && (
            <div className="rounded-2xl p-4 mb-5" style={{ ...card, borderRadius: 18 }}>
              <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: MUT, marginBottom: 6 }}>Where active deals sit 📊</div>
              <Bars data={stageBars} height={120} />
            </div>
          )}
          <div className="flex flex-col gap-3">
            {allDeals.map((x) => (
              <DealCard key={x.id} x={x} open={openId === x.id} onToggleOpen={() => setOpenId(openId === x.id ? null : x.id)} update={update} remove={remove} isProspect={(x.type || "Active") === "Prospect"} />
            ))}
            {allDeals.length === 0 && <Empty text={ql ? "No deal matches your search." : "No deals yet. Add one the moment a brand reaches out."} />}
          </div>
        </>
      )}

      {sub === "socialClients" && (
        <>
          <div className="flex justify-end mb-3"><AddBtn onClick={addClient} label="Add client" /></div>
          <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))" }}>
            {allClients.map((c) => <ClientCard key={c.id} c={c} updateClient={updateClient} removeClient={removeClient} />)}
          </div>
          {allClients.length === 0 && <Empty text={ql ? "No client matches your search." : "No clients yet. Add one to get started."} />}
        </>
      )}
    </section>
  );
}

/* ================= AI TASK PROJECTS ================= */
function AITaskProjects({ data, setData, q }) {
  const [name, setName] = useState("");
  const [closed, setClosed] = useState({});
  const projects = ((data.aiTasks || {}).projects || []);
  const ql = (q || "").toLowerCase();
  const shown = ql ? projects.filter((p) => p.name.toLowerCase().includes(ql) || (p.tasks || []).some((t) => `${t.title || ""} ${t.description || ""}`.toLowerCase().includes(ql))) : projects;
  const patchProjects = (projects) => setData((d) => ({ ...d, aiTasks: { ...(d.aiTasks || {}), projects } }));
  const add = () => {
    const projectName = name.trim(); if (!projectName) return;
    patchProjects([{ id: uid(), name: projectName, tasks: [], created: todayISO() }, ...projects]);
    setName("");
  };
  const update = (id, patch) => patchProjects(projects.map((p) => p.id === id ? { ...p, ...patch } : p));
  const remove = (id) => patchProjects(projects.filter((p) => p.id !== id));
  const toggleProject = (id, isOpen) => setClosed({ ...closed, [id]: isOpen });
  return (
    <section>
      <SectionHead title="AI Tasks" sub="Create a project first, then keep all of its AI tasks together underneath." />
      <div className="rounded-2xl p-4 mb-6" style={{ ...card, borderRadius: 16 }}>
        <div className="flex gap-2">
          <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="New AI project…" className="flex-1 rounded-lg px-3 py-2" style={inputStyle} />
          <button onClick={add} style={pillDark}><Plus size={14} style={{ display: "inline", marginRight: 4 }} />Add project</button>
        </div>
      </div>
      <div className="flex flex-col gap-3">
        {shown.map((project) => {
          const open = !closed[project.id];
          const tasks = project.tasks || [];
          const remaining = tasks.filter((t) => !t.done).length;
          return <div key={project.id} className="rounded-2xl p-4" style={{ ...card, borderRadius: 16, borderLeft: `3px solid ${C.sky}` }}>
            <div className="flex items-center gap-2">
              <button onClick={() => toggleProject(project.id, open)} style={{ ...iconBtn, padding: 2 }} aria-label={open ? "Collapse project" : "Expand project"}>{open ? <ChevronDown size={16} /> : <ChevronRight size={16} />}</button>
              <div className="flex-1 min-w-0"><InlineEdit value={project.name} onChange={(v) => update(project.id, { name: v })} strong /></div>
              <span style={{ fontSize: 11, color: MUT }}>{remaining} open</span>
              <button onClick={() => remove(project.id)} style={{ ...iconBtn, padding: 2 }} aria-label="Delete project"><X size={13} /></button>
            </div>
            {open && <div className="mt-3" style={{ marginLeft: 26 }}><MiniTaskList tasks={tasks} onChange={(tasks) => update(project.id, { tasks })} composerAtBottom /></div>}
          </div>;
        })}
        {shown.length === 0 && <Empty text={ql ? "No AI project matches your search." : "No AI projects yet. Add one above."} />}
      </div>
    </section>
  );
}

              <span>{emoji}</span><span>{label}</span>{count !== undefined && <span style={{ fontSize: 11, background: on ? "rgba(11,11,13,0.15)" : FILL2, color: on ? C.canvas : MUT, borderRadius: 99, padding: "1px 7px" }}>{count}</span>}

/* Mama's own mini priority dashboard: same ring + Urgent/Medium/Low column pattern as the main
     Hub (PriorityPillarCard), scoped to two buckets instead of the whole app. Creator Tasks pulls
          from every creator's own MiniTaskList, Admin Tasks from the generic capture stream — both
               already carry due/priority via the shared PriorityControls, so computeUrgency +
                    computePillarFillPercent score them exactly like every other pillar. */
function MamaTaskDashboard({ data, setData, setSub, navigateToTask, completeTask }) {
  const creatorTasks = data.creators.flatMap((cr) => (cr.tasks || []).filter((t) => !t.done && !t.paused).map((t) => ({ ...t, ...computeUrgency(t), title: `${t.title} (${cr.name})`, sourceType: "mamaCreator", navTab: "mama", navSub: "creators", navOpenId: cr.id })));
  const adminTasksList = (data.tasks || []).filter((t) => !t.done && t.status !== "Done" && !t.paused).map((t) => ({ ...t, ...computeUrgency(t), sourceType: "mamaAdmin", navTab: "mama", navSub: "adminTasks" }));

  const BUCKETS = [
    { key: "creatorTasks", label: "Creator Tasks", emoji: "🧑‍🎤", accent: C.pink, tasks: creatorTasks, sub: "creators" },
    { key: "adminTasksBucket", label: "Admin Tasks", emoji: "✅", accent: C.sky, tasks: adminTasksList, sub: "adminTasks" },
  ];
  const fillPct = Object.fromEntries(BUCKETS.map((b) => [b.key, computePillarFillPercent(b.tasks)]));
  const ranked = [...BUCKETS].sort((a, b) => fillPct[b.key] - fillPct[a.key]);
  const rankOf = Object.fromEntries(ranked.map((b, i) => [b.key, i + 1]));
  const total = creatorTasks.length + adminTasksList.length;

  const updateByBucket = {
    creatorTasks: (id, patch) => setData((d) => ({ ...d, creators: d.creators.map((cr) => ({ ...cr, tasks: (cr.tasks || []).map((t) => (t.id === id ? { ...t, ...patch } : t)), updatedAt: Date.now() })) })),
    adminTasksBucket: (id, patch) => setData((d) => ({ ...d, tasks: d.tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)) })),
  };

  return (
    <section>
      <div style={{ marginBottom: 20 }}>
        <h1 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: "clamp(24px,4vw,32px)", margin: 0, letterSpacing: "-0.02em" }}>Mama task dashboard 🎯</h1>
      </div>
      <div className="grid gap-4" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))" }}>
        {ranked.map((b) => (
          <MamaTaskRing key={b.key} label={b.label} emoji={b.emoji} accent={b.accent} tasks={b.tasks} rank={rankOf[b.key]} pct={fillPct[b.key]}
            onNavigate={() => setSub(b.sub)} onDropPriority={(id, patch) => updateByBucket[b.key](id, patch)}
            onNavigateTask={navigateToTask} onCompleteTask={completeTask} />
        ))}
      </div>
    </section>
  );
}

function MamaTaskRing({ label, emoji, accent, tasks, rank, pct, onNavigate, onDropPriority, onNavigateTask, onCompleteTask }) {
  const cols = ["Urgent", "Medium", "Low"];
  const [dragOverCol, setDragOverCol] = useState(null);
  const tint = urgencyTint(pct);
  const critical = pct > 100;
  const handleDrop = (e, col) => {
    e.preventDefault();
    setDragOverCol(null);
    let payload;
    try { payload = JSON.parse(e.dataTransfer.getData("application/json")); } catch (err) { return; }
    if (!payload || payload.scope !== label) return; // strictly within-card only, same rule as the main dashboard
    onDropPriority(payload.id, dropPatchFor(col));
  };
  return (
    <div onClick={onNavigate} className="rounded-2xl p-5" style={{ ...card, borderRadius: 18, borderLeft: `4px solid ${accent}`, cursor: "pointer" }}>
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2 min-w-0">
          <span style={{ width: 28, height: 28, borderRadius: 99, background: accent, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 14, flexShrink: 0 }}>{rank}</span>
          <span style={{ fontSize: 17, flexShrink: 0 }}>{emoji}</span>
          <span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 16, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{label}</span>
        </div>
        <ArrowUpRight size={16} color={MUT} />
      </div>
      <div className="flex flex-col items-center text-center" style={{ padding: "6px 0 16px" }}>
        <Ring pct={Math.min(1, pct / 100)} tint={tint} size={148} thick={16} label={`${Math.round(pct)}%`} />
        {critical && <span style={{ fontSize: 10.5, fontWeight: 700, color: C.rose, letterSpacing: "0.03em", marginTop: 10 }}>⚠ CRITICAL — overloaded</span>}
      </div>
      <div className="grid gap-2.5" style={{ gridTemplateColumns: "repeat(3, 1fr)" }}>
        {cols.map((col) => {
          const items = tasks.filter((t) => t.bucket === col).sort((a, b) => b.score - a.score);
          return (
            <div key={col}
              onDragOver={(e) => { e.preventDefault(); if (dragOverCol !== col) setDragOverCol(col); }}
              onDragLeave={() => setDragOverCol((c) => (c === col ? null : c))}
              onDrop={(e) => handleDrop(e, col)}
              style={{ minWidth: 0, borderRadius: 10, padding: 4, margin: -4, background: dragOverCol === col ? `${PRIORITY_COL_TINT[col]}14` : "transparent", outline: dragOverCol === col ? `1px dashed ${PRIORITY_COL_TINT[col]}` : "none", transition: "background 0.1s" }}>
              <div style={{ fontSize: 11, letterSpacing: "0.04em", textTransform: "uppercase", color: PRIORITY_COL_TINT[col], fontWeight: 700, marginBottom: 6 }}>{col} <span style={{ color: MUT, fontWeight: 400 }}>{items.length}</span></div>
              <div className="flex flex-col gap-1.5">
                {items.map((t) => (
                  <div key={t.id} draggable onDragStart={(e) => { e.dataTransfer.setData("application/json", JSON.stringify({ id: t.id, scope: label })); e.dataTransfer.effectAllowed = "move"; }}
                    onClick={(e) => e.stopPropagation()} className="rounded-lg px-2 py-1.5 flex items-start gap-1.5"
                    style={{ background: C.soft, border: `1px solid ${LINE}`, borderLeft: `2px solid ${PRIORITY_COL_TINT[col]}`, cursor: "grab" }}>
                    <CompleteCheckbox onComplete={() => onCompleteTask(t)} mt={2} />
                    <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); onNavigateTask(t); }}>
                      <div style={{ fontSize: 12.5, lineHeight: 1.3 }}>{t.title}</div>
                      {t.daysUntilDue !== null && <div style={{ fontSize: 11, color: PRIORITY_COL_TINT[col], marginTop: 2 }}>{t.daysUntilDue < 0 ? `${-t.daysUntilDue}d overdue` : t.daysUntilDue === 0 ? "today" : `${t.daysUntilDue}d`}</div>}
                    </div>
                  </div>
                ))}
                {items.length === 0 && <div style={{ fontSize: 12, color: FAINT, padding: "4px 0" }}>—</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Creators({ data, setData, q, navRequest }) {
  const [selectedId, setSelectedId] = useState(data.creators[0] ? data.creators[0].id : null);
  /* a task-navigation request targeting a specific creator (navOpenId) switches straight to
  that creator's own subtab. */
  useEffect(() => {
    if (navRequest && navRequest.navTab === "mama" && navRequest.navSub === "creators" && navRequest.navOpenId) setSelectedId(navRequest.navOpenId);
  }, [navRequest]);
  const ql = (q || "").toLowerCase();
  const update = (id, patch) => setData((d) => ({ ...d, creators: d.creators.map((c) => (c.id === id ? { ...c, ...patch, updatedAt: Date.now() } : c)) }));
  const remove = (id) => setData((d) => ({ ...d, creators: d.creators.filter((c) => c.id !== id) }));
  const add = () => { const c = { id: uid(), name: "New creator", niche: "", bio: "", nextSteps: "", goals: [], aura: Math.floor(Math.random() * AURAS.length), links: [], notes: "", tasks: [], updatedAt: Date.now() }; setData((d) => ({ ...d, creators: [c, ...d.creators] })); setSelectedId(c.id); };
  const onRemove = (id) => {
    remove(id);
    if (selectedId === id) { const rest = data.creators.filter((c) => c.id !== id); setSelectedId(rest[0] ? rest[0].id : null); }
  };
  let list = data.creators;
  if (ql) list = list.filter((c) => c.name.toLowerCase().includes(ql) || (c.niche || "").toLowerCase().includes(ql));
  const selected = data.creators.find((c) => c.id === selectedId) || list[0] || null;
  return (
    <section>
      <SectionHead title="Creator roster" sub="Each creator gets their own page: bio, goals, links, tasks, and what to do next." action={<AddBtn onClick={add} label="Add creator" />} />
      <nav className="flex gap-2 mb-6 flex-wrap">
        {list.map((c) => {
          const on = selected && c.id === selected.id;
          const aura = AURAS[c.aura % AURAS.length];
          return (
            <button key={c.id} onClick={() => setSelectedId(c.id)} className="flex items-center gap-2 rounded-full px-4 py-2" style={{ background: on ? aura : C.card, border: `1px solid ${on ? aura : LINE}`, color: on ? "#fff" : C.ink, cursor: "pointer", fontSize: 14, fontWeight: on ? 600 : 400, fontFamily: "inherit" }}>
              <span style={{ width: 18, height: 18, borderRadius: 99, background: on ? "rgba(255,255,255,0.25)" : aura, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: "#fff" }}>{c.name.split(" ").map((w) => w[0]).slice(0, 2).join("")}</span>
              <span>{c.name}</span>
            </button>
          );
        })}
      </nav>
      {selected ? <CreatorDetailPage key={selected.id} c={selected} onUpdate={(p) => update(selected.id, p)} onRemove={() => onRemove(selected.id)} /> : <Empty text={ql ? "No creator matches your search." : "No creators yet."} />}
    </section>
  );
}

function CreatorDetailPage({ c, onUpdate, onRemove }) {
  const aura = AURAS[c.aura % AURAS.length];
  const [linkLabel, setLinkLabel] = useState(""); const [linkUrl, setLinkUrl] = useState("");
  const addLink = () => { if (!linkUrl.trim()) return; const url = linkUrl.trim().startsWith("http") ? linkUrl.trim() : `https://${linkUrl.trim()}`; onUpdate({ links: [...c.links, { id: uid(), label: linkLabel.trim() || url.replace(/^https?:\/\//, "").slice(0, 30), url }] }); setLinkLabel(""); setLinkUrl(""); };
  return (
