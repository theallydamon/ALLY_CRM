<!doctype html><meta charset="utf-8"><title>Task description checks</title>
<script src="../vendor/marked.js"></script><script src="../vendor/dompurify.js"></script><script src="../vendor/turndown.js"></script><script src="../vendor/turndown-plugin-gfm.js"></script><script src="../task-text.js"></script>
<main><h1>Task description checks</h1><pre id="results"></pre></main>
<script>
const checks=[];
function check(name,fn){try{fn();checks.push('PASS '+name)}catch(e){checks.push('FAIL '+name+': '+e.message)}}
function assert(value,message){if(!value)throw Error(message)}
function dom(html){const e=document.createElement('div');e.innerHTML=html;return e}
const markdown='## A formatted task\n\n**Keep this heading.**\n\n| Item | Priority | Notes |\n| --- | --- | --- |\n'+Array.from({length:7},(_,i)=>`| Item ${i+1} | Essential | Detail ${i+1} |`).join('\n');
check('Markdown paste preserves all 7 table rows, 3 columns and formatting',()=>{const e=dom(TaskText.render(markdown));assert(e.querySelectorAll('tbody tr').length===7,'row count');assert(e.querySelectorAll('td').length===21,'cell count');assert(e.querySelector('strong')&&e.querySelector('h2'),'formatting')});
check('Rich HTML clipboard round-trips into a table',()=>{const html=TaskText.render(markdown);const text=TaskText.fromClipboard(html,'A formatted task');const e=dom(TaskText.render(text));assert(e.querySelectorAll('tbody tr').length===7,'rows lost');assert(e.querySelector('td').textContent==='Item 1','cell text')});
check('Headerless spreadsheet clipboard tables remain tables',()=>{const e=dom(TaskText.render(TaskText.fromHtml('<table><tr><td>Name</td><td>Value</td></tr><tr><td>A</td><td>B</td></tr></table>')));assert(e.querySelectorAll('th').length===2&&e.querySelectorAll('td').length===2,'header/cells')});
check('Original Markdown clipboard wins over a plain HTML wrapper',()=>assert(TaskText.fromClipboard('<pre>'+markdown+'</pre>',markdown)===markdown,'Markdown changed'));
check('Plain legacy descriptions retain their text and line breaks',()=>{const e=dom(TaskText.render('Phone the office\nAsk about the form'));assert(e.textContent.includes('Phone the office')&&e.querySelector('br'),'legacy text')});
check('Earlier tab-separated clipboard tables render without repasting',()=>{const e=dom(TaskText.render('Existing note\nItem\tPriority\tNotes\nA\tEssential\tFirst\nB\tEssential\tSecond'));assert(e.querySelectorAll('tbody tr').length===2&&e.querySelectorAll('td').length===6,'legacy table lost');assert(e.textContent.includes('Existing note'),'intro lost')});
check('Tabbed code inside fences stays code',()=>{const e=dom(TaskText.render('```\nA\tB\nC\tD\nE\tF\n```'));assert(e.querySelector('pre code')&&!e.querySelector('table'),'code changed')});
check('Scripts, events, embedded images, external styles and unsafe links are removed',()=>{const e=dom(TaskText.render('<script>throw Error("unsafe")<\/script><img src="https://example.com/tracker" onerror="alert(1)"><a href="javascript:alert(1)" onclick="alert(1)">link</a><table style="position:fixed"><tr><td onmouseover="alert(1)">safe</td></tr></table>'));assert(!e.querySelector('script,img,[onclick],[onerror],[onmouseover],[style]'),'unsafe markup');assert(!e.querySelector('a[href]'),'unsafe href')});
check('HTTPS links use a separate protected tab',()=>{const a=dom(TaskText.render('[File](https://example.com/file)')).querySelector('a');assert(a.target==='_blank'&&a.rel.includes('noopener'),'link isolation')});
document.getElementById('results').textContent=checks.join('\n');document.body.dataset.result=checks.every(x=>x.startsWith('PASS'))?'passed':'failed';
</script>
